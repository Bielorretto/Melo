name: ft_strcpy
tags: ["piscine_c00", "exam_C_00"]

sources:
  - ft_strcpy.c

compile:
  compiler: cc
  flags: ["-Wall", "-Wextra", "-Werror"]
  extra: []

prelude: |
  #include <stdio.h>
  #include <string.h>
  char *ft_strcpy(char *dest, char *src);

tests:
  - name: "mot simple"
    input: 'char buf[20]; ft_strcpy(buf, "hello");'
    body: |
      char buf[20];
      ft_strcpy(buf, "hello");
      printf("%s\n", buf);
    expected_stdout: "hello\n"
    expected_exit: 0

  - name: "chaine vide"
    input: 'char buf[20]; ft_strcpy(buf, "");'
    body: |
      char buf[20];
      ft_strcpy(buf, "");
      printf("[%s]\n", buf);
    expected_stdout: "[]\n"
    expected_exit: 0

  - name: "retourne bien l'adresse de dest"
    input: 'char buf[20]; ft_strcpy(buf, "hello");'
    body: |
      char buf[20];
      char *ret = ft_strcpy(buf, "hello");
      printf("%s\n", ret == buf ? "retour = dest" : "retour != dest (il faut retourner dest)");
    expected_stdout: "retour = dest\n"
    expected_exit: 0

  - name: "copie le null terminator (pas de residu apres)"
    input: 'char buf[20] = "XXXXXXXXXXXXXXXXXXXX"; ft_strcpy(buf, "ab");'
    body: |
      char buf[20];
      int i;
      i = 0;
      while (i < 20)
      {
          buf[i] = 'X';
          i++;
      }
      ft_strcpy(buf, "ab");
      if (buf[2] == '\0')
          printf("buf[2] = '\\0'\n");
      else
          printf("buf[2] = '%c'\n", buf[2]);
    expected_stdout: "buf[2] = '\\0'\n"
    expected_exit: 0

  - name: "ne touche pas au-dela du null de src"
    input: 'char buf[20] = "ZZZZZZZZZZZZZZZZZZZZ"; ft_strcpy(buf, "ab");'
    body: |
      char buf[20];
      int i;
      i = 0;
      while (i < 20)
      {
          buf[i] = 'Z';
          i++;
      }
      ft_strcpy(buf, "ab");
      printf("buf[3] = '%c'\n", buf[3] ? buf[3] : '0');
    expected_stdout: "buf[3] = 'Z'\n"
    expected_exit: 0

  - name: "chaine longue"
    input: 'char dest[301]; ft_strcpy(dest, src);   (src = "abcdefghijklmnopqrstuvwxyzabcd...", 300 caracteres)'
    body: |
      char src[301];
      char dest[301];
      int i;
      i = 0;
      while (i < 300)
      {
          src[i] = 'a' + (i % 26);
          i++;
      }
      src[300] = '\0';
      ft_strcpy(dest, src);
      printf("%s\n", strcmp(src, dest) == 0 ? "dest identique a src" : "dest different de src");
    expected_stdout: "dest identique a src\n"
    expected_exit: 0

  - name: "caracteres speciaux"
    input: 'char buf[20]; ft_strcpy(buf, "a 1\t!@#");'
    body: |
      char buf[20];
      ft_strcpy(buf, "a 1\t!@#");
      printf("%s\n", buf);
    expected_stdout: "a 1\t!@#\n"
    expected_exit: 0