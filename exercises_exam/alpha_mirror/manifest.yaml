name: alpha_mirror
tags: ["common_core", "exam_CC_00"]
own_main: true

sources:
  - alpha_mirror.c

compile:
  compiler: cc
  flags: ["-Wall", "-Wextra", "-Werror"]
  extra: []

tests:
  - name: "mot simple (exemple du sujet)"
    args: ["abc"]
    expected_stdout: "zyx\n"
    expected_exit: 0

  - name: "phrase avec ponctuation et casse mixte (exemple du sujet)"
    args: ["My horse is Amazing."]
    expected_stdout: "Nb slihv rh Znzarmt.\n"
    expected_exit: 0

  - name: "miroir minuscule/majuscule"
    args: ["aZ"]
    expected_stdout: "zA\n"
    expected_exit: 0

  - name: "non-alphabétiques inchangés"
    args: ["123 !"]
    expected_stdout: "123 !\n"
    expected_exit: 0

  - name: "aucun argument"
    args: []
    expected_stdout: "\n"
    expected_exit: 0

  - name: "chaîne vide"
    args: [""]
    expected_stdout: "\n"
    expected_exit: 0

  - name: "deux arguments (pas 1 seul)"
    args: ["a", "b"]
    expected_stdout: "\n"
    expected_exit: 0
