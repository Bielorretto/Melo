name: ft_strlen
tags: ["piscine_c00", "exam_C_00"]

sources:
  - ft_strlen.c

compile:
  compiler: cc
  flags: ["-Wall", "-Wextra", "-Werror"]
  extra: []

prelude: |
  #include <stdio.h>
  int ft_strlen(char *str);

tests:
  - name: "chaine simple"
    body: |
      printf("%d\n", ft_strlen("hello"));
    expected_stdout: "5\n"
    expected_exit: 0

  - name: "chaine vide"
    body: |
      printf("%d\n", ft_strlen(""));
    expected_stdout: "0\n"
    expected_exit: 0

  - name: "un seul caractere"
    body: |
      printf("%d\n", ft_strlen("a"));
    expected_stdout: "1\n"
    expected_exit: 0

  - name: "espaces uniquement"
    body: |
      printf("%d\n", ft_strlen("   "));
    expected_stdout: "3\n"
    expected_exit: 0

  - name: "caracteres speciaux et chiffres"
    body: |
      printf("%d\n", ft_strlen("a1 !@#\t2"));
    expected_stdout: "8\n"
    expected_exit: 0

  - name: "ne compte pas au-dela du premier null"
    input: 'char s[6] = {''a'', ''b'', ''\0'', ''c'', ''d'', ''\0''}; ft_strlen(s)'
    body: |
      char s[6] = {'a', 'b', '\0', 'c', 'd', '\0'};
      printf("%d\n", ft_strlen(s));
    expected_stdout: "2\n"
    expected_exit: 0

  - name: "chaine longue"
    input: 'ft_strlen(big)   (big = "abcdefghijklmnopqrstuvwxyzabcd...", 3000 caracteres)'
    body: |
      char big[3001];
      int i = 0;
      while (i < 3000)
      {
          big[i] = 'a' + (i % 26);
          i++;
      }
      big[3000] = '\0';
      printf("%d\n", ft_strlen(big));
    expected_stdout: "3000\n"
    expected_exit: 0