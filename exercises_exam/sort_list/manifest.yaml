  - name: "les doublons sont conservés"
    input: 'liste {2, 1, 2}, cmp = ascending'
    main: |
      #include <stdio.h>
      #include <stdlib.h>
      #include "list.h"
      t_list *sort_list(t_list *lst, int (*cmp)(int, int));

      int ascending(int a, int b)
      {
          return (a <= b);
      }

      void print_list(t_list *lst)
