name: ft_strrev
tags: ["piscine_c00", "exam_C_00"]

sources:
  - ft_strrev.c

compile:
  compiler: cc
  flags: ["-Wall", "-Wextra", "-Werror"]
  extra: []

prelude: |
  #include <stdio.h>
  char *ft_strrev(char *str);

tests:
  - name: "mot simple"
    input: 'char s[] = "salut"; ft_strrev(s);'
    body: |
      char s[] = "salut";
      ft_strrev(s);
      printf("%s\n", s);
    expected_stdout: "tulas\n"
    expected_exit: 0

  - name: "chaine vide"
    input: 'char s[] = ""; ft_strrev(s);'
    body: |
      char s[] = "";
      ft_strrev(s);
      printf("[%s]\n", s);
    expected_stdout: "[]\n"
    expected_exit: 0

  - name: "un seul caractere"
    input: 'char s[] = "a"; ft_strrev(s);'
    body: |
      char s[] = "a";
      ft_strrev(s);
      printf("%s\n", s);
    expected_stdout: "a\n"
    expected_exit: 0

  - name: "longueur paire"
    input: 'char s[] = "abcd"; ft_strrev(s);'
    body: |
      char s[] = "abcd";
      ft_strrev(s);
      printf("%s\n", s);
    expected_stdout: "dcba\n"
    expected_exit: 0

  - name: "longueur impaire"
    input: 'char s[] = "abcde"; ft_strrev(s);'
    body: |
      char s[] = "abcde";
      ft_strrev(s);
      printf("%s\n", s);
    expected_stdout: "edcba\n"
    expected_exit: 0

  - name: "retourne bien l'adresse du parametre"
    input: 'char s[] = "hello"; ft_strrev(s);'
    body: |
      char s[] = "hello";
      char *ret = ft_strrev(s);
      printf("%s\n", ret == s ? "retour = s" : "retour != s (il faut retourner s)");
    expected_stdout: "retour = s\n"
    expected_exit: 0

  - name: "phrase avec espaces"
    input: 'char s[] = "bonjour toi"; ft_strrev(s);'
    body: |
      char s[] = "bonjour toi";
      ft_strrev(s);
      printf("%s\n", s);
    expected_stdout: "iot ruojnob\n"
    expected_exit: 0