name: ft_print_reverse_alphabet
tags: ["piscine_c00", "exam_C_00"]

sources:
  - ft_print_reverse_alphabet.c

compile:
  compiler: cc
  flags: ["-Wall", "-Wextra", "-Werror"]
  extra: []

prelude: |
  #include <unistd.h>
  void ft_print_reverse_alphabet(void);

tests:
  - name: "alphabet complet decroissant"
    body: |
      ft_print_reverse_alphabet();
    expected_stdout: "zyxwvutsrqponmlkjihgfedcba"
    expected_exit: 0

  - name: "pas de retour a la ligne en trop"
    input: 'ft_print_reverse_alphabet()'
    body: |
      ft_print_reverse_alphabet();
      write(1, "|FIN", 4);
    expected_stdout: "zyxwvutsrqponmlkjihgfedcba|FIN"
    expected_exit: 0