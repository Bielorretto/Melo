name: ft_print_a
tags: ["piscine", "ex0"]

sources:
  - ft_print_a.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

tests:

  - name: "affiche exactement 'a' et rien d'autre"
    input: 'ft_print_a()'
    main: |
      #include <unistd.h>
      void ft_print_a(void);
      int main(void)
      {
          ft_print_a();
          return (0);
      }
    expected_stdout: "a"
    expected_exit: 0

  - name: "pas de retour a la ligne en trop"
    input: 'ft_print_a()'
    # Verifie qu'il n'y a ni espace ni \n apres le 'a' (le sujet dit
    # explicitement "et rien d'autre").
    main: |
      #include <stdio.h>
      #include <string.h>
      #include <unistd.h>
      void ft_print_a(void);
      int main(void)
      {
          int pipefd[2];
          pipe(pipefd);
          int saved = dup(STDOUT_FILENO);
          dup2(pipefd[1], STDOUT_FILENO);
          close(pipefd[1]);

          ft_print_a();

          dup2(saved, STDOUT_FILENO);
          close(saved);

          char buffer[16];
          ssize_t n = read(pipefd[0], buffer, sizeof(buffer) - 1);
          close(pipefd[0]);

          if (n != 1 || buffer[0] != 'a')
          {
              buffer[n > 0 ? n : 0] = '\0';
              printf("obtenu : \"%s\" (%zd octet(s))\nattendu : \"a\" (1 octet, sans retour a la ligne)\n", buffer, n);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "appels multiples n'affichent pas d'etat residuel"
    input: 'ft_print_a(); ft_print_a(); ft_print_a();'
    main: |
      #include <unistd.h>
      void ft_print_a(void);
      int main(void)
      {
          ft_print_a();
          ft_print_a();
          ft_print_a();
          return (0);
      }
    expected_stdout: "aaa"
    expected_exit: 0