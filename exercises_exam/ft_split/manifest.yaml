name: ft_split
tags: ["piscine_c00", "exam_C_00"]

sources:
  - ft_split.c

compile:
  compiler: cc
  flags: ["-Wall", "-Wextra", "-Werror"]
  extra: []

prelude: |
  #include <stdio.h>
  #include <stdlib.h>
  char **ft_split(char *str, char sep);

  static void free_split(char **res)
  {
      int i;

      i = 0;
      while (res[i])
      {
          free(res[i]);
          i++;
      }
      free(res);
  }

  /* Affiche le tableau sous la forme {"mot", "mot", NULL}. */
  static void print_split(char **res)
  {
      int i;

      if (!res)
      {
          printf("NULL\n");
          return ;
      }
      printf("{");
      i = 0;
      while (res[i])
      {
          printf("\"%s\", ", res[i]);
          i++;
      }
      printf("NULL}\n");
  }

tests:
  - name: "mots separes par un espace simple"
    body: |
      char **res = ft_split("bonjour le monde", ' ');
      print_split(res);
      if (res)
          free_split(res);
    input: 'ft_split("bonjour le monde", '' '')'
    expected_stdout: "{\"bonjour\", \"le\", \"monde\", NULL}\n"
    expected_exit: 0
    check_memory: true

  - name: "separateurs consecutifs ignores"
    body: |
      char **res = ft_split("un   deux     trois", ' ');
      print_split(res);
      if (res)
          free_split(res);
    input: 'ft_split("un   deux     trois", '' '')'
    expected_stdout: "{\"un\", \"deux\", \"trois\", NULL}\n"
    expected_exit: 0
    check_memory: true

  - name: "separateurs en debut et fin"
    body: |
      char **res = ft_split("   hello world   ", ' ');
      print_split(res);
      if (res)
          free_split(res);
    input: 'ft_split("   hello world   ", '' '')'
    expected_stdout: "{\"hello\", \"world\", NULL}\n"
    expected_exit: 0
    check_memory: true

  - name: "chaine uniquement composee de separateurs"
    body: |
      char **res = ft_split("     ", ' ');
      print_split(res);
      if (res)
          free_split(res);
    input: 'ft_split("     ", '' '')'
    expected_stdout: "{NULL}\n"
    expected_exit: 0
    check_memory: true

  - name: "chaine vide"
    body: |
      char **res = ft_split("", ' ');
      print_split(res);
      if (res)
          free_split(res);
    input: 'ft_split("", '' '')'
    expected_stdout: "{NULL}\n"
    expected_exit: 0
    check_memory: true

  - name: "aucun separateur present (un seul mot)"
    body: |
      char **res = ft_split("bonjour", ' ');
      print_split(res);
      if (res)
          free_split(res);
    input: 'ft_split("bonjour", '' '')'
    expected_stdout: "{\"bonjour\", NULL}\n"
    expected_exit: 0
    check_memory: true

  - name: "separateur different d'un espace"
    body: |
      char **res = ft_split("a,b,,c", ',');
      print_split(res);
      if (res)
          free_split(res);
    input: 'ft_split("a,b,,c", '','')'
    expected_stdout: "{\"a\", \"b\", \"c\", NULL}\n"
    expected_exit: 0
    check_memory: true

  - name: "tableau bien termine par NULL (pas de lecture hors bornes)"
    body: |
      char **res = ft_split("x y z", ' ');
      print_split(res);
      if (res)
          free_split(res);
    input: 'ft_split("x y z", '' '')'
    expected_stdout: "{\"x\", \"y\", \"z\", NULL}\n"
    expected_exit: 0
    check_memory: true
