name: ft_list_remove_if
tags: ["common_core", "exam_CC_00"]

sources:
  - ft_list_remove_if.c
  - ft_list.h

compile:
  compiler: cc
  flags: ["-Wall", "-Wextra", "-Werror"]
  extra: []

tests:
  - name: "supprime les occurrences au milieu"
    input: 'liste {1, 2, 3, 2, 4}, remove 2'
    main: |
      #include <stdio.h>
      #include <stdlib.h>
      #include "ft_list.h"
      void ft_list_remove_if(t_list **begin_list, void *data_ref, int (*cmp)());

      int cmp_int(void *a, void *b)
      {
          return (*(int *)a == *(int *)b) ? 0 : 1;
      }

      void print_list(t_list *lst)
      {
          while (lst)
          {
              printf("%d ", *(int *)lst->data);
              lst = lst->next;
          }
          printf("\n");
      }

      void free_list(t_list *lst)
      {
          t_list *tmp;

          while (lst)
          {
              tmp = lst->next;
              free(lst);
              lst = tmp;
          }
      }

      int main(void)
      {
          int v1 = 1, v2 = 2, v3 = 3, v4 = 2, v5 = 4;
          int ref = 2;
          t_list *a = malloc(sizeof(t_list));
          t_list *b = malloc(sizeof(t_list));
          t_list *c = malloc(sizeof(t_list));
          t_list *d = malloc(sizeof(t_list));
          t_list *e = malloc(sizeof(t_list));

          a->data = &v1; a->next = b;
          b->data = &v2; b->next = c;
          c->data = &v3; c->next = d;
          d->data = &v4; d->next = e;
          e->data = &v5; e->next = NULL;
          ft_list_remove_if(&a, &ref, cmp_int);
          print_list(a);
          free_list(a);
          return (0);
      }
    expected_stdout: "1 3 4 \n"
    expected_exit: 0
    check_memory: true

