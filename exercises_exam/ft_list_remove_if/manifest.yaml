  - name: "liste vide (NULL) ne plante pas"
    input: 'ft_list_remove_if sur liste NULL'
    main: |
      #include <stdio.h>
      #include "ft_list.h"
      void ft_list_remove_if(t_list **begin_list, void *data_ref, int (*cmp)());

      int cmp_int(void *a, void *b)
      {
          return (*(int *)a == *(int *)b) ? 0 : 1;
      }

      int main(void)
      {
          int ref = 1;
          t_list *a = NULL;

          ft_list_remove_if(&a, &ref, cmp_int);
          printf("ok\n");
          return (0);
      }
    expected_stdout: "ok\n"
    expected_exit: 0

