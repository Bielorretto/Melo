# Projet Common Core : Libft (sujet v1.3)
# Utilisé par core/project.py : ./cli.py test libft <dossier_du_rendu>

name: libft
header: libft.h
library: libft.a

compile:
  compiler: cc
  flags: ["-Wall", "-Wextra", "-Werror"]

# Fichiers obligatoires à la racine du dépôt.
required_files: [Makefile, libft.h, README.md]
# Tout fichier rendu doit correspondre à un de ces motifs ("Turning in unused files is forbidden").
allowed_files: [Makefile, libft.h, README.md, "ft_*.c", .gitignore]

# Règles imposées : $(NAME) est ajoutée automatiquement.
makefile_rules: [all, clean, fclean, re]

readme:
  first_line: 'This activity has been created as part of the 42 curriculum by'
  sections: [Description, Instructions, Resources]

# Fonctions externes autorisées pour un fichier qui ne contient pas de fonction du sujet.
default_allowed: [malloc, free, write]

# Prototype exact du sujet + fonctions externes autorisées.
# "prototype" peut être une liste : n'importe laquelle est acceptée.
# "rule" : la règle du sujet ou du man, affichée sous un test en échec
# (un test peut la remplacer avec sa propre clé "rule" dans son manifest).
functions:
  # --- Part 1 : libc ---
  ft_isalpha:  {prototype: "int ft_isalpha(int c)", allowed: [],
                rule: "man isalpha : non nul si c est une lettre (a-z, A-Z), 0 sinon"}
  ft_isdigit:  {prototype: "int ft_isdigit(int c)", allowed: [],
                rule: "man isdigit : non nul si c est un chiffre (0-9), 0 sinon"}
  ft_isalnum:  {prototype: "int ft_isalnum(int c)", allowed: [],
                rule: "man isalnum : non nul si c est une lettre ou un chiffre, 0 sinon"}
  ft_isascii:  {prototype: "int ft_isascii(int c)", allowed: [],
                rule: "man isascii : non nul si 0 <= c <= 127, 0 sinon"}
  ft_isprint:  {prototype: "int ft_isprint(int c)", allowed: [],
                rule: "man isprint : non nul si c est imprimable (32 à 126), 0 sinon"}
  ft_strlen:   {prototype: "size_t ft_strlen(const char *s)", allowed: [],
                rule: "man strlen : nombre de caractères avant le '\0'"}
  ft_memset:   {prototype: "void *ft_memset(void *b, int c, size_t len)", allowed: [],
                rule: "man memset : écrit len octets de valeur (unsigned char)c dans b, renvoie b"}
  ft_bzero:    {prototype: "void ft_bzero(void *s, size_t n)", allowed: [],
                rule: "man bzero : écrit n octets à 0 dans s"}
  ft_memcpy:   {prototype: "void *ft_memcpy(void *dst, const void *src, size_t n)", allowed: [],
                rule: "man memcpy : copie n octets de src vers dst, renvoie dst"}
  ft_memmove:  {prototype: "void *ft_memmove(void *dst, const void *src, size_t len)", allowed: [],
                rule: "man memmove : copie len octets même si les zones se chevauchent, renvoie dst"}
  ft_strlcpy:  {prototype: "size_t ft_strlcpy(char *dst, const char *src, size_t size)", allowed: [],
                rule: "man strlcpy : copie au plus size - 1 caractères, termine par '\0' si size > 0, renvoie strlen(src)"}
  ft_strlcat:  {prototype: "size_t ft_strlcat(char *dst, const char *src, size_t size)", allowed: [],
                rule: "man strlcat : ajoute src à dst sans dépasser size - 1 caractères au total, renvoie la longueur qu'il aurait fallu (min(size, strlen(dst)) + strlen(src))"}
  ft_toupper:  {prototype: "int ft_toupper(int c)", allowed: [],
                rule: "man toupper : la majuscule si c est une minuscule, sinon c inchangé"}
  ft_tolower:  {prototype: "int ft_tolower(int c)", allowed: [],
                rule: "man tolower : la minuscule si c est une majuscule, sinon c inchangé"}
  ft_strchr:   {prototype: "char *ft_strchr(const char *s, int c)", allowed: [],
                rule: "man strchr : pointeur sur la première occurrence de (char)c, '\0' compris, ou NULL"}
  ft_strrchr:  {prototype: "char *ft_strrchr(const char *s, int c)", allowed: [],
                rule: "man strrchr : pointeur sur la dernière occurrence de (char)c, '\0' compris, ou NULL"}
  ft_strncmp:  {prototype: "int ft_strncmp(const char *s1, const char *s2, size_t n)", allowed: [],
                rule: "man strncmp : compare au plus n caractères en unsigned char, s'arrête au premier '\0' ; seul le signe compte"}
  ft_memchr:   {prototype: "void *ft_memchr(const void *s, int c, size_t n)", allowed: [],
                rule: "man memchr : pointeur sur le premier octet égal à (unsigned char)c dans les n premiers, ou NULL"}
  ft_memcmp:   {prototype: "int ft_memcmp(const void *s1, const void *s2, size_t n)", allowed: [],
                rule: "man memcmp : compare n octets en unsigned char ; seul le signe compte"}
  ft_strnstr:  {prototype: "char *ft_strnstr(const char *big, const char *little, size_t len)", allowed: [],
                rule: "man strnstr : première occurrence de little dans les len premiers caractères de big ; big si little est vide, NULL sinon"}
  ft_atoi:     {prototype: "int ft_atoi(const char *nptr)", allowed: [],
                rule: "man atoi : espaces (isspace), un seul signe + ou -, puis les chiffres ; s'arrête au premier non-chiffre"}
  ft_calloc:   {prototype: "void *ft_calloc(size_t nmemb, size_t size)", allowed: [malloc],
                rule: "man calloc : nmemb * size octets alloués avec malloc et mis à 0 ; NULL si malloc échoue"}
  ft_strdup:   {prototype: "char *ft_strdup(const char *s)", allowed: [malloc],
                rule: "man strdup : copie de s allouée avec malloc ; NULL si malloc échoue"}
  # --- Part 2 : fonctions additionnelles ---
  ft_substr:   {prototype: "char *ft_substr(char const *s, unsigned int start, size_t len)", allowed: [malloc],
                rule: "sujet : sous-chaîne de s qui commence à start, de longueur max len ; chaîne vide si start >= strlen(s) ; NULL si malloc échoue"}
  ft_strjoin:  {prototype: "char *ft_strjoin(char const *s1, char const *s2)", allowed: [malloc],
                rule: "sujet : nouvelle chaîne s1 + s2 allouée avec malloc ; NULL si malloc échoue"}
  ft_strtrim:  {prototype: "char *ft_strtrim(char const *s1, char const *set)", allowed: [malloc],
                rule: "sujet : copie de s1 sans les caractères de set au début et à la fin ; NULL si malloc échoue"}
  ft_split:    {prototype: "char **ft_split(char const *s, char c)", allowed: [malloc, free],
                rule: "sujet : tableau des mots de s séparés par c, terminé par NULL ; aucun mot vide ; NULL si une allocation échoue"}
  ft_itoa:     {prototype: "char *ft_itoa(int n)", allowed: [malloc],
                rule: "sujet : n en chaîne, négatifs compris (INT_MIN aussi) ; NULL si malloc échoue"}
  ft_strmapi:  {prototype: "char *ft_strmapi(char const *s, char (*f)(unsigned int, char))", allowed: [malloc],
                rule: "sujet : nouvelle chaîne où chaque caractère vaut f(index, s[index]) ; NULL si malloc échoue"}
  ft_striteri: {prototype: "void ft_striteri(char *s, void (*f)(unsigned int, char *))", allowed: [],
                rule: "sujet : appelle f(index, &s[index]) sur chaque caractère de s, dans l'ordre"}
  ft_putchar_fd: {prototype: "void ft_putchar_fd(char c, int fd)", allowed: [write],
                  rule: "sujet : écrit le caractère c sur le fd donné"}
  ft_putstr_fd:  {prototype: "void ft_putstr_fd(char *s, int fd)", allowed: [write],
                  rule: "sujet : écrit la chaîne s sur le fd donné"}
  ft_putendl_fd: {prototype: "void ft_putendl_fd(char *s, int fd)", allowed: [write],
                  rule: "sujet : écrit la chaîne s puis un '\n' sur le fd donné"}
  ft_putnbr_fd:  {prototype: "void ft_putnbr_fd(int n, int fd)", allowed: [write],
                  rule: "sujet : écrit l'entier n en base 10 sur le fd donné, INT_MIN compris"}
  # --- Part 3 : listes chaînées ---
  ft_lstnew:       {prototype: "t_list *ft_lstnew(void *content)", allowed: [malloc],
                    rule: "sujet : nouveau maillon (malloc) avec content = le paramètre et next = NULL"}
  ft_lstadd_front: {prototype: "void ft_lstadd_front(t_list **lst, t_list *new)", allowed: [],
                    rule: "sujet : ajoute new au début de la liste (*lst pointe ensuite sur new)"}
  # Le sujet v1.3 dit unsigned int ; les versions précédentes disaient int : les deux sont acceptés.
  ft_lstsize:      {prototype: ["unsigned int ft_lstsize(t_list *lst)", "int ft_lstsize(t_list *lst)"], allowed: [],
                    rule: "sujet : nombre de maillons de la liste"}
  ft_lstlast:      {prototype: "t_list *ft_lstlast(t_list *lst)", allowed: [],
                    rule: "sujet : dernier maillon de la liste (NULL si la liste est vide)"}
  ft_lstadd_back:  {prototype: "void ft_lstadd_back(t_list **lst, t_list *new)", allowed: [],
                    rule: "sujet : ajoute new à la fin de la liste (*lst = new si la liste est vide)"}
  ft_lstdelone:    {prototype: "void ft_lstdelone(t_list *lst, void (*del)(void *))", allowed: [free],
                    rule: "sujet : appelle del sur le content du maillon puis free le maillon ; ne touche pas à next"}
  ft_lstclear:     {prototype: "void ft_lstclear(t_list **lst, void (*del)(void *))", allowed: [free],
                    rule: "sujet : del + free sur chaque maillon à partir de *lst, puis *lst = NULL"}
  ft_lstiter:      {prototype: "void ft_lstiter(t_list *lst, void (*f)(void *))", allowed: [],
                    rule: "sujet : appelle f sur le content de chaque maillon"}
  ft_lstmap:       {prototype: "t_list *ft_lstmap(t_list *lst, void *(*f)(void *), void (*del)(void *))", allowed: [malloc, free],
                    rule: "sujet : nouvelle liste avec f appliquée à chaque content ; si une allocation échoue, tout libérer (del) et renvoyer NULL"}
