name: ft_strnstr
prelude: |
  #include "melo.h"
  static inline int check(const char *big, const char *little, size_t len, size_t exp_off, int found)
  {
      char *r = ft_strnstr(big, little, len);
      char *exp = found ? (char *)big + exp_off : NULL;
      if (r != exp)
      {
          printf("obtenu : ft_strnstr(");
          melo_s(big);
          printf(", ");
          melo_s(little);
          printf(", %zu) = ", len);
          melo_ptr(big, strlen(big), r);
          printf("\nattendu : ");
          melo_ptr(big, strlen(big), exp);
          printf("\n");
          return (1);
      }
      return (0);
  }
test_defaults:
  expected_exit: 0
  check_memory: true
tests:
- name: trouve little dans big
  input: ft_strnstr("Hello world", "world", 11)
  body: |
    if (check("Hello world", "world", 11, 6, 1))
        return (1);
- name: 'absent : NULL'
  input: ft_strnstr("Hello world", "word", 11)
  body: |
    if (check("Hello world", "word", 11, 0, 0))
        return (1);
- name: 'little vide : renvoie big'
  input: ft_strnstr("Hello", "", 5) et ft_strnstr("Hello", "", 0)
  body: |
    if (check("Hello", "", 5, 0, 1) || check("Hello", "", 0, 0, 1))
        return (1);
- name: ne cherche pas au-delà de len
  input: ft_strnstr("Hello world", "world", 10)
  body: |
    if (check("Hello world", "world", 10, 0, 0))
        return (1);
- name: 'len = 0 : NULL'
  input: ft_strnstr("abc", "a", 0)
  body: |
    if (check("abc", "a", 0, 0, 0))
        return (1);
- name: len plus grand que big
  input: ft_strnstr("abc", "c", 100) et ft_strnstr("abc", "cd", 100)
  body: |
    if (check("abc", "c", 100, 2, 1) || check("abc", "cd", 100, 0, 0))
        return (1);
- name: début de correspondance raté puis trouvé
  input: ft_strnstr("aaab", "aab", 4)
  body: |
    if (check("aaab", "aab", 4, 1, 1))
        return (1);
- name: little plus long que big
  input: ft_strnstr("ab", "abc", 10)
  body: |
    if (check("ab", "abc", 10, 0, 0))
        return (1);
- name: big vide
  input: ft_strnstr("", "", 0) et ft_strnstr("", "a", 1)
  body: |
    if (check("", "", 0, 0, 1) || check("", "a", 1, 0, 0))
        return (1);
