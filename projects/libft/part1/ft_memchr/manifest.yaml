name: ft_memchr
prelude: |
  #include "melo.h"
test_defaults:
  expected_exit: 0
  check_memory: true
tests:
- name: trouve la première occurrence
  input: ft_memchr("hello", 'l', 5)
  body: |
    const char *s = "hello";
    void *r = ft_memchr(s, 'l', 5);
    if (r != s + 2)
        return (melo_ko_ptr(s, 5, r, s + 2));
- name: 'absent : NULL'
  input: ft_memchr("hello", 'z', 5)
  body: |
    const char *s = "hello";
    void *r = ft_memchr(s, 'z', 5);
    if (r != NULL)
        return (melo_ko_ptr(s, 5, r, NULL));
- name: ne cherche pas au-delà de n
  input: ft_memchr("hello", 'o', 4)
  body: |
    const char *s = "hello";
    void *r = ft_memchr(s, 'o', 4);
    if (r != NULL)
        return (melo_ko_ptr(s, 5, r, NULL));
- name: ne s'arrête pas au \0
  input: ft_memchr("ab\0cd", 'c', 5)
  body: |
    const char s[] = "ab\0cd";
    void *r = ft_memchr(s, 'c', 5);
    if (r != s + 3)
        return (melo_ko_ptr(s, 5, r, s + 3));
- name: cherche aussi le \0
  input: ft_memchr("ab\0cd", '\0', 5)
  body: |
    const char s[] = "ab\0cd";
    void *r = ft_memchr(s, '\0', 5);
    if (r != s + 2)
        return (melo_ko_ptr(s, 5, r, s + 2));
- name: c est converti en unsigned char
  input: ft_memchr("a\377b", -1, 3) et ft_memchr("xay", 'a' + 256, 3)
  body: |
    const char *s = "a\377b";
    void *r = ft_memchr(s, -1, 3);
    if (r != s + 1)
        return (melo_ko_ptr(s, 3, r, s + 1));
    const char *t = "xay";
    r = ft_memchr(t, 'a' + 256, 3);
    if (r != t + 1)
        return (melo_ko_ptr(t, 3, r, t + 1));
- name: 'n = 0 : NULL'
  input: ft_memchr("hello", 'h', 0)
  body: |
    const char *s = "hello";
    void *r = ft_memchr(s, 'h', 0);
    if (r != NULL)
        return (melo_ko_ptr(s, 5, r, NULL));
