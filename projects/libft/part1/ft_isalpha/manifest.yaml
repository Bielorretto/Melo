name: ft_isalpha
prelude: |
  #include "melo.h"
test_defaults:
  expected_exit: 0
tests:
- name: renvoie exactement 1 pour une lettre
  rule: "Melo attend exactement 1 ou 0 (le man dit seulement « non nul » : la vraie isalpha peut renvoyer autre chose, ex. 1024)"
  input: ft_isalpha(c) pour c dans {'a', 'z', 'A', 'Z', 'm'}
  body: |
    int tab[] = {'a', 'z', 'A', 'Z', 'm'};
    for (size_t i = 0; i < sizeof(tab) / sizeof(*tab); i++)
        if (ft_isalpha(tab[i]) != 1)
        {
            printf("obtenu : ft_isalpha(%d) = %d\nattendu : ft_isalpha(%d) = 1\n", tab[i], ft_isalpha(tab[i]), tab[i]);
            return (1);
        }
- name: renvoie 0 pour les autres caractères
  input: ft_isalpha(c) pour c dans {'0', '@', '[', '`', '{', ' ', 0}
  body: |
    int tab[] = {'0', '@', '[', '`', '{', ' ', 0};
    for (size_t i = 0; i < sizeof(tab) / sizeof(*tab); i++)
        if (ft_isalpha(tab[i]) != 0)
        {
            printf("obtenu : ft_isalpha(%d) = %d\nattendu : ft_isalpha(%d) = 0\n", tab[i], ft_isalpha(tab[i]), tab[i]);
            return (1);
        }
- name: même résultat que isalpha de 0 à 255, et seulement 1 ou 0
  rule: "Melo attend exactement 1 ou 0 (le man dit seulement « non nul » : la vraie isalpha peut renvoyer autre chose, ex. 1024)"
  input: ft_isalpha(c) pour c de 0 à 255
  body: |
    for (int c = 0; c <= 255; c++)
    {
        int exp = isalpha(c) ? 1 : 0;
        if (ft_isalpha(c) != exp)
        {
            printf("obtenu : ft_isalpha(%d) = %d\nattendu : ft_isalpha(%d) = %d\n", c, ft_isalpha(c), c, exp);
            return (1);
        }
    }
- name: EOF (-1) renvoie 0
  input: ft_isalpha(EOF)
  body: |
    if (ft_isalpha(EOF) != 0)
        return (melo_ko_i(ft_isalpha(EOF), 0));
