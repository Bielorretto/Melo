name: ft_strncmp
prelude: |
  #include "melo.h"
  static inline int check_cmp(const char *call, int got, int exp)
  {
      if (melo_sign(got) != melo_sign(exp))
      {
          printf("obtenu : %s = %d (%s)\nattendu : %s (%s)\n", call, got, melo_sign_txt(got), melo_sign_txt(exp), exp == 0 ? "égal" : "différent");
          return (1);
      }
      return (0);
  }
test_defaults:
  expected_exit: 0
tests:
- name: chaînes égales
  input: ft_strncmp("hello", "hello", 5)
  body: |
    if (check_cmp("ft_strncmp(\"hello\", \"hello\", 5)", ft_strncmp("hello", "hello", 5), 0))
        return (1);
- name: différence avant n (signe comme strncmp)
  input: ft_strncmp("abcd", "abce", 4) et l'inverse
  body: |
    if (check_cmp("ft_strncmp(\"abcd\", \"abce\", 4)", ft_strncmp("abcd", "abce", 4), strncmp("abcd", "abce", 4)))
        return (1);
    if (check_cmp("ft_strncmp(\"abce\", \"abcd\", 4)", ft_strncmp("abce", "abcd", 4), strncmp("abce", "abcd", 4)))
        return (1);
- name: 'différence après n : 0'
  input: ft_strncmp("abcd", "abce", 3)
  body: |
    if (check_cmp("ft_strncmp(\"abcd\", \"abce\", 3)", ft_strncmp("abcd", "abce", 3), 0))
        return (1);
- name: 'n = 0 : 0'
  input: ft_strncmp("abc", "xyz", 0)
  body: |
    if (check_cmp("ft_strncmp(\"abc\", \"xyz\", 0)", ft_strncmp("abc", "xyz", 0), 0))
        return (1);
- name: une chaîne préfixe de l'autre
  input: ft_strncmp("abc", "abcd", 4) et ft_strncmp("abcd", "abc", 10)
  body: |
    if (check_cmp("ft_strncmp(\"abc\", \"abcd\", 4)", ft_strncmp("abc", "abcd", 4), -1))
        return (1);
    if (check_cmp("ft_strncmp(\"abcd\", \"abc\", 10)", ft_strncmp("abcd", "abc", 10), 1))
        return (1);
- name: s'arrête au \0 même si n est plus grand
  input: ft_strncmp("ab\0x", "ab\0y", 5)
  body: |
    if (check_cmp("ft_strncmp(\"ab\\0x\", \"ab\\0y\", 5)", ft_strncmp("ab\0x", "ab\0y", 5), 0))
        return (1);
- name: compare en unsigned char (octets > 127)
  input: ft_strncmp("\200", "\0", 1) et ft_strncmp("test\200", "test\0", 6)
  body: |
    if (check_cmp("ft_strncmp(\"\\200\", \"\\0\", 1)", ft_strncmp("\200", "\0", 1), 1))
        return (1);
    if (check_cmp("ft_strncmp(\"test\\200\", \"test\\0\", 6)", ft_strncmp("test\200", "test\0", 6), 1))
        return (1);
    if (check_cmp("ft_strncmp(\"a\", \"\\377\", 1)", ft_strncmp("a", "\377", 1), -1))
        return (1);
- name: chaînes vides
  input: ft_strncmp("", "", 5) et ft_strncmp("", "a", 1)
  body: |
    if (check_cmp("ft_strncmp(\"\", \"\", 5)", ft_strncmp("", "", 5), 0))
        return (1);
    if (check_cmp("ft_strncmp(\"\", \"a\", 1)", ft_strncmp("", "a", 1), -1))
        return (1);
# --- Cas repris du libftTester de Tripouille (github.com/Tripouille/libftTester) ---
- name: n = SIZE_MAX, majuscules, préfixes et chaînes vides
  input: ft_strncmp(s1, s2, n) pour 14 cas du libftTester (signe comparé à strncmp)
  body: |
    struct s_case { const char *a; const char *b; size_t n; };
    const struct s_case c[] = {
        {"t", "", 0}, {"1234", "1235", 3}, {"1234", "1235", 4},
        {"1234", "1235", (size_t)-1}, {"", "", 42},
        {"Tripouille", "Tripouille", 42}, {"Tripouille", "tripouille", 42},
        {"Tripouille", "TriPouille", 42}, {"Tripouille", "TripouillE", 42},
        {"Tripouille", "TripouilleX", 42}, {"Tripouille", "Tripouill", 42},
        {"", "1", 0}, {"1", "", 0}, {"", "1", 1}, {"1", "", 1}, {"", "", 1},
    };
    for (size_t i = 0; i < sizeof(c) / sizeof(*c); i++)
    {
        volatile size_t n = c[i].n;
        int got = ft_strncmp(c[i].a, c[i].b, n);
        int exp = strncmp(c[i].a, c[i].b, n);
        if (melo_sign(got) != melo_sign(exp))
        {
            char sz[32];
            if (c[i].n == (size_t)-1)
                snprintf(sz, sizeof(sz), "SIZE_MAX");
            else
                snprintf(sz, sizeof(sz), "%zu", c[i].n);
            printf("obtenu : ft_strncmp(\"%s\", \"%s\", %s) = %s (%d)\n", c[i].a, c[i].b, sz, melo_sign_txt(got), got);
            printf("attendu : ft_strncmp(\"%s\", \"%s\", %s) = %s\n", c[i].a, c[i].b, sz, melo_sign_txt(exp));
            return (1);
        }
    }
- name: caractères négatifs (SCHAR_MIN, -42) comparés en unsigned char
  input: ft_strncmp("test", s2, 4) avec s2[3] = SCHAR_MIN puis -42
  body: |
    signed char vals[] = {SCHAR_MIN, -42};
    for (int i = 0; i < 2; i++)
    {
        char s1[] = "test";
        char s2[] = "test";
        s2[3] = (char)vals[i];
        int got = ft_strncmp(s1, s2, 4);
        int exp = strncmp(s1, s2, 4);
        if (melo_sign(got) != melo_sign(exp))
        {
            printf("obtenu : ft_strncmp(\"test\", \"tes\\%03o\", 4) = %s (%d)\n", (unsigned char)s2[3], melo_sign_txt(got), got);
            printf("attendu : ft_strncmp(\"test\", \"tes\\%03o\", 4) = %s\n", (unsigned char)s2[3], melo_sign_txt(exp));
            return (1);
        }
    }
