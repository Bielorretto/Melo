name: ft_isprint
prelude: |
  #include "melo.h"
test_defaults:
  expected_exit: 0
tests:
- name: renvoie exactement 1 pour un caractère imprimable (32 à 126)
  rule: "Melo attend exactement 1 ou 0 (le man dit seulement « non nul » : la vraie isprint peut renvoyer autre chose, ex. 1024)"
  input: ft_isprint(c) pour c dans {' ', '~', 'a', '0'}
  body: |
    int tab[] = {' ', '~', 'a', '0'};
    for (size_t i = 0; i < sizeof(tab) / sizeof(*tab); i++)
        if (ft_isprint(tab[i]) != 1)
        {
            printf("obtenu : ft_isprint(%d) = %d\nattendu : ft_isprint(%d) = 1\n", tab[i], ft_isprint(tab[i]), tab[i]);
            return (1);
        }
- name: renvoie 0 pour les autres caractères
  input: ft_isprint(c) pour c dans {31, 127, '\n', '\t', 0, 128}
  body: |
    int tab[] = {31, 127, '\n', '\t', 0, 128};
    for (size_t i = 0; i < sizeof(tab) / sizeof(*tab); i++)
        if (ft_isprint(tab[i]) != 0)
        {
            printf("obtenu : ft_isprint(%d) = %d\nattendu : ft_isprint(%d) = 0\n", tab[i], ft_isprint(tab[i]), tab[i]);
            return (1);
        }
- name: même résultat que isprint de 0 à 255, et seulement 1 ou 0
  rule: "Melo attend exactement 1 ou 0 (le man dit seulement « non nul » : la vraie isprint peut renvoyer autre chose, ex. 1024)"
  input: ft_isprint(c) pour c de 0 à 255
  body: |
    for (int c = 0; c <= 255; c++)
    {
        int exp = isprint(c) ? 1 : 0;
        if (ft_isprint(c) != exp)
        {
            printf("obtenu : ft_isprint(%d) = %d\nattendu : ft_isprint(%d) = %d\n", c, ft_isprint(c), c, exp);
            return (1);
        }
    }
- name: EOF (-1) renvoie 0
  input: ft_isprint(EOF)
  body: |
    if (ft_isprint(EOF) != 0)
        return (melo_ko_i(ft_isprint(EOF), 0));
