name: ft_strlcat
prelude: |
  #include "melo.h"
test_defaults:
  expected_exit: 0
  check_memory: true
tests:
- name: concatène quand il y a la place
  input: dst = "abc" ; ft_strlcat(dst, "def", 20)
  body: |
    char dst[20] = "abc";
    size_t r = ft_strlcat(dst, "def", 20);
    if (strcmp(dst, "abcdef") != 0)
        return (melo_ko_s(dst, "abcdef"));
    if (r != 6)
        return (melo_ko_i(r, 6));
- name: tronque pour que dst fasse size - 1 caractères
  input: dst = "abc" ; ft_strlcat(dst, "defgh", 6)
  body: |
    char dst[20] = "abc";
    size_t r = ft_strlcat(dst, "defgh", 6);
    if (strcmp(dst, "abcde") != 0)
        return (melo_ko_s(dst, "abcde"));
    if (r != 8)
        return (melo_ko_txt("mauvaise valeur de retour", "8 (longueur de dst + longueur de src)"));
- name: 'size <= longueur de dst : dst intact, renvoie size + longueur de src'
  input: dst = "abcdef" ; ft_strlcat(dst, "xyz", 3)
  body: |
    char dst[20] = "abcdef";
    size_t r = ft_strlcat(dst, "xyz", 3);
    if (strcmp(dst, "abcdef") != 0)
        return (melo_ko_s(dst, "abcdef"));
    if (r != 6)
        return (melo_ko_i(r, 6));
- name: 'size = 0 : renvoie la longueur de src'
  input: dst = "abc" ; ft_strlcat(dst, "hello", 0)
  body: |
    char dst[20] = "abc";
    size_t r = ft_strlcat(dst, "hello", 0);
    if (strcmp(dst, "abc") != 0)
        return (melo_ko_s(dst, "abc"));
    if (r != 5)
        return (melo_ko_i(r, 5));
- name: remplit exactement le buffer
  input: dst = "ab" ; ft_strlcat(dst, "cd", 5)
  body: |
    char dst[5] = "ab";
    size_t r = ft_strlcat(dst, "cd", 5);
    if (strcmp(dst, "abcd") != 0)
        return (melo_ko_s(dst, "abcd"));
    if (r != 4)
        return (melo_ko_i(r, 4));
- name: dst vide et src vide
  input: ft_strlcat("", "abc", 10) puis ft_strlcat("abc", "", 10)
  body: |
    char a[10] = "";
    char b[10] = "abc";
    size_t r1 = ft_strlcat(a, "abc", 10);
    size_t r2 = ft_strlcat(b, "", 10);
    if (strcmp(a, "abc") != 0)
        return (melo_ko_s(a, "abc"));
    if (r1 != 3)
        return (melo_ko_i(r1, 3));
    if (strcmp(b, "abc") != 0)
        return (melo_ko_s(b, "abc"));
    if (r2 != 3)
        return (melo_ko_i(r2, 3));
- name: n'écrit jamais au-delà de size
  input: dst = "ab" (buffer rempli de 'Z') ; ft_strlcat(dst, "cdefgh", 5)
  body: |
    char dst[10];
    memset(dst, 'Z', 10);
    memcpy(dst, "ab", 3);
    ft_strlcat(dst, "cdefgh", 5);
    if (memcmp(dst, "abcd\0ZZZZZ", 10) != 0)
        return (melo_ko_m(dst, "abcd\0ZZZZZ", 10));
# --- Cas repris du libftTester de Tripouille (github.com/Tripouille/libftTester) ---
- name: série de cas limites (size 0, 1, < longueur de dst, SIZE_MAX...)
  input: 17 appels ft_strlcat(dst, src, size) du libftTester
  body: |
    struct s_case { const char *dst; const char *src; size_t size; size_t ret; const char *exp; };
    const struct s_case c[] = {
        {"B", "AAAAAAAAA", 0, 9, "B"},
        {"B", "AAAAAAAAA", 1, 10, "B"},
        {"BBBB", "AAAAAAAAA", 3, 12, "BBBB"},
        {"BBBB", "AAAAAAAAA", 6, 13, "BBBBA"},
        {"CCCCC", "AAAAAAAAA", (size_t)-1, 14, "CCCCCAAAAAAAAA"},
        {"CCCCCCCCCCCCCCC", "AAAAAAAAA", 17, 24, "CCCCCCCCCCCCCCCA"},
        {"", "AAAAAAAAA", 1, 9, ""},
        {"1111111111", "AAAAAAAAA", 5, 14, "1111111111"},
        {"1111111111", "", 15, 10, "1111111111"},
        {"", "", 42, 0, ""},
        {"", "", 0, 0, ""},
        {"", "123", 1, 3, ""},
        {"", "123", 2, 3, "1"},
        {"", "123", 3, 3, "12"},
        {"", "123", 4, 3, "123"},
        {"", "123", 0, 3, ""},
    };
    for (size_t i = 0; i < sizeof(c) / sizeof(*c); i++)
    {
        char dst[30];
        memset(dst, 0, 30);
        memcpy(dst, c[i].dst, strlen(c[i].dst));
        size_t r = ft_strlcat(dst, c[i].src, c[i].size);
        if (r != c[i].ret || strcmp(dst, c[i].exp) != 0)
        {
            char sz[32];
            if (c[i].size == (size_t)-1)
                snprintf(sz, sizeof(sz), "SIZE_MAX");
            else
                snprintf(sz, sizeof(sz), "%zu", c[i].size);
            printf("obtenu : ft_strlcat(dst = ");
            melo_s(c[i].dst);
            printf(", ");
            melo_s(c[i].src);
            printf(", %s) = %zu, dst = ", sz, r);
            melo_s(dst);
            printf("\nattendu : ft_strlcat(dst = ");
            melo_s(c[i].dst);
            printf(", ");
            melo_s(c[i].src);
            printf(", %s) = %zu, dst = ", sz, c[i].ret);
            melo_s(c[i].exp);
            printf("\n");
            return (1);
        }
    }
