name: ft_isascii
prelude: |
  #include "melo.h"
test_defaults:
  expected_exit: 0
tests:
- name: renvoie exactement 1 pour un caractère ASCII (0 à 127)
  input: ft_isascii(c) pour c dans {0, 'a', 127}
  body: |
    int tab[] = {0, 'a', 127};
    for (size_t i = 0; i < sizeof(tab) / sizeof(*tab); i++)
        if (ft_isascii(tab[i]) != 1)
        {
            printf("obtenu : ft_isascii(%d) = %d\nattendu : ft_isascii(%d) = 1\n", tab[i], ft_isascii(tab[i]), tab[i]);
            return (1);
        }
- name: renvoie 0 pour les autres caractères
  input: ft_isascii(c) pour c dans {128, 200, 255, 256, -1, INT_MIN}
  body: |
    int tab[] = {128, 200, 255, 256, -1, INT_MIN};
    for (size_t i = 0; i < sizeof(tab) / sizeof(*tab); i++)
        if (ft_isascii(tab[i]) != 0)
        {
            printf("obtenu : ft_isascii(%d) = %d\nattendu : ft_isascii(%d) = 0\n", tab[i], ft_isascii(tab[i]), tab[i]);
            return (1);
        }
- name: même résultat que isascii de 0 à 255, et seulement 1 ou 0
  input: ft_isascii(c) pour c de 0 à 255
  body: |
    for (int c = 0; c <= 255; c++)
    {
        int exp = isascii(c) ? 1 : 0;
        if (ft_isascii(c) != exp)
        {
            printf("obtenu : ft_isascii(%d) = %d\nattendu : ft_isascii(%d) = %d\n", c, ft_isascii(c), c, exp);
            return (1);
        }
    }
- name: EOF (-1) renvoie 0
  input: ft_isascii(EOF)
  body: |
    if (ft_isascii(EOF) != 0)
        return (melo_ko_i(ft_isascii(EOF), 0));
