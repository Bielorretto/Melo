name: ft_bzero
prelude: |
  #include "melo.h"
test_defaults:
  expected_exit: 0
  check_memory: true
tests:
- name: met n octets à 0 et ne touche pas au reste
  input: ft_bzero(buf = "abcdef", 3)
  body: |
    char buf[7] = "abcdef";
    ft_bzero(buf, 3);
    if (memcmp(buf, "\0\0\0def", 7) != 0)
        return (melo_ko_m(buf, "\0\0\0def", 7));
- name: n = 0 ne modifie rien
  input: ft_bzero(buf = "abc", 0)
  body: |
    char buf[4] = "abc";
    ft_bzero(buf, 0);
    if (strcmp(buf, "abc") != 0)
        return (melo_ko_s(buf, "abc"));
- name: toute la zone (100 octets)
  input: ft_bzero(buf, 100)
  body: |
    unsigned char buf[101];
    memset(buf, 0xAB, 101);
    ft_bzero(buf, 100);
    for (int i = 0; i < 100; i++)
        if (buf[i] != 0)
        {
            printf("obtenu : buf[%d] = %d\nattendu : buf[%d] = 0\n", i, buf[i], i);
            return (1);
        }
    if (buf[100] != 0xAB)
        return (melo_ko_txt("buf[100] modifié (écriture au-delà de n)", "buf[100] intact"));
