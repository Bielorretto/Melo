name: ft_strchr
prelude: |
  #include "melo.h"
test_defaults:
  expected_exit: 0
  check_memory: true
tests:
- name: trouve la première occurrence
  input: ft_strchr("hello world", 'o')
  body: |
    const char *s = "hello world";
    char *r = ft_strchr(s, 'o');
    if (r != strchr(s, 'o'))
        return (melo_ko_ptr(s, 11, r, strchr(s, 'o')));
- name: 'caractère absent : NULL'
  input: ft_strchr("hello", 'z')
  body: |
    const char *s = "hello";
    char *r = ft_strchr(s, 'z');
    if (r != NULL)
        return (melo_ko_ptr(s, 5, r, NULL));
- name: 'c = ''\0'' : pointeur sur le \0 final'
  input: ft_strchr("hello", '\0')
  body: |
    const char *s = "hello";
    char *r = ft_strchr(s, '\0');
    if (r != s + 5)
        return (melo_ko_ptr(s, 5, r, s + 5));
- name: c est converti en char (c = 'e' + 256)
  input: ft_strchr("hello", 'e' + 256)
  body: |
    const char *s = "hello";
    char *r = ft_strchr(s, 'e' + 256);
    if (r != strchr(s, 'e' + 256))
        return (melo_ko_ptr(s, 5, r, strchr(s, 'e' + 256)));
- name: caractère non ASCII (octet > 127)
  input: ft_strchr("caf\351 cr\351me", 0351)
  body: |
    const char *s = "caf\351 cr\351me";
    char *r = ft_strchr(s, 0351);
    if (r != strchr(s, 0351))
        return (melo_ko_ptr(s, 10, r, strchr(s, 0351)));
- name: chaîne vide
  input: ft_strchr("", 'a') et ft_strchr("", '\0')
  body: |
    const char *s = "";
    if (ft_strchr(s, 'a') != NULL)
        return (melo_ko_ptr(s, 0, ft_strchr(s, 'a'), NULL));
    if (ft_strchr(s, '\0') != s)
        return (melo_ko_ptr(s, 0, ft_strchr(s, '\0'), s));
- name: même résultat que strchr pour tous les caractères
  input: ft_strchr("abcabc\377xyz", c) pour c de 0 à 255
  body: |
    const char *s = "abcabc\377xyz";
    for (int c = 0; c <= 255; c++)
        if (ft_strchr(s, c) != strchr(s, c))
        {
            printf("obtenu : ft_strchr(s, %d) = ", c);
            melo_ptr(s, 10, ft_strchr(s, c));
            printf("\nattendu : ft_strchr(s, %d) = ", c);
            melo_ptr(s, 10, strchr(s, c));
            printf("\n");
            return (1);
        }
