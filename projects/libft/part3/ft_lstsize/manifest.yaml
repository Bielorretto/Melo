name: ft_lstsize
prelude: |
  #include "melo.h"
  #include "melo_malloc.h"

  static int g_del_calls = 0;

  /* Crée une liste de n noeuds avec malloc réel ; contenus = "0", "1", ... (alloués). */
  static inline t_list *make_list(int n)
  {
      t_list *head = NULL;
      t_list **tail = &head;
      for (int i = 0; i < n; i++)
      {
          t_list *node = __real_malloc(sizeof(t_list));
          char *s = __real_malloc(12);
          sprintf(s, "%d", i);
          node->content = s;
          node->next = NULL;
          *tail = node;
          tail = &node->next;
      }
      return (head);
  }

  static inline void free_list(t_list *l)
  {
      while (l)
      {
          t_list *next = l->next;
          free(l->content);
          free(l);
          l = next;
      }
  }

  static inline void del_count(void *p)
  {
      g_del_calls++;
      free(p);
  }

  static inline void print_list(t_list *l)
  {
      int n = 0;
      printf("[");
      while (l && n < 10)
      {
          melo_s(l->content);
          if (l->next)
              printf(" -> ");
          l = l->next;
          n++;
      }
      if (l)
          printf(" ...");
      printf("]");
  }

  /* Compare les contenus (chaînes) à exp[] ; nb = longueur attendue. */
  static inline int check_list(t_list *l, const char **exp, int nb)
  {
      t_list *cur = l;
      int i = 0;
      while (cur && i < nb && cur->content && strcmp(cur->content, exp[i]) == 0)
      {
          cur = cur->next;
          i++;
      }
      if (i == nb && cur == NULL)
          return (0);
      printf("obtenu : ");
      print_list(l);
      printf("\nattendu : [");
      for (int k = 0; k < nb; k++)
      {
          printf("\"%s\"", exp[k]);
          if (k + 1 < nb)
              printf(" -> ");
      }
      printf("]\n");
      return (1);
  }
test_defaults:
  expected_exit: 0
  check_memory: true
  link_flags:
  - -Wl,--wrap=malloc
tests:
- name: 'liste vide : 0'
  input: ft_lstsize(NULL)
  body: |
    if (ft_lstsize(NULL) != 0)
        return (melo_ko_i((long long)ft_lstsize(NULL), 0));
- name: 'un seul noeud : 1'
  input: ft_lstsize(["0"])
  body: |
    t_list *l = make_list(1);
    long long r = (long long)ft_lstsize(l);
    free_list(l);
    if (r != 1)
        return (melo_ko_i(r, 1));
- name: plusieurs noeuds
  input: ft_lstsize(liste de 5) et ft_lstsize(liste de 100)
  body: |
    t_list *l = make_list(5);
    long long r = (long long)ft_lstsize(l);
    free_list(l);
    if (r != 5)
        return (melo_ko_i(r, 5));
    l = make_list(100);
    r = (long long)ft_lstsize(l);
    free_list(l);
    if (r != 100)
        return (melo_ko_i(r, 100));
- name: ne modifie pas la liste
  input: ft_lstsize(l) puis contenu de l
  body: |
    t_list *l = make_list(3);
    ft_lstsize(l);
    const char *exp[] = {"0", "1", "2"};
    if (check_list(l, exp, 3))
        return (1);
    free_list(l);
