name: ft_lstlast
prelude: |
  #include "melo.h"
  #include "melo_malloc.h"

  static int g_del_calls = 0;

  /* Crée une liste de n noeuds avec malloc réel ; contenus = "0", "1", ... (alloués). */
  static inline t_list *make_list(int n)
  {
      t_list *head = NULL;
      t_list **tail = &head;
      for (int i = 0; i < n; i++)
      {
          t_list *node = __real_malloc(sizeof(t_list));
          char *s = __real_malloc(12);
          sprintf(s, "%d", i);
          node->content = s;
          node->next = NULL;
          *tail = node;
          tail = &node->next;
      }
      return (head);
  }

  static inline void free_list(t_list *l)
  {
      while (l)
      {
          t_list *next = l->next;
          free(l->content);
          free(l);
          l = next;
      }
  }

  static inline void del_count(void *p)
  {
      g_del_calls++;
      free(p);
  }

  static inline void print_list(t_list *l)
  {
      int n = 0;
      printf("[");
      while (l && n < 10)
      {
          melo_s(l->content);
          if (l->next)
              printf(" -> ");
          l = l->next;
          n++;
      }
      if (l)
          printf(" ...");
      printf("]");
  }

  /* Compare les contenus (chaînes) à exp[] ; nb = longueur attendue. */
  static inline int check_list(t_list *l, const char **exp, int nb)
  {
      t_list *cur = l;
      int i = 0;
      while (cur && i < nb && cur->content && strcmp(cur->content, exp[i]) == 0)
      {
          cur = cur->next;
          i++;
      }
      if (i == nb && cur == NULL)
          return (0);
      printf("obtenu : ");
      print_list(l);
      printf("\nattendu : [");
      for (int k = 0; k < nb; k++)
      {
          printf("\"%s\"", exp[k]);
          if (k + 1 < nb)
              printf(" -> ");
      }
      printf("]\n");
      return (1);
  }
test_defaults:
  expected_exit: 0
  check_memory: true
  link_flags:
  - -Wl,--wrap=malloc
tests:
- name: 'liste vide : NULL'
  input: ft_lstlast(NULL)
  body: |
    if (ft_lstlast(NULL) != NULL)
        return (melo_ko_txt("pas NULL", "NULL"));
- name: 'un seul noeud : lui-même'
  input: ft_lstlast(["0"])
  body: |
    t_list *l = make_list(1);
    t_list *r = ft_lstlast(l);
    if (r != l)
        return (melo_ko_txt("pas le noeud lui-même", "le seul noeud"));
    free_list(l);
- name: 'plusieurs noeuds : le dernier'
  input: ft_lstlast(["0" -> "1" -> "2" -> "3"])
  body: |
    t_list *l = make_list(4);
    t_list *r = ft_lstlast(l);
    if (!r || strcmp(r->content, "3") != 0 || r->next != NULL)
    {
        printf("obtenu : ");
        melo_s(r ? r->content : NULL);
        printf("\nattendu : \"3\" (le dernier noeud)\n");
        return (1);
    }
    free_list(l);
