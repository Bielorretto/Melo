name: ft_lstdelone
prelude: |
  #include "melo.h"
  #include "melo_malloc.h"

  static int g_del_calls = 0;

  /* Crée une liste de n noeuds avec malloc réel ; contenus = "0", "1", ... (alloués). */
  static inline t_list *make_list(int n)
  {
      t_list *head = NULL;
      t_list **tail = &head;
      for (int i = 0; i < n; i++)
      {
          t_list *node = __real_malloc(sizeof(t_list));
          char *s = __real_malloc(12);
          sprintf(s, "%d", i);
          node->content = s;
          node->next = NULL;
          *tail = node;
          tail = &node->next;
      }
      return (head);
  }

  static inline void free_list(t_list *l)
  {
      while (l)
      {
          t_list *next = l->next;
          free(l->content);
          free(l);
          l = next;
      }
  }

  static inline void del_count(void *p)
  {
      g_del_calls++;
      free(p);
  }

  static inline void print_list(t_list *l)
  {
      int n = 0;
      printf("[");
      while (l && n < 10)
      {
          melo_s(l->content);
          if (l->next)
              printf(" -> ");
          l = l->next;
          n++;
      }
      if (l)
          printf(" ...");
      printf("]");
  }

  /* Compare les contenus (chaînes) à exp[] ; nb = longueur attendue. */
  static inline int check_list(t_list *l, const char **exp, int nb)
  {
      t_list *cur = l;
      int i = 0;
      while (cur && i < nb && cur->content && strcmp(cur->content, exp[i]) == 0)
      {
          cur = cur->next;
          i++;
      }
      if (i == nb && cur == NULL)
          return (0);
      printf("obtenu : ");
      print_list(l);
      printf("\nattendu : [");
      for (int k = 0; k < nb; k++)
      {
          printf("\"%s\"", exp[k]);
          if (k + 1 < nb)
              printf(" -> ");
      }
      printf("]\n");
      return (1);
  }
test_defaults:
  expected_exit: 0
  check_memory: true
  link_flags:
  - -Wl,--wrap=malloc
tests:
- name: appelle del une fois sur content et libère le noeud
  input: ft_lstdelone(node, del)
  body: |
    t_list *l = make_list(1);
    ft_lstdelone(l, del_count);
    if (g_del_calls != 1)
    {
        printf("obtenu : del appelée %d fois\nattendu : del appelée 1 fois\n", g_del_calls);
        return (1);
    }
- name: ne libère pas le noeud suivant
  input: l = ["0" -> "1"] ; ft_lstdelone(l, del) ; l->next encore utilisable
  body: |
    t_list *l = make_list(2);
    t_list *second = l->next;
    ft_lstdelone(l, del_count);
    if (g_del_calls != 1)
    {
        printf("obtenu : del appelée %d fois\nattendu : del appelée 1 fois (pas sur le suivant)\n", g_del_calls);
        return (1);
    }
    if (strcmp(second->content, "1") != 0)
        return (melo_ko_txt("le noeud suivant a été modifié", "le noeud suivant intact"));
    free_list(second);
