name: ft_lstiter
prelude: |
  #include "melo.h"
  #include "melo_malloc.h"

  static int g_del_calls = 0;

  /* Crée une liste de n noeuds avec malloc réel ; contenus = "0", "1", ... (alloués). */
  static inline t_list *make_list(int n)
  {
      t_list *head = NULL;
      t_list **tail = &head;
      for (int i = 0; i < n; i++)
      {
          t_list *node = __real_malloc(sizeof(t_list));
          char *s = __real_malloc(12);
          sprintf(s, "%d", i);
          node->content = s;
          node->next = NULL;
          *tail = node;
          tail = &node->next;
      }
      return (head);
  }

  static inline void free_list(t_list *l)
  {
      while (l)
      {
          t_list *next = l->next;
          free(l->content);
          free(l);
          l = next;
      }
  }

  static inline void del_count(void *p)
  {
      g_del_calls++;
      free(p);
  }

  static inline void print_list(t_list *l)
  {
      int n = 0;
      printf("[");
      while (l && n < 10)
      {
          melo_s(l->content);
          if (l->next)
              printf(" -> ");
          l = l->next;
          n++;
      }
      if (l)
          printf(" ...");
      printf("]");
  }

  /* Compare les contenus (chaînes) à exp[] ; nb = longueur attendue. */
  static inline int check_list(t_list *l, const char **exp, int nb)
  {
      t_list *cur = l;
      int i = 0;
      while (cur && i < nb && cur->content && strcmp(cur->content, exp[i]) == 0)
      {
          cur = cur->next;
          i++;
      }
      if (i == nb && cur == NULL)
          return (0);
      printf("obtenu : ");
      print_list(l);
      printf("\nattendu : [");
      for (int k = 0; k < nb; k++)
      {
          printf("\"%s\"", exp[k]);
          if (k + 1 < nb)
              printf(" -> ");
      }
      printf("]\n");
      return (1);
  }

  static char g_seen[64];
  static int g_seen_n = 0;

  static inline void collect(void *p)
  {
      if (g_seen_n < 63)
          g_seen[g_seen_n++] = *(char *)p;
  }

  static inline void upper_first(void *p)
  {
      char *s = p;
      s[0] = (char)toupper((unsigned char)s[0]);
  }
test_defaults:
  expected_exit: 0
  check_memory: true
  link_flags:
  - -Wl,--wrap=malloc
tests:
- name: applique f à chaque contenu, dans l'ordre
  input: ft_lstiter(["0" -> ... -> "4"], f)
  body: |
    t_list *l = make_list(5);
    ft_lstiter(l, collect);
    g_seen[g_seen_n] = '\0';
    if (strcmp(g_seen, "01234") != 0)
    {
        printf("obtenu : f appelée sur ");
        melo_s(g_seen);
        printf("\nattendu : f appelée sur \"01234\"\n");
        return (1);
    }
    free_list(l);
- name: f peut modifier les contenus
  input: ft_lstiter(["ab" -> "cd"], majuscule)
  body: |
    t_list *l = make_list(2);
    strcpy(l->content, "ab");
    strcpy(l->next->content, "cd");
    ft_lstiter(l, upper_first);
    const char *exp[] = {"Ab", "Cd"};
    if (check_list(l, exp, 2))
        return (1);
    free_list(l);
- name: 'liste vide : f jamais appelée'
  input: ft_lstiter(NULL, f)
  body: |
    ft_lstiter(NULL, collect);
    if (g_seen_n != 0)
        return (melo_ko_txt("f appelée", "f jamais appelée"));
