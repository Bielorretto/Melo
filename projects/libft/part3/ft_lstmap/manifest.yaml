name: ft_lstmap
prelude: |
  #include "melo.h"
  #include "melo_malloc.h"

  static int g_del_calls = 0;

  /* Crée une liste de n noeuds avec malloc réel ; contenus = "0", "1", ... (alloués). */
  static inline t_list *make_list(int n)
  {
      t_list *head = NULL;
      t_list **tail = &head;
      for (int i = 0; i < n; i++)
      {
          t_list *node = __real_malloc(sizeof(t_list));
          char *s = __real_malloc(12);
          sprintf(s, "%d", i);
          node->content = s;
          node->next = NULL;
          *tail = node;
          tail = &node->next;
      }
      return (head);
  }

  static inline void free_list(t_list *l)
  {
      while (l)
      {
          t_list *next = l->next;
          free(l->content);
          free(l);
          l = next;
      }
  }

  static inline void del_count(void *p)
  {
      g_del_calls++;
      free(p);
  }

  static inline void print_list(t_list *l)
  {
      int n = 0;
      printf("[");
      while (l && n < 10)
      {
          melo_s(l->content);
          if (l->next)
              printf(" -> ");
          l = l->next;
          n++;
      }
      if (l)
          printf(" ...");
      printf("]");
  }

  /* Compare les contenus (chaînes) à exp[] ; nb = longueur attendue. */
  static inline int check_list(t_list *l, const char **exp, int nb)
  {
      t_list *cur = l;
      int i = 0;
      while (cur && i < nb && cur->content && strcmp(cur->content, exp[i]) == 0)
      {
          cur = cur->next;
          i++;
      }
      if (i == nb && cur == NULL)
          return (0);
      printf("obtenu : ");
      print_list(l);
      printf("\nattendu : [");
      for (int k = 0; k < nb; k++)
      {
          printf("\"%s\"", exp[k]);
          if (k + 1 < nb)
              printf(" -> ");
      }
      printf("]\n");
      return (1);
  }

  static int g_f_calls = 0;

  /* f : nouveau contenu alloué (avec le vrai malloc) = contenu + "!" */
  static inline void *bang(void *p)
  {
      const char *s = p;
      char *r = __real_malloc(strlen(s) + 2);
      strcpy(r, s);
      strcat(r, "!");
      g_f_calls++;
      return (r);
  }
test_defaults:
  expected_exit: 0
  check_memory: true
  link_flags:
  - -Wl,--wrap=malloc
tests:
- name: crée une nouvelle liste avec f appliquée à chaque contenu
  input: ft_lstmap(["0" -> "1" -> "2"], f = ajoute "!", del)
  body: |
    t_list *l = make_list(3);
    t_list *m = ft_lstmap(l, bang, del_count);
    const char *exp[] = {"0!", "1!", "2!"};
    if (check_list(m, exp, 3))
        return (1);
    ft_lstclear(&m, free);
    free_list(l);
- name: la liste d'origine n'est pas modifiée et les noeuds sont nouveaux
  input: ft_lstmap(l, f, del)
  body: |
    t_list *l = make_list(3);
    t_list *m = ft_lstmap(l, bang, del_count);
    const char *exp[] = {"0", "1", "2"};
    if (check_list(l, exp, 3))
        return (1);
    for (t_list *a = l; a; a = a->next)
        for (t_list *b = m; b; b = b->next)
            if (a == b)
                return (melo_ko_txt("un noeud de l'ancienne liste est réutilisé", "que des nouveaux noeuds"));
    if (g_del_calls != 0)
        return (melo_ko_txt("del appelée alors que tout a marché", "del jamais appelée"));
    ft_lstclear(&m, free);
    free_list(l);
- name: f appelée une fois par noeud
  input: ft_lstmap(liste de 5, f, del)
  body: |
    t_list *l = make_list(5);
    t_list *m = ft_lstmap(l, bang, del_count);
    if (g_f_calls != 5)
    {
        printf("obtenu : f appelée %d fois\nattendu : f appelée 5 fois\n", g_f_calls);
        return (1);
    }
    ft_lstclear(&m, free);
    free_list(l);
- name: 'liste vide : NULL'
  input: ft_lstmap(NULL, f, del)
  body: |
    t_list *m = ft_lstmap(NULL, bang, del_count);
    if (m != NULL)
        return (melo_ko_txt("une liste", "NULL"));
- name: 'malloc qui échoue : NULL, et del sur tout ce qui a été créé'
  strict: true
  input: ft_lstmap(liste de 4, f, del) avec chaque malloc qui échoue
  body: |
    for (int n = 0; n < 50; n++)
    {
        t_list *l = make_list(4);
        melo_fail_at(n);
        t_list *m = ft_lstmap(l, bang, free);
        int failed = melo_stop();
        free_list(l);
        if (!failed)
        {
            ft_lstclear(&m, free);
            break ;
        }
        if (m != NULL)
        {
            printf("obtenu : le malloc n°%d a renvoyé NULL mais ft_lstmap a renvoyé une liste\nattendu : NULL (et les contenus déjà créés passés à del)\n", n + 1);
            return (1);
        }
    }
