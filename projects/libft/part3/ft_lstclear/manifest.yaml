name: ft_lstclear
prelude: |
  #include "melo.h"
  #include "melo_malloc.h"

  static int g_del_calls = 0;

  /* Crée une liste de n noeuds avec malloc réel ; contenus = "0", "1", ... (alloués). */
  static inline t_list *make_list(int n)
  {
      t_list *head = NULL;
      t_list **tail = &head;
      for (int i = 0; i < n; i++)
      {
          t_list *node = __real_malloc(sizeof(t_list));
          char *s = __real_malloc(12);
          sprintf(s, "%d", i);
          node->content = s;
          node->next = NULL;
          *tail = node;
          tail = &node->next;
      }
      return (head);
  }

  static inline void free_list(t_list *l)
  {
      while (l)
      {
          t_list *next = l->next;
          free(l->content);
          free(l);
          l = next;
      }
  }

  static inline void del_count(void *p)
  {
      g_del_calls++;
      free(p);
  }

  static inline void print_list(t_list *l)
  {
      int n = 0;
      printf("[");
      while (l && n < 10)
      {
          melo_s(l->content);
          if (l->next)
              printf(" -> ");
          l = l->next;
          n++;
      }
      if (l)
          printf(" ...");
      printf("]");
  }

  /* Compare les contenus (chaînes) à exp[] ; nb = longueur attendue. */
  static inline int check_list(t_list *l, const char **exp, int nb)
  {
      t_list *cur = l;
      int i = 0;
      while (cur && i < nb && cur->content && strcmp(cur->content, exp[i]) == 0)
      {
          cur = cur->next;
          i++;
      }
      if (i == nb && cur == NULL)
          return (0);
      printf("obtenu : ");
      print_list(l);
      printf("\nattendu : [");
      for (int k = 0; k < nb; k++)
      {
          printf("\"%s\"", exp[k]);
          if (k + 1 < nb)
              printf(" -> ");
      }
      printf("]\n");
      return (1);
  }
test_defaults:
  expected_exit: 0
  check_memory: true
  link_flags:
  - -Wl,--wrap=malloc
tests:
- name: libère tous les noeuds et met *lst à NULL
  input: ft_lstclear(&lst) sur 5 noeuds
  body: |
    t_list *lst = make_list(5);
    ft_lstclear(&lst, del_count);
    if (lst != NULL)
        return (melo_ko_txt("*lst n'est pas NULL", "*lst == NULL"));
    if (g_del_calls != 5)
    {
        printf("obtenu : del appelée %d fois\nattendu : del appelée 5 fois\n", g_del_calls);
        return (1);
    }
- name: 'à partir d''un noeud du milieu : le début reste intact'
  input: ft_lstclear(&l->next->next) sur 4 noeuds
  body: |
    t_list *l = make_list(4);
    ft_lstclear(&l->next->next, del_count);
    if (l->next->next != NULL)
        return (melo_ko_txt("le pointeur passé n'est pas NULL", "l->next->next == NULL"));
    if (g_del_calls != 2)
    {
        printf("obtenu : del appelée %d fois\nattendu : del appelée 2 fois\n", g_del_calls);
        return (1);
    }
    const char *exp[] = {"0", "1"};
    if (check_list(l, exp, 2))
        return (1);
    free_list(l);
- name: 'liste vide : rien à faire'
  input: lst = NULL ; ft_lstclear(&lst, del)
  body: |
    t_list *lst = NULL;
    ft_lstclear(&lst, del_count);
    if (lst != NULL || g_del_calls != 0)
        return (melo_ko_txt("del appelée ou *lst modifié", "rien ne se passe"));
