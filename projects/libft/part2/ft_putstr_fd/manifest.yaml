name: ft_putstr_fd
prelude: |
  #include "melo.h"
  static inline int check_fd(const char *got, size_t got_len, const char *exp, size_t exp_len)
  {
      if (got_len != exp_len || memcmp(got, exp, exp_len) != 0)
      {
          printf("obtenu : ");
          melo_m(got, got_len);
          printf("\nattendu : ");
          melo_m(exp, exp_len);
          printf("\n");
          return (1);
      }
      return (0);
  }
test_defaults:
  expected_exit: 0
tests:
- name: écrit sur la sortie standard (fd 1)
  input: ft_putstr_fd("hello", 1)
  body: |
    ft_putstr_fd("hello", 1);
  expected_stdout: hello
- name: écrit sur le fd donné, sans retour à la ligne
  input: ft_putstr_fd("hello world", fd)
  body: |
    int fds[2];
    char buf[8192];
    if (melo_cap_begin(fds) != 0)
        return (melo_ko_txt("pipe() a échoué", "pipe() OK"));
    ft_putstr_fd("hello world", fds[1]);
    size_t n = melo_cap_end(fds, buf, sizeof(buf));
    if (check_fd(buf, n, "hello world", strlen("hello world")))
        return (1);
- name: 'chaîne vide : n''écrit rien'
  input: ft_putstr_fd("", fd)
  body: |
    int fds[2];
    char buf[8192];
    if (melo_cap_begin(fds) != 0)
        return (melo_ko_txt("pipe() a échoué", "pipe() OK"));
    ft_putstr_fd("", fds[1]);
    size_t n = melo_cap_end(fds, buf, sizeof(buf));
    if (check_fd(buf, n, "", strlen("")))
        return (1);
- name: longue chaîne (5000 caractères)
  input: ft_putstr_fd(5000 x 'x', fd)
  body: |2
            int fds[2];
            char buf[8192];
            if (melo_cap_begin(fds) != 0)
                return (melo_ko_txt("pipe() a échoué", "pipe() OK"));
            static char s[5001];
    memset(s, 'x', 5000);
    ft_putstr_fd(s, fds[1]);
            size_t n = melo_cap_end(fds, buf, sizeof(buf));
            if (check_fd(buf, n, s, strlen(s)))
                return (1);
