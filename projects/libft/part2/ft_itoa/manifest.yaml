name: ft_itoa
prelude: |
  #include "melo.h"
  #include "melo_malloc.h"

  static inline int check(int n)
  {
      char exp[32];
      sprintf(exp, "%d", n);
      char *r = ft_itoa(n);
      if (!r || strcmp(r, exp) != 0)
      {
          printf("obtenu : ft_itoa(%d) = ", n);
          melo_s(r);
          printf("\nattendu : ");
          melo_s(exp);
          printf("\n");
          free(r);
          return (1);
      }
      free(r);
      return (0);
  }
test_defaults:
  expected_exit: 0
  check_memory: true
  link_flags:
  - -Wl,--wrap=malloc
tests:
- name: zéro
  input: ft_itoa(n) pour n dans {0}
  body: |
    if (check(0))
        return (1);
- name: nombres positifs
  input: ft_itoa(n) pour n dans {1, 42, 9, 10, 100, 123456}
  body: |
    if (check(1) || check(42) || check(9) || check(10) || check(100) || check(123456))
        return (1);
- name: nombres négatifs
  input: ft_itoa(n) pour n dans {-1, -42, -10, -100, -987654}
  body: |
    if (check(-1) || check(-42) || check(-10) || check(-100) || check(-987654))
        return (1);
- name: INT_MAX
  input: ft_itoa(n) pour n dans {INT_MAX}
  body: |
    if (check(INT_MAX))
        return (1);
- name: INT_MIN
  input: ft_itoa(n) pour n dans {INT_MIN}
  body: |
    if (check(INT_MIN))
        return (1);
- name: 'malloc qui échoue : NULL'
  strict: true
  input: ft_itoa(-12345) avec chaque malloc qui échoue
  body: |
    for (int n = 0; n < 100; n++)
    {
        melo_fail_at(n);
        char *r = ft_itoa(-12345);
        int failed = melo_stop();
        if (!failed)
        {
            free(r);
            break ;
        }
        if (r != NULL)
        {
            printf("obtenu : le malloc n°%d a renvoyé NULL mais la fonction n'a pas renvoyé NULL\nattendu : NULL dès qu'une allocation échoue (et tout ce qui a été alloué libéré)\n", n + 1);
            return (1);
        }
    }
