name: ft_putnbr_fd
prelude: |
  #include "melo.h"
  static inline int check_fd(const char *got, size_t got_len, const char *exp, size_t exp_len)
  {
      if (got_len != exp_len || memcmp(got, exp, exp_len) != 0)
      {
          printf("obtenu : ");
          melo_m(got, got_len);
          printf("\nattendu : ");
          melo_m(exp, exp_len);
          printf("\n");
          return (1);
      }
      return (0);
  }
test_defaults:
  expected_exit: 0
tests:
- name: écrit sur la sortie standard (fd 1)
  input: ft_putnbr_fd(42, 1)
  body: |
    ft_putnbr_fd(42, 1);
  expected_stdout: '42'
- name: nombres positifs, négatifs et zéro
  input: ft_putnbr_fd(n, fd) pour 0, 5, 42, -1, -42, 100, -100
  body: |2
            int fds[2];
            char buf[8192];
            if (melo_cap_begin(fds) != 0)
                return (melo_ko_txt("pipe() a échoué", "pipe() OK"));
            ft_putnbr_fd(0, fds[1]);
    ft_putchar_fd(' ', fds[1]);
    ft_putnbr_fd(5, fds[1]);
    ft_putchar_fd(' ', fds[1]);
    ft_putnbr_fd(42, fds[1]);
    ft_putchar_fd(' ', fds[1]);
    ft_putnbr_fd(-1, fds[1]);
    ft_putchar_fd(' ', fds[1]);
    ft_putnbr_fd(-42, fds[1]);
    ft_putchar_fd(' ', fds[1]);
    ft_putnbr_fd(100, fds[1]);
    ft_putchar_fd(' ', fds[1]);
    ft_putnbr_fd(-100, fds[1]);
    ft_putchar_fd(' ', fds[1]);
            size_t n = melo_cap_end(fds, buf, sizeof(buf));
            if (check_fd(buf, n, "0 5 42 -1 -42 100 -100 ", strlen("0 5 42 -1 -42 100 -100 ")))
                return (1);
- name: INT_MAX
  input: ft_putnbr_fd(INT_MAX, fd)
  body: |
    int fds[2];
    char buf[8192];
    if (melo_cap_begin(fds) != 0)
        return (melo_ko_txt("pipe() a échoué", "pipe() OK"));
    ft_putnbr_fd(INT_MAX, fds[1]);
    size_t n = melo_cap_end(fds, buf, sizeof(buf));
    if (check_fd(buf, n, "2147483647", strlen("2147483647")))
        return (1);
- name: INT_MIN
  input: ft_putnbr_fd(INT_MIN, fd)
  body: |
    int fds[2];
    char buf[8192];
    if (melo_cap_begin(fds) != 0)
        return (melo_ko_txt("pipe() a échoué", "pipe() OK"));
    ft_putnbr_fd(INT_MIN, fds[1]);
    size_t n = melo_cap_end(fds, buf, sizeof(buf));
    if (check_fd(buf, n, "-2147483648", strlen("-2147483648")))
        return (1);
