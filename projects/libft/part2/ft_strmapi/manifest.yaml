name: ft_strmapi
prelude: |
  #include "melo.h"
  #include "melo_malloc.h"

  static int g_calls = 0;
  static unsigned int g_idx[64];

  static inline char shift(unsigned int i, char c)
  {
      if (g_calls < 64)
          g_idx[g_calls] = i;
      g_calls++;
      return ((char)(c + (int)i));
  }

  static inline char upper(unsigned int i, char c)
  {
      (void)i;
      return ((char)toupper((unsigned char)c));
  }
test_defaults:
  expected_exit: 0
  check_memory: true
  link_flags:
  - -Wl,--wrap=malloc
tests:
- name: applique f à chaque caractère
  input: ft_strmapi("hello", toupper)
  body: |
    char *r = ft_strmapi("hello", upper);
    if (!r || strcmp(r, "HELLO") != 0)
    {
        melo_ko_s(r, "HELLO");
        free(r);
        return (1);
    }
    free(r);
- name: passe l'index de chaque caractère à f
  input: ft_strmapi("aaaa", f(i, c) = c + i)
  body: |
    char *r = ft_strmapi("aaaa", shift);
    if (!r || strcmp(r, "abcd") != 0)
    {
        melo_ko_s(r, "abcd");
        free(r);
        return (1);
    }
    free(r);
- name: f appelée une fois par caractère, index 0, 1, 2...
  input: ft_strmapi("abcde", f)
  body: |
    char *r = ft_strmapi("abcde", shift);
    free(r);
    if (g_calls != 5)
    {
        printf("obtenu : f appelée %d fois\nattendu : f appelée 5 fois\n", g_calls);
        return (1);
    }
    for (unsigned int i = 0; i < 5; i++)
        if (g_idx[i] != i)
        {
            printf("obtenu : appel n°%u avec l'index %u\nattendu : index %u\n", i + 1, g_idx[i], i);
            return (1);
        }
- name: ne modifie pas la chaîne d'origine
  input: ft_strmapi(s = "abc", toupper)
  body: |
    char s[] = "abc";
    char *r = ft_strmapi(s, upper);
    if (r == s)
        return (melo_ko_txt("le même pointeur que s", "une nouvelle chaîne allouée"));
    free(r);
    if (strcmp(s, "abc") != 0)
        return (melo_ko_s(s, "abc"));
- name: 'chaîne vide : chaîne vide, f jamais appelée'
  input: ft_strmapi("", f)
  body: |
    char *r = ft_strmapi("", shift);
    if (!r || r[0] != '\0')
    {
        melo_ko_s(r, "");
        free(r);
        return (1);
    }
    free(r);
    if (g_calls != 0)
        return (melo_ko_txt("f appelée", "f jamais appelée"));
- name: 'malloc qui échoue : NULL'
  strict: true
  input: ft_strmapi("hello", toupper) avec chaque malloc qui échoue
  body: |
    for (int n = 0; n < 100; n++)
    {
        melo_fail_at(n);
        char *r = ft_strmapi("hello", upper);
        int failed = melo_stop();
        if (!failed)
        {
            free(r);
            break ;
        }
        if (r != NULL)
        {
            printf("obtenu : le malloc n°%d a renvoyé NULL mais la fonction n'a pas renvoyé NULL\nattendu : NULL dès qu'une allocation échoue (et tout ce qui a été alloué libéré)\n", n + 1);
            return (1);
        }
    }
