name: ft_split
prelude: |
  #include "melo.h"
  #include "melo_malloc.h"

  static inline void free_split(char **t)
  {
      if (!t)
          return ;
      for (int i = 0; t[i]; i++)
          free(t[i]);
      free(t);
  }

  static inline void print_split(char **t, int max)
  {
      if (!t)
      {
          printf("NULL");
          return ;
      }
      printf("{");
      for (int i = 0; i < max && t[i]; i++)
      {
          melo_s(t[i]);
          printf(", ");
      }
      printf("NULL}");
  }

  /* exp : tableau attendu terminé par NULL */
  static inline int check(const char *s, char c, const char **exp)
  {
      char **r = ft_split(s, c);
      int n = 0;
      while (exp[n])
          n++;
      int ok = r != NULL;
      for (int i = 0; ok && i <= n; i++)
      {
          if (i == n)
              ok = r[i] == NULL;
          else
              ok = r[i] != NULL && strcmp(r[i], exp[i]) == 0;
      }
      if (!ok)
      {
          printf("obtenu : ");
          print_split(r, n + 1);
          if (r && n >= 0)
          {
              int k = 0;
              while (k <= n && r[k])
                  k++;
              if (k > n)
                  printf(" (le tableau ne s'arrête pas après %d mot(s))", n);
          }
          printf("\nattendu : {");
          for (int i = 0; i < n; i++)
          {
              melo_s(exp[i]);
              printf(", ");
          }
          printf("NULL}\n");
          free_split(r);
          return (1);
      }
      free_split(r);
      return (0);
  }
test_defaults:
  expected_exit: 0
  check_memory: true
  link_flags:
  - -Wl,--wrap=malloc
tests:
- name: découpe sur le séparateur
  input: ft_split("hello world foo", ' ')
  body: |
    const char *exp[] = {"hello", "world", "foo", NULL};
    if (check("hello world foo", ' ', exp))
        return (1);
- name: séparateurs consécutifs, au début et à la fin
  input: ft_split("  a   b  ", ' ')
  body: |
    const char *exp[] = {"a", "b", NULL};
    if (check("  a   b  ", ' ', exp))
        return (1);
- name: autre séparateur
  input: ft_split("a,b,,c", ',')
  body: |
    const char *exp[] = {"a", "b", "c", NULL};
    if (check("a,b,,c", ',', exp))
        return (1);
- name: 'aucun séparateur : un seul mot'
  input: ft_split("hello", ' ')
  body: |
    const char *exp[] = {"hello", NULL};
    if (check("hello", ' ', exp))
        return (1);
- name: 'chaîne vide : tableau vide (pas NULL)'
  input: ft_split("", ' ')
  body: |
    const char *exp[] = {NULL};
    if (check("", ' ', exp))
        return (1);
- name: 'que des séparateurs : tableau vide'
  input: ft_split("     ", ' ')
  body: |
    const char *exp[] = {NULL};
    if (check("     ", ' ', exp))
        return (1);
- name: 'c = ''\0'' : la chaîne entière'
  input: ft_split("hello world", '\0')
  body: |
    const char *exp[] = {"hello world", NULL};
    if (check("hello world", '\0', exp))
        return (1);
- name: mots d'un seul caractère
  input: ft_split("a b c d", ' ')
  body: |
    const char *exp[] = {"a", "b", "c", "d", NULL};
    if (check("a b c d", ' ', exp))
        return (1);
- name: 'malloc qui échoue : NULL et tout libéré'
  strict: true
  input: ft_split("aa bb cc dd", ' ') avec chaque malloc qui échoue
  body: |
    for (int n = 0; n < 100; n++)
    {
        melo_fail_at(n);
        char **r = ft_split("aa bb cc dd", ' ');
        int failed = melo_stop();
        if (!failed)
        {
            free_split(r);
            break ;
        }
        if (r != NULL)
        {
            printf("obtenu : le malloc n°%d a renvoyé NULL mais la fonction n'a pas renvoyé NULL\nattendu : NULL dès qu'une allocation échoue (et tout ce qui a été alloué libéré)\n", n + 1);
            return (1);
        }
    }
