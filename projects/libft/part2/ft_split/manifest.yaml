name: ft_split
prelude: |
  #include "melo.h"
  #include "melo_malloc.h"

  static inline void free_split(char **t)
  {
      if (!t)
          return ;
      for (int i = 0; t[i]; i++)
          free(t[i]);
      free(t);
  }

  static inline void print_split(char **t, int max)
  {
      if (!t)
      {
          printf("NULL");
          return ;
      }
      printf("{");
      for (int i = 0; i < max && t[i]; i++)
      {
          melo_s(t[i]);
          printf(", ");
      }
      printf("NULL}");
  }

  /* exp : tableau attendu terminé par NULL */
  static inline int check(const char *s, char c, const char **exp)
  {
      char **r = ft_split(s, c);
      int n = 0;
      while (exp[n])
          n++;
      int ok = r != NULL;
      for (int i = 0; ok && i <= n; i++)
      {
          if (i == n)
              ok = r[i] == NULL;
          else
              ok = r[i] != NULL && strcmp(r[i], exp[i]) == 0;
      }
      if (!ok)
      {
          printf("obtenu : ");
          print_split(r, n + 1);
          if (r && n >= 0)
          {
              int k = 0;
              while (k <= n && r[k])
                  k++;
              if (k > n)
                  printf(" (le tableau ne s'arrête pas après %d mot(s))", n);
          }
          printf("\nattendu : {");
          for (int i = 0; i < n; i++)
          {
              melo_s(exp[i]);
              printf(", ");
          }
          printf("NULL}\n");
          free_split(r);
          return (1);
      }
      free_split(r);
      return (0);
  }
test_defaults:
  expected_exit: 0
  check_memory: true
  link_flags:
  - -Wl,--wrap=malloc
tests:
- name: découpe sur le séparateur
  input: ft_split("hello world foo", ' ')
  body: |
    const char *exp[] = {"hello", "world", "foo", NULL};
    if (check("hello world foo", ' ', exp))
        return (1);
- name: séparateurs consécutifs, au début et à la fin
  input: ft_split("  a   b  ", ' ')
  body: |
    const char *exp[] = {"a", "b", NULL};
    if (check("  a   b  ", ' ', exp))
        return (1);
- name: autre séparateur
  input: ft_split("a,b,,c", ',')
  body: |
    const char *exp[] = {"a", "b", "c", NULL};
    if (check("a,b,,c", ',', exp))
        return (1);
- name: 'aucun séparateur : un seul mot'
  input: ft_split("hello", ' ')
  body: |
    const char *exp[] = {"hello", NULL};
    if (check("hello", ' ', exp))
        return (1);
- name: 'chaîne vide : tableau vide (pas NULL)'
  input: ft_split("", ' ')
  body: |
    const char *exp[] = {NULL};
    if (check("", ' ', exp))
        return (1);
- name: 'que des séparateurs : tableau vide'
  input: ft_split("     ", ' ')
  body: |
    const char *exp[] = {NULL};
    if (check("     ", ' ', exp))
        return (1);
- name: 'c = ''\0'' : la chaîne entière'
  input: ft_split("hello world", '\0')
  body: |
    const char *exp[] = {"hello world", NULL};
    if (check("hello world", '\0', exp))
        return (1);
- name: mots d'un seul caractère
  input: ft_split("a b c d", ' ')
  body: |
    const char *exp[] = {"a", "b", "c", "d", NULL};
    if (check("a b c d", ' ', exp))
        return (1);
- name: 'malloc qui échoue : NULL et tout libéré'
  strict: true
  input: ft_split("aa bb cc dd", ' ') avec chaque malloc qui échoue
  body: |
    for (int n = 0; n < 100; n++)
    {
        melo_fail_at(n);
        char **r = ft_split("aa bb cc dd", ' ');
        int failed = melo_stop();
        if (!failed)
        {
            free_split(r);
            break ;
        }
        if (r != NULL)
        {
            printf("obtenu : le malloc n°%d a renvoyé NULL mais la fonction n'a pas renvoyé NULL\nattendu : NULL dès qu'une allocation échoue (et tout ce qui a été alloué libéré)\n", n + 1);
            return (1);
        }
    }
# --- Cas repris du libftTester de Tripouille (github.com/Tripouille/libftTester) ---
- name: séparateurs répétés de longueurs différentes
  input: ft_split("--1-2--3---4----5-----42", '-')
  body: |
    const char *exp[] = {"1", "2", "3", "4", "5", "42", NULL};
    if (check("--1-2--3---4----5-----42", '-', exp))
        return (1);
- name: espaces autour des mots
  input: ft_split("  tripouille  42  ", ' ')
  body: |
    const char *exp[] = {"tripouille", "42", NULL};
    if (check("  tripouille  42  ", ' ', exp))
        return (1);
- name: 'chaîne vide allouée et c = ''\0'' : ne lit pas après le \0'
  input: ft_split(s, '\0') avec s = chaîne vide allouée (1 octet)
  body: |
    char *s = malloc(1);
    s[0] = 0;
    char **r = ft_split(s, 0);
    free(s);
    if (!r || r[0] != NULL)
    {
        printf("obtenu : ");
        print_split(r, 2);
        printf("\nattendu : {NULL}\n");
        free_split(r);
        return (1);
    }
    free_split(r);
- name: taille exacte des malloc (MKO)
  strict: true
  input: ft_split pour "  tripouille  42  ", "chinimala", "", " Tripouille " et "--1-2--3---4----5-----42"
  body: |
    struct s_case { const char *s; char c; int words; size_t sizes[6]; };
    const struct s_case c[] = {
        {"  tripouille  42  ", ' ', 2, {11, 3}},
        {"chinimala", ' ', 1, {10}},
        {"", ' ', 0, {0}},
        {" Tripouille ", ' ', 1, {11}},
        {"--1-2--3---4----5-----42", '-', 6, {2, 2, 2, 2, 2, 3}},
    };
    for (size_t i = 0; i < sizeof(c) / sizeof(*c); i++)
    {
        char txt[96];
        char **r = ft_split(c[i].s, c[i].c);
        snprintf(txt, sizeof(txt), "le tableau de ft_split(\"%s\", '%c')", c[i].s, c[i].c);
        int ok = melo_mcheck(r, sizeof(char *) * (c[i].words + 1), txt);
        for (int w = 0; ok && r && w < c[i].words && r[w]; w++)
        {
            snprintf(txt, sizeof(txt), "le mot \"%s\" de ft_split(\"%s\", '%c')", r[w], c[i].s, c[i].c);
            ok = melo_mcheck(r[w], c[i].sizes[w], txt);
        }
        free_split(r);
        if (!ok)
            return (1);
    }
