name: ft_strtrim
prelude: |
  #include "melo.h"
  #include "melo_malloc.h"
test_defaults:
  expected_exit: 0
  check_memory: true
  link_flags:
  - -Wl,--wrap=malloc
tests:
- name: enlève au début et à la fin
  input: ft_strtrim("  hello  ", " ")
  body: |
    char *r = ft_strtrim("  hello  ", " ");
    if (!r || strcmp(r, "hello") != 0)
    {
        melo_ko_s(r, "hello");
        free(r);
        return (1);
    }
    free(r);
- name: set de plusieurs caractères
  input: ft_strtrim("xyxhelloyxx", "xy")
  body: |
    char *r = ft_strtrim("xyxhelloyxx", "xy");
    if (!r || strcmp(r, "hello") != 0)
    {
        melo_ko_s(r, "hello");
        free(r);
        return (1);
    }
    free(r);
- name: garde les caractères du set au milieu
  input: ft_strtrim("--a-b--", "-")
  body: |
    char *r = ft_strtrim("--a-b--", "-");
    if (!r || strcmp(r, "a-b") != 0)
    {
        melo_ko_s(r, "a-b");
        free(r);
        return (1);
    }
    free(r);
- name: rien à enlever
  input: ft_strtrim("hello", "xyz")
  body: |
    char *r = ft_strtrim("hello", "xyz");
    if (!r || strcmp(r, "hello") != 0)
    {
        melo_ko_s(r, "hello");
        free(r);
        return (1);
    }
    free(r);
- name: 'tout est enlevé : chaîne vide'
  input: ft_strtrim("aaaa", "a")
  body: |
    char *r = ft_strtrim("aaaa", "a");
    if (!r || strcmp(r, "") != 0)
    {
        melo_ko_s(r, "");
        free(r);
        return (1);
    }
    free(r);
- name: 'set vide : copie de s1'
  input: ft_strtrim("  hi  ", "")
  body: |
    char *r = ft_strtrim("  hi  ", "");
    if (!r || strcmp(r, "  hi  ") != 0)
    {
        melo_ko_s(r, "  hi  ");
        free(r);
        return (1);
    }
    free(r);
- name: s1 vide
  input: ft_strtrim("", "abc")
  body: |
    char *r = ft_strtrim("", "abc");
    if (!r || strcmp(r, "") != 0)
    {
        melo_ko_s(r, "");
        free(r);
        return (1);
    }
    free(r);
- name: seulement au début ou seulement à la fin
  input: ft_strtrim("xxhi", "x") et ft_strtrim("hixx", "x")
  body: |
    char *r = ft_strtrim("xxhi", "x");
    if (!r || strcmp(r, "hi") != 0)
    {
        melo_ko_s(r, "hi");
        free(r);
        return (1);
    }
    free(r);

    r = ft_strtrim("hixx", "x");
    if (!r || strcmp(r, "hi") != 0)
    {
        melo_ko_s(r, "hi");
        free(r);
        return (1);
    }
    free(r);
- name: 'malloc qui échoue : NULL'
  strict: true
  input: ft_strtrim("  abc  ", " ") avec chaque malloc qui échoue
  body: |
    for (int n = 0; n < 100; n++)
    {
        melo_fail_at(n);
        char *r = ft_strtrim("  abc  ", " ");
        int failed = melo_stop();
        if (!failed)
        {
            free(r);
            break ;
        }
        if (r != NULL)
        {
            printf("obtenu : le malloc n°%d a renvoyé NULL mais la fonction n'a pas renvoyé NULL\nattendu : NULL dès qu'une allocation échoue (et tout ce qui a été alloué libéré)\n", n + 1);
            return (1);
        }
    }
