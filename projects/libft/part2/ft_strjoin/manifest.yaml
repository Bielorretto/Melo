name: ft_strjoin
prelude: |
  #include "melo.h"
  #include "melo_malloc.h"
test_defaults:
  expected_exit: 0
  check_memory: true
  link_flags:
  - -Wl,--wrap=malloc
tests:
- name: concatène s1 et s2
  input: ft_strjoin("Hello ", "world")
  body: |
    char *r = ft_strjoin("Hello ", "world");
    if (!r || strcmp(r, "Hello world") != 0)
    {
        melo_ko_s(r, "Hello world");
        free(r);
        return (1);
    }
    free(r);
- name: s1 vide
  input: ft_strjoin("", "abc")
  body: |
    char *r = ft_strjoin("", "abc");
    if (!r || strcmp(r, "abc") != 0)
    {
        melo_ko_s(r, "abc");
        free(r);
        return (1);
    }
    free(r);
- name: s2 vide
  input: ft_strjoin("abc", "")
  body: |
    char *r = ft_strjoin("abc", "");
    if (!r || strcmp(r, "abc") != 0)
    {
        melo_ko_s(r, "abc");
        free(r);
        return (1);
    }
    free(r);
- name: deux chaînes vides
  input: ft_strjoin("", "")
  body: |
    char *r = ft_strjoin("", "");
    if (!r || strcmp(r, "") != 0)
    {
        melo_ko_s(r, "");
        free(r);
        return (1);
    }
    free(r);
- name: longues chaînes
  input: ft_strjoin(3000 x 'a', 3000 x 'b')
  body: |
    static char a[3001];
    static char b[3001];
    static char exp[6001];
    memset(a, 'a', 3000);
    memset(b, 'b', 3000);
    memcpy(exp, a, 3000);
    memcpy(exp + 3000, b, 3000);
    char *r = ft_strjoin(a, b);
    if (!r || strcmp(r, exp) != 0)
    {
        melo_ko_s(r, exp);
        free(r);
        return (1);
    }
    free(r);
- name: 'malloc qui échoue : NULL'
  strict: true
  input: ft_strjoin("abc", "def") avec chaque malloc qui échoue
  body: |
    for (int n = 0; n < 100; n++)
    {
        melo_fail_at(n);
        char *r = ft_strjoin("abc", "def");
        int failed = melo_stop();
        if (!failed)
        {
            free(r);
            break ;
        }
        if (r != NULL)
        {
            printf("obtenu : le malloc n°%d a renvoyé NULL mais la fonction n'a pas renvoyé NULL\nattendu : NULL dès qu'une allocation échoue (et tout ce qui a été alloué libéré)\n", n + 1);
            return (1);
        }
    }
