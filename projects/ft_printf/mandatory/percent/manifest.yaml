# Généré par tools/gen_printf.py à partir du printfTester de Tripouille
# (github.com/Tripouille/printfTester, tests/percent_test.cpp).
# Chaque cas compare ft_printf à printf : même sortie, même valeur de retour.
name: percent
order: 9
build: mandatory
rule: "sujet : %% doit afficher la même chose que printf et renvoyer le nombre de caractères écrits"
compile:
  # Les cas reprennent volontairement des formats que gcc signale (ex. '% s').
  test_flags: [-Wno-format]
prelude: |
  #include "melo_printf.h"
test_defaults:
  expected_exit: 0
  check_memory: true
tests:
- name: '%% (7 cas du printfTester)'
  input: '7 appels ft_printf comparés à printf, ex. ft_printf(" %% ")'
  body: |
    PF("\" %% \"", " %% ");
    PF("\" %%%% \"", " %%%% ");
    PF("\" %% %% %% \"", " %% %% %% ");
    PF("\" %%  %%  %% \"", " %%  %%  %% ");
    PF("\" %%   %%   %% \"", " %%   %%   %% ");
    PF("\"%%\"", "%%");
    PF("\"%% %%\"", "%% %%");
    PF_DONE();
