# Généré par tools/gen_printf.py à partir du printfTester de Tripouille
# (github.com/Tripouille/printfTester, tests/mix_test.cpp).
# Chaque cas compare ft_printf à printf : même sortie, même valeur de retour.
name: mix
order: 10
build: mandatory
rule: "sujet : mélange de conversions doit afficher la même chose que printf et renvoyer le nombre de caractères écrits"
compile:
  # Les cas reprennent volontairement des formats que gcc signale (ex. '% s').
  test_flags: [-Wno-format]
prelude: |
  #include "melo_printf.h"
test_defaults:
  expected_exit: 0
  check_memory: true
tests:
- name: 'toutes les conversions dans un même format'
  input: '1 appels ft_printf comparés à printf, ex. ft_printf("%%%c%%%s%%%d%%%i%%%u%%%x%%%X%%%% %%%c%%%s%%%d%%%i%%%u%%%x%%%X%%%% %%%c%%%s%%%d%%%i%%%u%%%x%%%X%%%% %c%%", ''A'', "42", 42, 42, 42, 42, 42, ''B'', "-42", -42, -42, -42, -42, 42, ''C'', "0", 0, 0, 0, 0, 42, 0)'
  body: |
    PF("\"%%%c%%%s%%%d%%%i%%%u%%%x%%%X%%%% %%%c%%%s%%%d%%%i%%%u%%%x%%%X%%%% %%%c%%%s%%%d%%%i%%%u%%%x%%%X%%%% %c%%\", 'A', \"42\", 42, 42, 42, 42, 42, 'B', \"-42\", -42, -42, -42, -42, 42, 'C', \"0\", 0, 0, 0, 0, 42, 0", "%%%c%%%s%%%d%%%i%%%u%%%x%%%X%%%% %%%c%%%s%%%d%%%i%%%u%%%x%%%X%%%% %%%c%%%s%%%d%%%i%%%u%%%x%%%X%%%% %c%%", (int)('A'), (char *)("42"), (int)(42), (int)(42), (unsigned int)(42), (unsigned int)(42), (unsigned int)(42), (int)('B'), (char *)("-42"), (int)(-42), (int)(-42), (unsigned int)(-42), (unsigned int)(-42), (unsigned int)(42), (int)('C'), (char *)("0"), (int)(0), (int)(0), (unsigned int)(0), (unsigned int)(0), (unsigned int)(42), (int)(0));
    PF_DONE();
