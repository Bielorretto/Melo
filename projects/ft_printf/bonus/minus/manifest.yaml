# Généré par tools/gen_printf.py à partir du printfTester de Tripouille
# (github.com/Tripouille/printfTester, tests/minus_test.cpp).
# Chaque cas compare ft_printf à printf : même sortie, même valeur de retour.
name: minus
order: 11
build: bonus
bonus: true
rule: "sujet (bonus) : flag '-' doit se comporter comme dans printf"
compile:
  # Les cas reprennent volontairement des formats que gcc signale (ex. '% s').
  test_flags: [-Wno-format]
prelude: |
  #include "melo_printf.h"
test_defaults:
  expected_exit: 0
  check_memory: true
tests:
- name: 'flag ''-'' avec %c (9 cas)'
  input: '9 appels ft_printf comparés à printf, ex. ft_printf("%-1c", ''0'')'
  body: |
    PF("\"%-1c\", '0'", "%-1c", (int)('0'));
    PF("\" %-2c \", '0'", " %-2c ", (int)('0'));
    PF("\" %-3c\", '0' - 256", " %-3c", (int)('0' - 256));
    PF("\"%-4c \", '0' + 256", "%-4c ", (int)('0' + 256));
    PF("\" %-1c %-2c %-3c \", '0', 0, '1'", " %-1c %-2c %-3c ", (int)('0'), (int)(0), (int)('1'));
    PF("\" %-1c %-2c %-3c \", ' ', ' ', ' '", " %-1c %-2c %-3c ", (int)(' '), (int)(' '), (int)(' '));
    PF("\" %-1c %-2c %-3c \", '1', '2', '3'", " %-1c %-2c %-3c ", (int)('1'), (int)('2'), (int)('3'));
    PF("\" %-1c %-2c %-3c \", '2', '1', 0", " %-1c %-2c %-3c ", (int)('2'), (int)('1'), (int)(0));
    PF("\" %-1c %-2c %-3c \", 0, '1', '2'", " %-1c %-2c %-3c ", (int)(0), (int)('1'), (int)('2'));
    PF_DONE();
- name: 'flag ''-'' avec %s (10 cas)'
  input: '10 appels ft_printf comparés à printf, ex. ft_printf("%1s", "")'
  body: |
    PF("\"%1s\", \"\"", "%1s", (char *)(""));
    PF("\"%-1s\", \"\"", "%-1s", (char *)(""));
    PF("\" %-2s\", \"\"", " %-2s", (char *)(""));
    PF("\"%-3s \", \"\"", "%-3s ", (char *)(""));
    PF("\" %-0s \", \"\"", " %-0s ", (char *)(""));
    PF("\" %-s \", \"-\"", " %-s ", (char *)("-"));
    PF("\" %-1s %-2s \", \"\", \"-\"", " %-1s %-2s ", (char *)(""), (char *)("-"));
    PF("\" %-3s %-4s \", \" - \", \"\"", " %-3s %-4s ", (char *)(" - "), (char *)(""));
    PF("\" %-2s %-3s %-4s %-5s \", \" - \", \"\", \"4\", \"\"", " %-2s %-3s %-4s %-5s ", (char *)(" - "), (char *)(""), (char *)("4"), (char *)(""));
    PF("\" %-3s %-3s %-4s %-5s %-3s \", \" - \", \"\", \"4\", \"\", \"2 \"", " %-3s %-3s %-4s %-5s %-3s ", (char *)(" - "), (char *)(""), (char *)("4"), (char *)(""), (char *)("2 "));
    PF_DONE();
- name: 'flag ''-'' avec %p (10 cas)'
  input: '10 appels ft_printf comparés à printf, ex. ft_printf(" %2p ", -1)'
  body: |
    PF("\" %2p \", -1", " %2p ", (void *)(uintptr_t)(-1));
    PF("\" %-2p \", -1", " %-2p ", (void *)(uintptr_t)(-1));
    PF("\" %-2p \", 1", " %-2p ", (void *)(uintptr_t)(1));
    PF("\" %-2p \", 15", " %-2p ", (void *)(uintptr_t)(15));
    PF("\" %-3p \", 16", " %-3p ", (void *)(uintptr_t)(16));
    PF("\" %-4p \", 17", " %-4p ", (void *)(uintptr_t)(17));
    PF("\" %-9p %-10p \", LONG_MIN, LONG_MAX", " %-9p %-10p ", (void *)(uintptr_t)(LONG_MIN), (void *)(uintptr_t)(LONG_MAX));
    PF("\" %-11p %-12p \", INT_MIN, INT_MAX", " %-11p %-12p ", (void *)(uintptr_t)(INT_MIN), (void *)(uintptr_t)(INT_MAX));
    PF("\" %-13p %-14p \", ULONG_MAX, -ULONG_MAX", " %-13p %-14p ", (void *)(uintptr_t)(ULONG_MAX), (void *)(uintptr_t)(-ULONG_MAX));
    PF("\" %-1p %-2p \", 0, 0", " %-1p %-2p ", (void *)(uintptr_t)(0), (void *)(uintptr_t)(0));
    PF_DONE();
