# Généré par tools/gen_printf.py à partir du printfTester de Tripouille
# (github.com/Tripouille/printfTester, tests/dot_test.cpp).
# Chaque cas compare ft_printf à printf : même sortie, même valeur de retour.
name: dot
order: 13
build: bonus
bonus: true
rule: "sujet (bonus) : précision '.' doit se comporter comme dans printf"
compile:
  # Les cas reprennent volontairement des formats que gcc signale (ex. '% s').
  test_flags: [-Wno-format]
prelude: |
  #include "melo_printf.h"
test_defaults:
  expected_exit: 0
  check_memory: true
tests:
- name: 'précision ''.'' avec %s (9 cas)'
  input: '9 appels ft_printf comparés à printf, ex. ft_printf("%.s", "")'
  body: |
    PF("\"%.s\", \"\"", "%.s", (char *)(""));
    PF("\" %.1s\", \"\"", " %.1s", (char *)(""));
    PF("\"%.1s \", \"\"", "%.1s ", (char *)(""));
    PF("\" %.s \", \"\"", " %.s ", (char *)(""));
    PF("\" %.s \", \"-\"", " %.s ", (char *)("-"));
    PF("\" %.2s %.1s \", \"\", \"-\"", " %.2s %.1s ", (char *)(""), (char *)("-"));
    PF("\" %.3s %.2s \", \" - \", \"\"", " %.3s %.2s ", (char *)(" - "), (char *)(""));
    PF("\" %.1s %.2s %.3s %.4s \", \" - \", \"\", \"4\", \"\"", " %.1s %.2s %.3s %.4s ", (char *)(" - "), (char *)(""), (char *)("4"), (char *)(""));
    PF("\" %.2s %.3s %.4s %.5s %.1s \", \" - \", \"\", \"4\", \"\", \"2 \"", " %.2s %.3s %.4s %.5s %.1s ", (char *)(" - "), (char *)(""), (char *)("4"), (char *)(""), (char *)("2 "));
    PF_DONE();
- name: 'précision ''.'' avec %d (29 cas)'
  input: '29 appels ft_printf comparés à printf, ex. ft_printf(" %.1d ", 0)'
  body: |
    PF("\" %.1d \", 0", " %.1d ", (int)(0));
    PF("\" %.2d \", -1", " %.2d ", (int)(-1));
    PF("\" %.2d \", 1", " %.2d ", (int)(1));
    PF("\" %.1d \", 9", " %.1d ", (int)(9));
    PF("\" %.2d \", 10", " %.2d ", (int)(10));
    PF("\" %.3d \", 11", " %.3d ", (int)(11));
    PF("\" %.4d \", 15", " %.4d ", (int)(15));
    PF("\" %.5d \", 16", " %.5d ", (int)(16));
    PF("\" %.6d \", 17", " %.6d ", (int)(17));
    PF("\" %.1d \", 99", " %.1d ", (int)(99));
    PF("\" %.2d \", 100", " %.2d ", (int)(100));
    PF("\" %.3d \", 101", " %.3d ", (int)(101));
    PF("\" %.1d \", -9", " %.1d ", (int)(-9));
    PF("\" %.2d \", -10", " %.2d ", (int)(-10));
    PF("\" %.3d \", -11", " %.3d ", (int)(-11));
    PF("\" %.4d \", -14", " %.4d ", (int)(-14));
    PF("\" %.1d \", -15", " %.1d ", (int)(-15));
    PF("\" %.2d \", -16", " %.2d ", (int)(-16));
    PF("\" %.3d \", -99", " %.3d ", (int)(-99));
    PF("\" %.3d \", -100", " %.3d ", (int)(-100));
    PF("\" %.4d \", -101", " %.4d ", (int)(-101));
    PF("\" %.8d \", INT_MAX", " %.8d ", (int)(INT_MAX));
    PF("\" %.9d \", INT_MIN", " %.9d ", (int)(INT_MIN));
    PF("\" %.10d \", LONG_MAX", " %.10d ", (int)(LONG_MAX));
    PF("\" %.11d \", LONG_MIN", " %.11d ", (int)(LONG_MIN));
    PF("\" %.12d \", UINT_MAX", " %.12d ", (int)(UINT_MAX));
    PF("\" %.13d \", ULONG_MAX", " %.13d ", (int)(ULONG_MAX));
    PF("\" %.14d \", 9223372036854775807LL", " %.14d ", (int)(9223372036854775807LL));
    PF("\" %.8d %.9d %.10d %.11d %.12d %.13d %.14d\", INT_MAX, INT_MIN, LONG_MAX, LONG_MIN, ULONG_MAX, 0, -42", " %.8d %.9d %.10d %.11d %.12d %.13d %.14d", (int)(INT_MAX), (int)(INT_MIN), (int)(LONG_MAX), (int)(LONG_MIN), (int)(ULONG_MAX), (int)(0), (int)(-42));
    PF_DONE();
