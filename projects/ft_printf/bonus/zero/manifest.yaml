# Généré par tools/gen_printf.py à partir du printfTester de Tripouille
# (github.com/Tripouille/printfTester, tests/0_test.cpp).
# Chaque cas compare ft_printf à printf : même sortie, même valeur de retour.
name: zero
order: 12
build: bonus
bonus: true
rule: "sujet (bonus) : flag '0' doit se comporter comme dans printf"
compile:
  # Les cas reprennent volontairement des formats que gcc signale (ex. '% s').
  test_flags: [-Wno-format]
prelude: |
  #include "melo_printf.h"
test_defaults:
  expected_exit: 0
  check_memory: true
tests:
- name: 'flag ''0'' avec %d (28 cas)'
  input: '28 appels ft_printf comparés à printf, ex. ft_printf(" %01d ", 0)'
  body: |
    PF("\" %01d \", 0", " %01d ", (int)(0));
    PF("\" %02d \", -1", " %02d ", (int)(-1));
    PF("\" %04d \", 9", " %04d ", (int)(9));
    PF("\" %01d \", 10", " %01d ", (int)(10));
    PF("\" %02d \", 11", " %02d ", (int)(11));
    PF("\" %03d \", 15", " %03d ", (int)(15));
    PF("\" %04d \", 16", " %04d ", (int)(16));
    PF("\" %05d \", 17", " %05d ", (int)(17));
    PF("\" %01d \", 99", " %01d ", (int)(99));
    PF("\" %02d \", 100", " %02d ", (int)(100));
    PF("\" %03d \", 101", " %03d ", (int)(101));
    PF("\" %01d \", -9", " %01d ", (int)(-9));
    PF("\" %02d \", -10", " %02d ", (int)(-10));
    PF("\" %03d \", -11", " %03d ", (int)(-11));
    PF("\" %04d \", -14", " %04d ", (int)(-14));
    PF("\" %05d \", -15", " %05d ", (int)(-15));
    PF("\" %06d \", -16", " %06d ", (int)(-16));
    PF("\" %01d \", -99", " %01d ", (int)(-99));
    PF("\" %02d \", -100", " %02d ", (int)(-100));
    PF("\" %03d \", -101", " %03d ", (int)(-101));
    PF("\" %09d \", INT_MAX", " %09d ", (int)(INT_MAX));
    PF("\" %010d \", INT_MIN", " %010d ", (int)(INT_MIN));
    PF("\" %011d \", LONG_MAX", " %011d ", (int)(LONG_MAX));
    PF("\" %012d \", LONG_MIN", " %012d ", (int)(LONG_MIN));
    PF("\" %013d \", UINT_MAX", " %013d ", (int)(UINT_MAX));
    PF("\" %014d \", ULONG_MAX", " %014d ", (int)(ULONG_MAX));
    PF("\" %015d \", 9223372036854775807LL", " %015d ", (int)(9223372036854775807LL));
    PF("\" %09d %010d %011d %012d %013d %014d %015d\", INT_MAX, INT_MIN, LONG_MAX, LONG_MIN, ULONG_MAX, 0, -42", " %09d %010d %011d %012d %013d %014d %015d", (int)(INT_MAX), (int)(INT_MIN), (int)(LONG_MAX), (int)(LONG_MIN), (int)(ULONG_MAX), (int)(0), (int)(-42));
    PF_DONE();
