name: ft_sort_int_tab
tags: ["piscine", "ex6", "pointeurs"]

sources:
  - ft_sort_int_tab.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

tests:

  - name: "trie un tableau en desordre"
    main: |
      #include <stdio.h>
      void ft_sort_int_tab(int *tab, int size);

      int main(void)
      {
          int tab[6] = {5, 3, 8, 1, 9, 2};
          int expected[6] = {1, 2, 3, 5, 8, 9};
          int i = 0;

          ft_sort_int_tab(tab, 6);
          while (i < 6)
          {
              if (tab[i] != expected[i])
              {
                  printf("tab[%d] = %d, attendu %d\n", i, tab[i], expected[i]);
                  return (1);
              }
              i++;
          }
          return (0);
      }
    expected_exit: 0

  - name: "tableau deja trie reste trie"
    main: |
      #include <stdio.h>
      void ft_sort_int_tab(int *tab, int size);

      int main(void)
      {
          int tab[5] = {1, 2, 3, 4, 5};
          int expected[5] = {1, 2, 3, 4, 5};
          int i = 0;

          ft_sort_int_tab(tab, 5);
          while (i < 5)
          {
              if (tab[i] != expected[i])
              {
                  printf("tab[%d] = %d, attendu %d\n", i, tab[i], expected[i]);
                  return (1);
              }
              i++;
          }
          return (0);
      }
    expected_exit: 0

  - name: "tableau trie en ordre decroissant"
    main: |
      #include <stdio.h>
      void ft_sort_int_tab(int *tab, int size);

      int main(void)
      {
          int tab[5] = {9, 7, 5, 3, 1};
          int expected[5] = {1, 3, 5, 7, 9};
          int i = 0;

          ft_sort_int_tab(tab, 5);
          while (i < 5)
          {
              if (tab[i] != expected[i])
              {
                  printf("tab[%d] = %d, attendu %d\n", i, tab[i], expected[i]);
                  return (1);
              }
              i++;
          }
          return (0);
