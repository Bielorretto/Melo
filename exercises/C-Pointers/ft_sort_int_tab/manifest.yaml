    expected_exit: 0

  - name: "gere les doublons"
    main: |
      #include <stdio.h>
      void ft_sort_int_tab(int *tab, int size);

      int main(void)
      {
          int tab[6] = {4, 2, 4, 1, 2, 4};
          int expected[6] = {1, 2, 2, 4, 4, 4};
          int i = 0;

          ft_sort_int_tab(tab, 6);
          while (i < 6)
          {
              if (tab[i] != expected[i])
              {
                  printf("tab[%d] = %d, attendu %d\n", i, tab[i], expected[i]);
                  return (1);
              }
              i++;
          }
          return (0);
      }
    expected_exit: 0

  - name: "tableau d'un seul element ou vide ne plante pas"
    main: |
      #include <stdio.h>
      void ft_sort_int_tab(int *tab, int size);

      int main(void)
      {
          int tab[1] = {42};

          ft_sort_int_tab(tab, 1);
          if (tab[0] != 42)
          {
              printf("tab[0] = %d, attendu 42\n", tab[0]);
              return (1);
          }
          ft_sort_int_tab(tab, 0);
          if (tab[0] != 42)
          {
              printf("tab[0] = %d, attendu 42 apres tri de taille 0\n", tab[0]);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "gere les nombres negatifs"
    main: |
      #include <stdio.h>
      void ft_sort_int_tab(int *tab, int size);

      int main(void)
      {
          int tab[5] = {3, -1, -5, 0, 2};
          int expected[5] = {-5, -1, 0, 2, 3};
          int i = 0;

          ft_sort_int_tab(tab, 5);
          while (i < 5)
          {
              if (tab[i] != expected[i])
              {
                  printf("tab[%d] = %d, attendu %d\n", i, tab[i], expected[i]);
                  return (1);
              }
              i++;
          }
          return (0);
      }
    expected_exit: 0
