name: ft_swap
tags: ["piscine", "ex2", "pointeurs"]

sources:
  - ft_swap.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

tests:

  - name: "echange deux valeurs positives"
    main: |
      #include <stdio.h>
      void ft_swap(int *a, int *b);

      int main(void)
      {
          int a = 3;
          int b = 8;
          ft_swap(&a, &b);
          if (a != 8 || b != 3)
          {
              printf("a=%d b=%d, attendu a=8 b=3\n", a, b);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "echange fonctionne avec une valeur negative et une positive"
    main: |
      #include <stdio.h>
      void ft_swap(int *a, int *b);

      int main(void)
      {
          int a = -15;
          int b = 42;
          ft_swap(&a, &b);
          if (a != 42 || b != -15)
          {
              printf("a=%d b=%d, attendu a=42 b=-15\n", a, b);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "echange deux valeurs egales sans planter"
    main: |
      #include <stdio.h>
      void ft_swap(int *a, int *b);

      int main(void)
      {
          int a = 7;
          int b = 7;
          ft_swap(&a, &b);
          if (a != 7 || b != 7)
          {
              printf("a=%d b=%d, attendu a=7 b=7\n", a, b);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "n'affecte pas une case voisine dans un tableau"
    main: |
      #include <stdio.h>
      void ft_swap(int *a, int *b);

      int main(void)
      {
          int arr[3] = {1, 2, 3};
          ft_swap(&arr[0], &arr[2]);
          if (arr[0] != 3 || arr[1] != 2 || arr[2] != 1)
          {
              printf("arr = [%d, %d, %d], attendu [3, 2, 1]\n",
                     arr[0], arr[1], arr[2]);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "deux echanges consecutifs restaurent l'etat initial"
    main: |
      #include <stdio.h>
      void ft_swap(int *a, int *b);

      int main(void)
      {
          int a = 5;
          int b = 10;
          ft_swap(&a, &b);
          ft_swap(&a, &b);
          if (a != 5 || b != 10)
          {
              printf("a=%d b=%d, attendu a=5 b=10\n", a, b);
              return (1);
          }
          return (0);
      }
    expected_exit: 0
