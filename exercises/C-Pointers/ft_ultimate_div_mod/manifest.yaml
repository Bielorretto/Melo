name: ft_ultimate_div_mod
tags: ["piscine", "ex4", "pointeurs"]

sources:
  - ft_ultimate_div_mod.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

tests:

  - name: "division simple sans reste"
    input: 'int a = 10; int b = 2; ft_ultimate_div_mod(&a, &b);'
    main: |
      #include <stdio.h>
      void ft_ultimate_div_mod(int *a, int *b);

      int main(void)
      {
          int a = 10;
          int b = 2;

          ft_ultimate_div_mod(&a, &b);
          if (a != 5 || b != 0)
          {
              printf("obtenu : a=%d b=%d\nattendu : a=5 b=0\n", a, b);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "division avec reste (le reste doit utiliser le dividende original)"
    input: 'int a = 17; int b = 5; ft_ultimate_div_mod(&a, &b);'
    main: |
      #include <stdio.h>
      void ft_ultimate_div_mod(int *a, int *b);

      int main(void)
      {
          int a = 17;
          int b = 5;

          ft_ultimate_div_mod(&a, &b);
          if (a != 3 || b != 2)
          {
              printf("obtenu : a=%d b=%d\nattendu : a=3 b=2\n", a, b);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "dividende negatif"
    input: 'int a = -7; int b = 2; ft_ultimate_div_mod(&a, &b);'
    main: |
      #include <stdio.h>
      void ft_ultimate_div_mod(int *a, int *b);

      int main(void)
      {
          int a = -7;
          int b = 2;

          ft_ultimate_div_mod(&a, &b);
          if (a != -3 || b != -1)
          {
              printf("obtenu : a=%d b=%d\nattendu : a=-3 b=-1\n", a, b);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "diviseur negatif"
    input: 'int a = 7; int b = -2; ft_ultimate_div_mod(&a, &b);'
    main: |
      #include <stdio.h>
      void ft_ultimate_div_mod(int *a, int *b);

      int main(void)
      {
          int a = 7;
          int b = -2;

          ft_ultimate_div_mod(&a, &b);
          if (a != -3 || b != 1)
          {
              printf("obtenu : a=%d b=%d\nattendu : a=-3 b=1\n", a, b);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "dividende et diviseur negatifs"
    input: 'int a = -9; int b = -4; ft_ultimate_div_mod(&a, &b);'
    main: |
      #include <stdio.h>
      void ft_ultimate_div_mod(int *a, int *b);

      int main(void)
      {
          int a = -9;
          int b = -4;

          ft_ultimate_div_mod(&a, &b);
          if (a != 2 || b != -1)
          {
              printf("obtenu : a=%d b=%d\nattendu : a=2 b=-1\n", a, b);
              return (1);
          }
          return (0);
      }
    expected_exit: 0
