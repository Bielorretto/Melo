name: ft_ultimate_ft
tags: ["piscine", "ex1", "pointeurs"]

sources:
  - ft_ultimate_ft.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

tests:

  - name: "affecte 42 a l'entier final via les 9 niveaux d'indirection (depart 0)"
    main: |
      #include <stdio.h>
      void ft_ultimate_ft(int *********nbr);

      int main(void)
      {
          int n = 0;
          int *p1 = &n;
          int **p2 = &p1;
          int ***p3 = &p2;
          int ****p4 = &p3;
          int *****p5 = &p4;
          int ******p6 = &p5;
          int *******p7 = &p6;
          int ********p8 = &p7;
          int *********p9 = &p8;

          ft_ultimate_ft(p9);
          if (n != 42)
          {
              printf("n = %d, attendu 42\n", n);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "affecte 42 meme si la valeur initiale est negative"
    main: |
      #include <stdio.h>
      void ft_ultimate_ft(int *********nbr);

      int main(void)
      {
          int n = -999;
          int *p1 = &n;
          int **p2 = &p1;
          int ***p3 = &p2;
          int ****p4 = &p3;
          int *****p5 = &p4;
          int ******p6 = &p5;
          int *******p7 = &p6;
          int ********p8 = &p7;
          int *********p9 = &p8;

          ft_ultimate_ft(p9);
          if (n != 42)
          {
              printf("n = %d, attendu 42\n", n);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "les pointeurs intermediaires restent coherents apres l'appel"
    main: |
      #include <stdio.h>
      void ft_ultimate_ft(int *********nbr);

      int main(void)
      {
          int n = 7;
          int *p1 = &n;
          int **p2 = &p1;
          int ***p3 = &p2;
          int ****p4 = &p3;
          int *****p5 = &p4;
          int ******p6 = &p5;
          int *******p7 = &p6;
          int ********p8 = &p7;
          int *********p9 = &p8;

          ft_ultimate_ft(p9);
          if (*p1 != 42 || **p2 != 42 || ***p3 != 42)
          {
              printf("chaine de pointeurs incoherente apres l'appel\n");
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "n'affecte pas une variable voisine non liee"
    main: |
      #include <stdio.h>
      void ft_ultimate_ft(int *********nbr);

      int main(void)
      {
          int sentinel = 1337;
          int n = 0;
          int *p1 = &n;
          int **p2 = &p1;
          int ***p3 = &p2;
          int ****p4 = &p3;
          int *****p5 = &p4;
          int ******p6 = &p5;
          int *******p7 = &p6;
          int ********p8 = &p7;
          int *********p9 = &p8;

          ft_ultimate_ft(p9);
          if (n != 42 || sentinel != 1337)
          {
              printf("n=%d sentinel=%d (attendu n=42 sentinel=1337)\n", n, sentinel);
              return (1);
          }
          return (0);
      }
    expected_exit: 0
