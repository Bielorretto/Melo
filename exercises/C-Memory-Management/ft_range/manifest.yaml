name: ft_range
tags: ["piscine", "ex1", "memoire"]

sources:
  - ft_range.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

tests:

  - name: "plage simple croissante"
    main: |
      #include <stdio.h>
      #include <stdlib.h>
      int *ft_range(int min, int max);

      int main(void)
      {
          int *res = ft_range(0, 5);
          int expected[5] = {0, 1, 2, 3, 4};
          int i = 0;

          if (!res)
          {
              printf("ft_range a retourne NULL\n");
              return (1);
          }
          while (i < 5)
          {
              if (res[i] != expected[i])
              {
                  printf("res[%d] = %d, attendu %d\n", i, res[i], expected[i]);
                  free(res);
                  return (1);
              }
              i++;
          }
          free(res);
          return (0);
      }
    expected_exit: 0
    check_memory: true

  - name: "min egal a max retourne NULL"
    main: |
      #include <stdio.h>
      int *ft_range(int min, int max);

      int main(void)
      {
          int *res = ft_range(5, 5);

          if (res != NULL)
          {
              printf("ft_range(5, 5) devrait retourner NULL\n");
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "min superieur a max retourne NULL"
    main: |
      #include <stdio.h>
      int *ft_range(int min, int max);

      int main(void)
      {
          int *res = ft_range(10, 3);

          if (res != NULL)
          {
              printf("ft_range(10, 3) devrait retourner NULL\n");
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "plage avec valeurs negatives"
    main: |
      #include <stdio.h>
      #include <stdlib.h>
      int *ft_range(int min, int max);

      int main(void)
      {
          int *res = ft_range(-3, 3);
          int expected[6] = {-3, -2, -1, 0, 1, 2};
          int i = 0;

          if (!res)
          {
              printf("ft_range a retourne NULL\n");
              return (1);
          }
          while (i < 6)
          {
              if (res[i] != expected[i])
              {
                  printf("res[%d] = %d, attendu %d\n", i, res[i], expected[i]);
                  free(res);
                  return (1);
              }
              i++;
          }
          free(res);
          return (0);
      }
    expected_exit: 0
    check_memory: true

  - name: "plage d'un seul element"
    main: |
      #include <stdio.h>
      #include <stdlib.h>
      int *ft_range(int min, int max);

      int main(void)
      {
          int *res = ft_range(7, 8);

          if (!res || res[0] != 7)
          {
              printf("resultat incorrect pour ft_range(7, 8)\n");
              free(res);
              return (1);
          }
          free(res);
          return (0);
      }
    expected_exit: 0
    check_memory: true
