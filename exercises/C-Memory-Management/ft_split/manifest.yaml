    expected_exit: 0
    check_memory: true

  - name: "chaine uniquement composee de separateurs"
    main: |
      #include <stdio.h>
      #include <stdlib.h>
      char **ft_split(char *str, char *charset);

      int main(void)
      {
          char **res = ft_split("   ", " ");

          if (!res)
          {
              printf("ft_split a retourne NULL, attendu un tableau vide freeable\n");
              return (1);
          }
          if (res[0] != NULL)
          {
              printf("res[0] devrait etre NULL (aucun mot)\n");
              free(res);
              return (1);
          }
          free(res);
          return (0);
      }
    expected_exit: 0
    check_memory: true

