  - name: "tableau bien termine par NULL (pas de lecture hors bornes)"
    input: 'ft_split("x y z", " ")'
    main: |
      #include <stdio.h>
      #include <stdlib.h>
      char **ft_split(char *str, char *charset);

      static void free_split(char **res)
      {
          int i;

          i = 0;
          while (res[i])
          {
              free(res[i]);
              i++;
          }
          free(res);
      }

      /* Affiche au plus n mots de res, puis l'element suivant (NULL attendu). */
      static void print_split(char **res, int n)
      {
          int i;

          if (!res)
          {
              printf("NULL");
              return ;
          }
          printf("{");
          i = 0;
