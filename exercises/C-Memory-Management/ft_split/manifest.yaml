  - name: "aucun separateur present : un seul mot"
    main: |
      #include <stdio.h>
      #include <string.h>
      #include <stdlib.h>
      char **ft_split(char *str, char *charset);

      static void free_split(char **res)
      {
          int i;

          i = 0;
          while (res[i])
          {
              free(res[i]);
              i++;
          }
          free(res);
      }

      int main(void)
      {
          char **res = ft_split("bonjour", " ");

          if (!res || !res[0] || strcmp(res[0], "bonjour") != 0 || res[1] != NULL)
          {
              printf("resultat incorrect pour une chaine sans separateur\n");
              if (res)
                  free_split(res);
              return (1);
          }
          free_split(res);
          return (0);
      }
    expected_exit: 0
    check_memory: true

