  - name: "tableau bien termine par NULL (pas de lecture hors bornes)"
    main: |
      #include <stdio.h>
      #include <stdlib.h>
      char **ft_split(char *str, char *charset);

      static void free_split(char **res)
      {
          int i;

          i = 0;
          while (res[i])
          {
              free(res[i]);
              i++;
          }
          free(res);
      }

      int main(void)
      {
          char **res = ft_split("x y z", " ");
          int count = 0;

          if (!res)
          {
              printf("ft_split a retourne NULL\n");
              return (1);
          }
          while (res[count])
              count++;
          if (count != 3 || res[count] != NULL)
          {
              printf("count=%d (attendu 3, avec sentinelle NULL)\n", count);
              free_split(res);
              return (1);
          }
          free_split(res);
          return (0);
      }
    expected_exit: 0
    check_memory: true
