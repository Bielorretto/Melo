  - name: "aucun separateur present : un seul mot"
    input: 'ft_split("bonjour", " ")'
    main: |
      #include <stdio.h>
      #include <string.h>
      #include <stdlib.h>
      char **ft_split(char *str, char *charset);

      static void free_split(char **res)
      {
          int i;

          i = 0;
          while (res[i])
          {
              free(res[i]);
              i++;
          }
          free(res);
      }

      /* Affiche au plus n mots de res, puis l'element suivant (NULL attendu). */
      static void print_split(char **res, int n)
      {
