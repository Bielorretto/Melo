  - name: "separateurs en debut et fin de chaine"
    main: |
      #include <stdio.h>
      #include <string.h>
      #include <stdlib.h>
      char **ft_split(char *str, char *charset);

      static void free_split(char **res)
      {
          int i;

          i = 0;
          while (res[i])
          {
              free(res[i]);
              i++;
          }
          free(res);
      }

      int main(void)
      {
          char **res = ft_split("  hello  ", " ");

          if (!res)
          {
              printf("ft_split a retourne NULL\n");
              return (1);
          }
          if (!res[0] || strcmp(res[0], "hello") != 0 || res[1] != NULL)
          {
              printf("resultat incorrect pour les separateurs en debut/fin\n");
