          if (res[i])
              printf("\"%s\"... (pas de NULL a la fin)}", res[i]);
          else
              printf("NULL}");
      }

      int main(void)
      {
          char **res = ft_split("x y z", " ");
          int count = 0;

          if (!res)
          {
              printf("obtenu : ");
              print_split(res, 3);
              printf("\nattendu : {\"x\", \"y\", \"z\", NULL}\n");
              return (1);
          }
          while (res[count])
              count++;
          if (count != 3 || res[count] != NULL)
          {
              printf("obtenu : ");
              print_split(res, 3);
              printf("\nattendu : {\"x\", \"y\", \"z\", NULL}\n");
              free_split(res);
              return (1);
          }
          free_split(res);
          return (0);
      }
    expected_exit: 0
    check_memory: true
