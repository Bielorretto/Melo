name: ft_split
tags: ["piscine", "ex5", "memoire"]

sources:
  - ft_split.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

tests:

  - name: "separateur simple (charset = un espace)"
    input: 'ft_split("bonjour le monde", " ")'
    main: |
      #include <stdio.h>
      #include <string.h>
      #include <stdlib.h>
      char **ft_split(char *str, char *charset);

      static void free_split(char **res)
      {
          int i;

          i = 0;
          while (res[i])
          {
              free(res[i]);
              i++;
          }
          free(res);
      }

      /* Affiche au plus n mots de res, puis l'element suivant (NULL attendu). */
      static void print_split(char **res, int n)
      {
          int i;

          if (!res)
          {
              printf("NULL");
              return ;
          }
          printf("{");
          i = 0;
          while (i < n && res[i])
          {
              printf("\"%s\", ", res[i]);
              i++;
          }
          if (res[i])
              printf("\"%s\"... (pas de NULL a la fin)}", res[i]);
          else
              printf("NULL}");
      }

      int main(void)
      {
          char **res = ft_split("bonjour le monde", " ");
          char *expected[] = {"bonjour", "le", "monde"};
          int i = 0;

          if (!res)
          {
              printf("obtenu : ");
              print_split(res, 3);
              printf("\nattendu : {\"bonjour\", \"le\", \"monde\", NULL}\n");
              return (1);
          }
          while (i < 3)
          {
              if (!res[i] || strcmp(res[i], expected[i]) != 0)
              {
                  printf("obtenu : ");
                  print_split(res, 3);
                  printf("\nattendu : {\"bonjour\", \"le\", \"monde\", NULL}\n");
                  free_split(res);
                  return (1);
              }
              i++;
          }
          if (res[3] != NULL)
          {
              printf("obtenu : ");
              print_split(res, 3);
              printf("\nattendu : {\"bonjour\", \"le\", \"monde\", NULL}\n");
              free_split(res);
              return (1);
          }
          free_split(res);
          return (0);
      }
    expected_exit: 0
    check_memory: true

