name: ft_split
tags: ["piscine", "ex5", "memoire"]

sources:
  - ft_split.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

tests:

  - name: "separateur simple (charset = un espace)"
    main: |
      #include <stdio.h>
      #include <string.h>
      #include <stdlib.h>
      char **ft_split(char *str, char *charset);

      static void free_split(char **res)
      {
          int i;

          i = 0;
          while (res[i])
          {
              free(res[i]);
              i++;
          }
          free(res);
      }

      int main(void)
      {
          char **res = ft_split("bonjour le monde", " ");
          char *expected[] = {"bonjour", "le", "monde"};
          int i = 0;

          if (!res)
          {
              printf("ft_split a retourne NULL\n");
              return (1);
          }
          while (i < 3)
          {
              if (!res[i] || strcmp(res[i], expected[i]) != 0)
              {
                  printf("res[%d] = \"%s\", attendu \"%s\"\n",
                         i, res[i] ? res[i] : "(NULL)", expected[i]);
                  free_split(res);
                  return (1);
              }
              i++;
          }
          if (res[3] != NULL)
          {
              printf("le tableau n'est pas termine par NULL apres 3 elements\n");
              free_split(res);
              return (1);
          }
          free_split(res);
          return (0);
      }
    expected_exit: 0
    check_memory: true

