name: ft_strjoin
tags: ["piscine", "ex3", "memoire"]

sources:
  - ft_strjoin.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

tests:

  - name: "joint plusieurs chaines avec un separateur"
    input: 'char *strs[] = {"un", "deux", "trois"}; ft_strjoin(3, strs, ", ");'
    main: |
      #include <stdio.h>
      #include <string.h>
      #include <stdlib.h>
      char *ft_strjoin(int size, char **strs, char *sep);

      int main(void)
      {
          char *strs[] = {"un", "deux", "trois"};
          char *res = ft_strjoin(3, strs, ", ");

          if (!res || strcmp(res, "un, deux, trois") != 0)
          {
              if (!res)
                  printf("obtenu : NULL\nattendu : \"un, deux, trois\"\n");
              else
                  printf("obtenu : \"%s\"\nattendu : \"un, deux, trois\"\n", res);
              free(res);
              return (1);
          }
          free(res);
          return (0);
      }
    expected_exit: 0
    check_memory: true

  - name: "un seul element ne contient pas le separateur"
    input: 'char *strs[] = {"seul"}; ft_strjoin(1, strs, "-");'
    main: |
      #include <stdio.h>
      #include <string.h>
      #include <stdlib.h>
      char *ft_strjoin(int size, char **strs, char *sep);

      int main(void)
      {
          char *strs[] = {"seul"};
          char *res = ft_strjoin(1, strs, "-");

          if (!res || strcmp(res, "seul") != 0)
          {
              if (!res)
                  printf("obtenu : NULL\nattendu : \"seul\"\n");
              else
                  printf("obtenu : \"%s\"\nattendu : \"seul\"\n", res);
              free(res);
              return (1);
          }
          free(res);
          return (0);
      }
    expected_exit: 0
    check_memory: true

  - name: "size 0 retourne une chaine vide non NULL"
    input: 'char *strs[] = {"peu importe"}; ft_strjoin(0, strs, ",");'
    main: |
      #include <stdio.h>
      #include <stdlib.h>
      char *ft_strjoin(int size, char **strs, char *sep);

      int main(void)
      {
          char *strs[] = {"peu importe"};
          char *res = ft_strjoin(0, strs, ",");

          if (!res)
          {
              printf("obtenu : NULL\nattendu : \"\" (chaine vide allouee)\n");
              return (1);
          }
          if (res[0] != '\0')
          {
              printf("obtenu : \"%s\"\nattendu : \"\" (chaine vide allouee)\n", res);
              free(res);
              return (1);
          }
          free(res);
          return (0);
      }
    expected_exit: 0
    check_memory: true

  - name: "separateur vide concatene simplement"
    input: 'char *strs[] = {"a", "b", "c"}; ft_strjoin(3, strs, "");'
    main: |
      #include <stdio.h>
      #include <string.h>
      #include <stdlib.h>
      char *ft_strjoin(int size, char **strs, char *sep);

      int main(void)
      {
          char *strs[] = {"a", "b", "c"};
          char *res = ft_strjoin(3, strs, "");

          if (!res || strcmp(res, "abc") != 0)
          {
              if (!res)
                  printf("obtenu : NULL\nattendu : \"abc\"\n");
              else
                  printf("obtenu : \"%s\"\nattendu : \"abc\"\n", res);
              free(res);
              return (1);
          }
          free(res);
          return (0);
      }
    expected_exit: 0
    check_memory: true

  - name: "chaines vides dans le tableau sont gerees correctement"
    input: 'char *strs[] = {"", "x", "", "y"}; ft_strjoin(4, strs, "-");'
    main: |
      #include <stdio.h>
      #include <string.h>
      #include <stdlib.h>
      char *ft_strjoin(int size, char **strs, char *sep);

      int main(void)
      {
          char *strs[] = {"", "x", "", "y"};
          char *res = ft_strjoin(4, strs, "-");

          if (!res || strcmp(res, "-x--y") != 0)
          {
              if (!res)
                  printf("obtenu : NULL\nattendu : \"-x--y\"\n");
              else
                  printf("obtenu : \"%s\"\nattendu : \"-x--y\"\n", res);
              free(res);
              return (1);
          }
          free(res);
          return (0);
      }
    expected_exit: 0
    check_memory: true
