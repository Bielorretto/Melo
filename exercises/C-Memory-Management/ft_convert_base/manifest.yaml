name: ft_convert_base
tags: ["piscine", "ex4", "memoire"]

sources:
  - ft_convert_base.c
  - ft_convert_base2.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

tests:

  - name: "conversion decimal vers binaire"
    main: |
      #include <stdio.h>
      #include <string.h>
      #include <stdlib.h>
      char *ft_convert_base(char *nbr, char *base_from, char *base_to);

      int main(void)
      {
          char *res = ft_convert_base("42", "0123456789", "01");

          if (!res || strcmp(res, "101010") != 0)
          {
              printf("res = \"%s\", attendu \"101010\"\n", res ? res : "(NULL)");
              free(res);
              return (1);
          }
          free(res);
          return (0);
      }
    expected_exit: 0
    check_memory: true

  - name: "conversion binaire vers decimal"
    main: |
      #include <stdio.h>
