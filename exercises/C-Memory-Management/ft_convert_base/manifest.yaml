  - name: "base invalide : caractere duplique retourne NULL"
    main: |
      #include <stdio.h>
      char *ft_convert_base(char *nbr, char *base_from, char *base_to);

      int main(void)
      {
          char *res = ft_convert_base("5", "0123456789", "AAB");

          if (res != NULL)
          {
              printf("res = \"%s\", attendu NULL (base avec caractere duplique)\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

