name: ft_ultimate_range
tags: ["piscine", "ex2", "memoire"]

sources:
  - ft_ultimate_range.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

tests:

  - name: "plage simple, taille et contenu corrects"
    main: |
      #include <stdio.h>
      #include <stdlib.h>
      int ft_ultimate_range(int **range, int min, int max);

      int main(void)
      {
          int *range;
          int size = ft_ultimate_range(&range, 2, 7);
          int expected[5] = {2, 3, 4, 5, 6};
          int i = 0;

          if (size != 5 || !range)
          {
              printf("size = %d, range = %p (attendu size=5, range non NULL)\n",
                     size, (void *)range);
              free(range);
              return (1);
          }
          while (i < 5)
          {
              if (range[i] != expected[i])
              {
                  printf("range[%d] = %d, attendu %d\n", i, range[i], expected[i]);
                  free(range);
                  return (1);
              }
              i++;
          }
          free(range);
          return (0);
      }
    expected_exit: 0
    check_memory: true

  - name: "min egal a max : range vaut NULL et retour 0"
    main: |
      #include <stdio.h>
      int ft_ultimate_range(int **range, int min, int max);

      int main(void)
      {
          int *range = (int *)1;
          int size = ft_ultimate_range(&range, 5, 5);

          if (size != 0 || range != NULL)
          {
              printf("size=%d range=%p (attendu size=0 range=NULL)\n", size, (void *)range);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "min superieur a max : range vaut NULL et retour 0"
    main: |
      #include <stdio.h>
      int ft_ultimate_range(int **range, int min, int max);

      int main(void)
      {
          int *range = (int *)1;
          int size = ft_ultimate_range(&range, 10, 3);

          if (size != 0 || range != NULL)
          {
              printf("size=%d range=%p (attendu size=0 range=NULL)\n", size, (void *)range);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "plage avec valeurs negatives"
    main: |
      #include <stdio.h>
      #include <stdlib.h>
      int ft_ultimate_range(int **range, int min, int max);

      int main(void)
      {
          int *range;
          int size = ft_ultimate_range(&range, -3, 2);
          int expected[5] = {-3, -2, -1, 0, 1};
          int i = 0;

          if (size != 5 || !range)
          {
              printf("size = %d, range = %p (attendu size=5, range non NULL)\n",
                     size, (void *)range);
              free(range);
              return (1);
          }
          while (i < 5)
          {
              if (range[i] != expected[i])
              {
                  printf("range[%d] = %d, attendu %d\n", i, range[i], expected[i]);
                  free(range);
                  return (1);
              }
              i++;
          }
          free(range);
          return (0);
      }
    expected_exit: 0
    check_memory: true

  - name: "plage d'un seul element"
    main: |
      #include <stdio.h>
      #include <stdlib.h>
      int ft_ultimate_range(int **range, int min, int max);

      int main(void)
      {
          int *range;
          int size = ft_ultimate_range(&range, 9, 10);

          if (size != 1 || !range || range[0] != 9)
          {
              printf("resultat incorrect pour ft_ultimate_range(9, 10)\n");
              free(range);
              return (1);
          }
          free(range);
          return (0);
      }
    expected_exit: 0
    check_memory: true
