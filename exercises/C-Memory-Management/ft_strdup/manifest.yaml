name: ft_strdup
tags: ["piscine", "ex0", "memoire"]

sources:
  - ft_strdup.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

tests:

  - name: "duplique une chaine simple"
    input: 'char *src = "Hello, 42!"; ft_strdup(src);'
    main: |
      #include <stdio.h>
      #include <string.h>
      #include <stdlib.h>
      char *ft_strdup(char *src);

      int main(void)
      {
          char *src = "Hello, 42!";
          char *dup = ft_strdup(src);

          if (!dup || strcmp(dup, src) != 0)
          {
              if (!dup)
                  printf("obtenu : dup = NULL\nattendu : dup = \"%s\"\n", src);
              else
                  printf("obtenu : dup = \"%s\"\nattendu : dup = \"%s\"\n", dup, src);
              free(dup);
              return (1);
          }
          free(dup);
          return (0);
      }
    expected_exit: 0
    check_memory: true

  - name: "duplique une chaine vide"
    input: 'ft_strdup("")'
    main: |
      #include <stdio.h>
      #include <stdlib.h>
      char *ft_strdup(char *src);

      int main(void)
      {
          char *dup = ft_strdup("");

          if (!dup || dup[0] != '\0')
          {
              if (!dup)
                  printf("obtenu : NULL\nattendu : \"\"\n");
              else
                  printf("obtenu : \"%s\"\nattendu : \"\"\n", dup);
              free(dup);
              return (1);
          }
          free(dup);
          return (0);
      }
    expected_exit: 0
    check_memory: true

  - name: "la copie est independante de l'original"
    input: 'char src[] = "mutable"; ft_strdup(src);'
    main: |
      #include <stdio.h>
      #include <stdlib.h>
      char *ft_strdup(char *src);

      int main(void)
      {
          char src[] = "mutable";
          char *dup = ft_strdup(src);

          if (!dup)
          {
              printf("obtenu : NULL\nattendu : \"mutable\"\n");
              return (1);
          }
          src[0] = 'X';
          if (dup[0] != 'm')
          {
              printf("obtenu : dup[0] = '%c'\nattendu : dup[0] = 'm' (la copie ne doit pas dependre de l'original)\n", dup[0]);
              free(dup);
              return (1);
          }
          free(dup);
          return (0);
      }
    expected_exit: 0
    check_memory: true

  - name: "gere les caracteres speciaux (retours a la ligne, tabulations)"
    input: 'char *src = "Line1\nLine2\ttab"; ft_strdup(src);'
    main: |
      #include <stdio.h>
      #include <string.h>
      #include <stdlib.h>
      char *ft_strdup(char *src);

      int main(void)
      {
          char *src = "Line1\nLine2\ttab";
          char *dup = ft_strdup(src);

          if (!dup || strcmp(dup, src) != 0)
          {
              if (!dup)
                  printf("obtenu : NULL\nattendu : \"Line1\\nLine2\\ttab\"\n");
              else
                  printf("obtenu : \"%s\"\nattendu : \"Line1\\nLine2\\ttab\"\n", dup);
              free(dup);
              return (1);
          }
          free(dup);
          return (0);
      }
    expected_exit: 0
    check_memory: true

  - name: "la chaine dupliquee a la bonne longueur"
    input: 'char *src = "quarante-deux"; ft_strdup(src);'
    main: |
      #include <stdio.h>
      #include <string.h>
      #include <stdlib.h>
      char *ft_strdup(char *src);

      int main(void)
      {
          char *src = "quarante-deux";
          char *dup = ft_strdup(src);

          if (!dup || strlen(dup) != strlen(src))
          {
              if (!dup)
                  printf("obtenu : NULL\nattendu : longueur 13 (\"quarante-deux\")\n");
              else
                  printf("obtenu : longueur %zu\nattendu : longueur 13 (\"quarante-deux\")\n", strlen(dup));
              free(dup);
              return (1);
          }
          free(dup);
          return (0);
      }
    expected_exit: 0
    check_memory: true
