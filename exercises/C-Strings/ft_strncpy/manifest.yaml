name: ft_strncpy
tags: ["piscine", "ex1", "strings"]

sources:
  - ft_strncpy.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

tests:

  - name: "n plus grand que la longueur de src : complete avec des zeros"
    input: 'char dest[10] = "ZZZZZZZZZZ"; ft_strncpy(dest, "hi", 5);'
    main: |
      #include <stdio.h>
      #include <string.h>
      char *ft_strncpy(char *dest, char *src, unsigned int n);

      int main(void)
      {
          char dest[10];
          char expected[5] = {'h', 'i', '\0', '\0', '\0'};

          memset(dest, 'Z', sizeof(dest));
          ft_strncpy(dest, "hi", 5);
          if (memcmp(dest, expected, 5) != 0)
          {
              printf("obtenu : dest = {");
              for (int k = 0; k < 5; k++)
              {
                  printf("%s", k ? ", " : "");
                  if (dest[k])
                      printf("'%c'", dest[k]);
                  else
                      printf("'\\0'");
              }
              printf("}\n");
              printf("attendu : dest = {'h', 'i', '\\0', '\\0', '\\0'}\n");
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "n plus petit que la longueur de src : pas de zero final ajoute"
    input: 'char dest[10] = "ZZZZZZZZZZ"; ft_strncpy(dest, "bonjour", 3);'
    main: |
      #include <stdio.h>
      #include <string.h>
      char *ft_strncpy(char *dest, char *src, unsigned int n);

      int main(void)
      {
          char dest[10];

          memset(dest, 'Z', sizeof(dest));
          ft_strncpy(dest, "bonjour", 3);
          if (dest[0] != 'b' || dest[1] != 'o' || dest[2] != 'n')
          {
              printf("obtenu : dest = ['%c','%c','%c']\nattendu : dest = ['b','o','n']\n", dest[0], dest[1], dest[2]);
              return (1);
          }
          if (dest[3] != 'Z')
          {
              printf("obtenu : dest[3] = code ASCII %d (ecrit au-dela de n)\nattendu : dest[3] = 'Z' (inchange)\n", dest[3]);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "n egal a la longueur exacte de src : pas de zero final ajoute"
    input: 'char dest[10] = "ZZZZZZZZZZ"; ft_strncpy(dest, "abc", 3);'
    main: |
      #include <stdio.h>
      #include <string.h>
      char *ft_strncpy(char *dest, char *src, unsigned int n);

      int main(void)
      {
          char dest[10];

          memset(dest, 'Z', sizeof(dest));
          ft_strncpy(dest, "abc", 3);
          if (dest[0] != 'a' || dest[1] != 'b' || dest[2] != 'c')
          {
              printf("obtenu : dest = ['%c','%c','%c']\nattendu : dest = ['a','b','c']\n", dest[0], dest[1], dest[2]);
              return (1);
          }
          if (dest[3] != 'Z')
          {
              printf("obtenu : dest[3] = code ASCII %d (ecrit au-dela de n)\nattendu : dest[3] = 'Z' (inchange)\n", dest[3]);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "retourne bien dest"
    input: 'char dest[10]; ft_strncpy(dest, "abc", 3);'
    main: |
      #include <stdio.h>
      char *ft_strncpy(char *dest, char *src, unsigned int n);

      int main(void)
      {
          char dest[10];
          char *ret = ft_strncpy(dest, "abc", 3);

          if (ret != dest)
          {
              printf("obtenu : %s\nattendu : dest (le pointeur recu en parametre)\n", ret == NULL ? "NULL" : "un autre pointeur que dest");
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "n=0 ne copie rien"
    input: 'char dest[10] = "inchange"; ft_strncpy(dest, "autre", 0);'
    main: |
      #include <stdio.h>
      char *ft_strncpy(char *dest, char *src, unsigned int n);

      int main(void)
      {
          char dest[10] = "inchange";

          ft_strncpy(dest, "autre", 0);
          if (dest[0] != 'i')
          {
              printf("obtenu : dest = \"%s\"\nattendu : dest = \"inchange\"\n", dest);
              return (1);
          }
          return (0);
      }
    expected_exit: 0
