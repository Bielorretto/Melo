name: ft_strncpy
tags: ["piscine", "ex1", "strings"]

sources:
  - ft_strncpy.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

tests:

  - name: "n plus grand que la longueur de src : complete avec des zeros"
    main: |
      #include <stdio.h>
      #include <string.h>
      char *ft_strncpy(char *dest, char *src, unsigned int n);

      int main(void)
      {
          char dest[10];
          char expected[5] = {'h', 'i', '\0', '\0', '\0'};

          memset(dest, 'Z', sizeof(dest));
          ft_strncpy(dest, "hi", 5);
          if (memcmp(dest, expected, 5) != 0)
          {
              printf("dest ne correspond pas au motif attendu (padding de zeros)\n");
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "n plus petit que la longueur de src : pas de zero final ajoute"
    main: |
      #include <stdio.h>
      #include <string.h>
      char *ft_strncpy(char *dest, char *src, unsigned int n);

      int main(void)
      {
          char dest[10];

          memset(dest, 'Z', sizeof(dest));
          ft_strncpy(dest, "bonjour", 3);
          if (dest[0] != 'b' || dest[1] != 'o' || dest[2] != 'n')
          {
              printf("dest = [%c,%c,%c], attendu ['b','o','n']\n", dest[0], dest[1], dest[2]);
              return (1);
          }
          if (dest[3] != 'Z')
          {
              printf("ft_strncpy a ecrit au-dela de n caracteres\n");
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "n egal a la longueur exacte de src : pas de zero final ajoute"
    main: |
      #include <stdio.h>
      #include <string.h>
      char *ft_strncpy(char *dest, char *src, unsigned int n);

      int main(void)
      {
          char dest[10];

          memset(dest, 'Z', sizeof(dest));
          ft_strncpy(dest, "abc", 3);
          if (dest[0] != 'a' || dest[1] != 'b' || dest[2] != 'c')
          {
              printf("dest = [%c,%c,%c], attendu ['a','b','c']\n", dest[0], dest[1], dest[2]);
              return (1);
          }
          if (dest[3] != 'Z')
          {
              printf("ft_strncpy a ecrit au-dela de n caracteres\n");
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "retourne bien dest"
    main: |
      #include <stdio.h>
      char *ft_strncpy(char *dest, char *src, unsigned int n);

      int main(void)
      {
          char dest[10];
          char *ret = ft_strncpy(dest, "abc", 3);

          if (ret != dest)
          {
              printf("la fonction ne retourne pas dest\n");
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "n=0 ne copie rien"
    main: |
      #include <stdio.h>
      char *ft_strncpy(char *dest, char *src, unsigned int n);

      int main(void)
      {
          char dest[10] = "inchange";

          ft_strncpy(dest, "autre", 0);
          if (dest[0] != 'i')
          {
              printf("dest a ete modifie alors que n valait 0\n");
              return (1);
          }
          return (0);
      }
    expected_exit: 0
