name: ft_strncat
tags: ["piscine", "ex5", "strings"]

sources:
  - ft_strncat.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

tests:

  - name: "concatene au maximum nb caracteres de src"
    main: |
      #include <stdio.h>
      #include <string.h>
      char *ft_strncat(char *dest, char *src, unsigned int nb);

      int main(void)
      {
          char dest[30] = "foo";

          ft_strncat(dest, "bartender", 3);
          if (strcmp(dest, "foobar") != 0)
          {
              printf("dest = \"%s\", attendu \"foobar\"\n", dest);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "nb superieur a la longueur de src : concatene toute la chaine"
    main: |
      #include <stdio.h>
      #include <string.h>
      char *ft_strncat(char *dest, char *src, unsigned int nb);

      int main(void)
      {
          char dest[30] = "foo";

          ft_strncat(dest, "bar", 10);
          if (strcmp(dest, "foobar") != 0)
          {
              printf("dest = \"%s\", attendu \"foobar\"\n", dest);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "nb=0 ne concatene rien mais garde le terminateur nul"
    main: |
      #include <stdio.h>
      #include <string.h>
      char *ft_strncat(char *dest, char *src, unsigned int nb);

      int main(void)
      {
          char dest[30] = "foo";

          ft_strncat(dest, "bar", 0);
          if (strcmp(dest, "foo") != 0)
          {
              printf("dest = \"%s\", attendu \"foo\"\n", dest);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "retourne bien dest"
    main: |
      #include <stdio.h>
      char *ft_strncat(char *dest, char *src, unsigned int nb);

      int main(void)
      {
          char dest[30] = "foo";
          char *ret = ft_strncat(dest, "bar", 3);

          if (ret != dest)
          {
              printf("la fonction ne retourne pas dest\n");
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "concatener sur un dest vide avec troncature"
    main: |
      #include <stdio.h>
      #include <string.h>
      char *ft_strncat(char *dest, char *src, unsigned int nb);

      int main(void)
      {
          char dest[30] = "";

          ft_strncat(dest, "bonjour", 4);
          if (strcmp(dest, "bonj") != 0)
          {
              printf("dest = \"%s\", attendu \"bonj\"\n", dest);
              return (1);
          }
          return (0);
      }
    expected_exit: 0
