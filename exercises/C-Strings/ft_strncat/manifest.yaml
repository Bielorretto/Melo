name: ft_strncat
tags: ["piscine", "ex5", "strings"]

sources:
  - ft_strncat.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

tests:

  - name: "concatene au maximum nb caracteres de src"
    input: 'char dest[30] = "foo"; ft_strncat(dest, "bartender", 3);'
    main: |
      #include <stdio.h>
      #include <string.h>
      char *ft_strncat(char *dest, char *src, unsigned int nb);

      int main(void)
      {
          char dest[30] = "foo";

          ft_strncat(dest, "bartender", 3);
          if (strcmp(dest, "foobar") != 0)
          {
              printf("obtenu : dest = \"%s\"\nattendu : dest = \"foobar\"\n", dest);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "nb superieur a la longueur de src : concatene toute la chaine"
    input: 'char dest[30] = "foo"; ft_strncat(dest, "bar", 10);'
    main: |
      #include <stdio.h>
      #include <string.h>
      char *ft_strncat(char *dest, char *src, unsigned int nb);

      int main(void)
      {
          char dest[30] = "foo";

          ft_strncat(dest, "bar", 10);
          if (strcmp(dest, "foobar") != 0)
          {
              printf("obtenu : dest = \"%s\"\nattendu : dest = \"foobar\"\n", dest);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "nb=0 ne concatene rien mais garde le terminateur nul"
    input: 'char dest[30] = "foo"; ft_strncat(dest, "bar", 0);'
    main: |
      #include <stdio.h>
      #include <string.h>
      char *ft_strncat(char *dest, char *src, unsigned int nb);

      int main(void)
      {
          char dest[30] = "foo";

          ft_strncat(dest, "bar", 0);
          if (strcmp(dest, "foo") != 0)
          {
              printf("obtenu : dest = \"%s\"\nattendu : dest = \"foo\"\n", dest);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "retourne bien dest"
    input: 'char dest[30] = "foo"; ft_strncat(dest, "bar", 3);'
    main: |
      #include <stdio.h>
      char *ft_strncat(char *dest, char *src, unsigned int nb);

      int main(void)
      {
          char dest[30] = "foo";
          char *ret = ft_strncat(dest, "bar", 3);

          if (ret != dest)
          {
              printf("obtenu : %s\nattendu : dest (le pointeur recu en parametre)\n", ret == NULL ? "NULL" : "un autre pointeur que dest");
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "concatener sur un dest vide avec troncature"
    input: 'char dest[30] = ""; ft_strncat(dest, "bonjour", 4);'
    main: |
      #include <stdio.h>
      #include <string.h>
      char *ft_strncat(char *dest, char *src, unsigned int nb);

      int main(void)
      {
          char dest[30] = "";

          ft_strncat(dest, "bonjour", 4);
          if (strcmp(dest, "bonj") != 0)
          {
              printf("obtenu : dest = \"%s\"\nattendu : dest = \"bonj\"\n", dest);
              return (1);
          }
          return (0);
      }
    expected_exit: 0
