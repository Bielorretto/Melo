name: ft_strcpy
tags: ["piscine", "ex0", "strings"]

sources:
  - ft_strcpy.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

tests:

  - name: "copie une chaine simple et retourne dest"
    input: 'char dest[20]; ft_strcpy(dest, "bonjour");'
    main: |
      #include <stdio.h>
      #include <string.h>
      char *ft_strcpy(char *dest, char *src);

      int main(void)
      {
          char dest[20];
          char *ret = ft_strcpy(dest, "bonjour");

          if (strcmp(dest, "bonjour") != 0 || ret != dest)
          {
              printf("obtenu : dest = \"%s\", retour %s\nattendu : dest = \"bonjour\", retour = dest\n", dest, ret == dest ? "= dest" : "!= dest");
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "copie une chaine vide"
    input: 'char dest[10] = "xxxxxxxxx"; ft_strcpy(dest, "");'
    main: |
      #include <stdio.h>
      #include <string.h>
      char *ft_strcpy(char *dest, char *src);

      int main(void)
      {
          char dest[10] = "xxxxxxxxx";

          ft_strcpy(dest, "");
          if (dest[0] != '\0')
          {
              printf("obtenu : dest[0] = '%c'\nattendu : dest[0] = '\\0'\n", dest[0]);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "gere les caracteres speciaux"
    input: 'char dest[30]; ft_strcpy(dest, "Line1\nTab\tEnd");'
    main: |
      #include <stdio.h>
      #include <string.h>
      char *ft_strcpy(char *dest, char *src);

      int main(void)
      {
          char dest[30];
          char *src = "Line1\nTab\tEnd";

          ft_strcpy(dest, src);
          if (strcmp(dest, src) != 0)
          {
              printf("obtenu : dest = \"%s\"\nattendu : dest = \"Line1\\nTab\\tEnd\"\n", dest);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "n'ecrit rien au-dela du terminateur nul"
    input: 'char dest[10] = "ZZZZZZZZZZ"; ft_strcpy(dest, "ab");'
    main: |
      #include <stdio.h>
      #include <string.h>
      char *ft_strcpy(char *dest, char *src);

      int main(void)
      {
          char dest[10];

          memset(dest, 'Z', sizeof(dest));
          ft_strcpy(dest, "ab");
          if (dest[0] != 'a' || dest[1] != 'b' || dest[2] != '\0')
          {
              printf("obtenu : dest = ['%c','%c',%d]\nattendu : dest = ['a','b',0]\n", dest[0], dest[1], dest[2]);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "ecrase correctement une chaine plus longue deja presente dans dest"
    input: 'char dest[30] = "une chaine tres longue ici"; ft_strcpy(dest, "courte");'
    main: |
      #include <stdio.h>
      #include <string.h>
      char *ft_strcpy(char *dest, char *src);

      int main(void)
      {
          char dest[30] = "une chaine tres longue ici";

          ft_strcpy(dest, "courte");
          if (strcmp(dest, "courte") != 0)
          {
              printf("obtenu : dest = \"%s\"\nattendu : dest = \"courte\"\n", dest);
              return (1);
          }
          return (0);
      }
    expected_exit: 0
