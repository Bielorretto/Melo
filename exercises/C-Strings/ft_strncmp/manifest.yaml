name: ft_strncmp
tags: ["piscine", "ex3", "strings"]

sources:
  - ft_strncmp.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

tests:

  - name: "compare seulement les n premiers caracteres (identiques au-dela)"
    input: 'ft_strncmp("bonjour", "bonsoir", 3)'
    main: |
      #include <stdio.h>
      int ft_strncmp(char *s1, char *s2, unsigned int n);

      int main(void)
      {
          int res = ft_strncmp("bonjour", "bonsoir", 3);

          if (res != 0)
          {
              printf("obtenu : %d\nattendu : 0\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "difference detectee dans la limite n"
    input: 'ft_strncmp("bonjour", "bonsoir", 4)'
    main: |
      #include <stdio.h>
      int ft_strncmp(char *s1, char *s2, unsigned int n);

      int main(void)
      {
          int res = ft_strncmp("bonjour", "bonsoir", 4);

          if (res >= 0)
          {
              printf("obtenu : %d\nattendu : une valeur negative ('j' < 's')\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "n=0 retourne toujours 0"
    input: 'ft_strncmp("abc", "xyz", 0)'
    main: |
      #include <stdio.h>
      int ft_strncmp(char *s1, char *s2, unsigned int n);

      int main(void)
      {
          int res = ft_strncmp("abc", "xyz", 0);

          if (res != 0)
          {
              printf("obtenu : %d\nattendu : 0\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "n plus grand que les deux chaines egales retourne 0"
    input: 'ft_strncmp("abc", "abc", 10)'
    main: |
      #include <stdio.h>
      int ft_strncmp(char *s1, char *s2, unsigned int n);

      int main(void)
      {
          int res = ft_strncmp("abc", "abc", 10);

          if (res != 0)
          {
              printf("obtenu : %d\nattendu : 0\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "prefixe identique dans la limite n malgre des longueurs differentes"
    input: 'ft_strncmp("abc", "abcdef", 3)'
    main: |
      #include <stdio.h>
      int ft_strncmp(char *s1, char *s2, unsigned int n);

      int main(void)
      {
          int res = ft_strncmp("abc", "abcdef", 3);

          if (res != 0)
          {
              printf("obtenu : %d\nattendu : 0\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0
