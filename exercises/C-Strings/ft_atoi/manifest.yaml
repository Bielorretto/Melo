name: ft_atoi
tags: ["piscine", "ex7", "strings"]

sources:
  - ft_atoi.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

tests:

  - name: "nombre simple sans espaces ni signes"
    input: 'ft_atoi("1234")'
    main: |
      #include <stdio.h>
      int ft_atoi(char *str);

      int main(void)
      {
          int res = ft_atoi("1234");

          if (res != 1234)
          {
              printf("obtenu : %d\nattendu : 1234\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "espaces en tete ignores"
    input: 'ft_atoi("   42")'
    main: |
      #include <stdio.h>
      int ft_atoi(char *str);

      int main(void)
      {
          int res = ft_atoi("   42");

          if (res != 42)
          {
              printf("obtenu : %d\nattendu : 42\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "signe negatif simple"
    input: 'ft_atoi("-42")'
    main: |
      #include <stdio.h>
      int ft_atoi(char *str);

      int main(void)
      {
          int res = ft_atoi("-42");

          if (res != -42)
          {
              printf("obtenu : %d\nattendu : -42\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "exemple du sujet : signes multiples et lettres apres les chiffres"
    input: 'ft_atoi(" --+-+1234ab567")'
    main: |
      #include <stdio.h>
      int ft_atoi(char *str);

      int main(void)
      {
          int res = ft_atoi(" --+-+1234ab567");

          if (res != -1234)
          {
              printf("obtenu : %d\nattendu : -1234\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "arret au premier caractere non numerique"
    input: 'ft_atoi("567abc")'
    main: |
      #include <stdio.h>
      int ft_atoi(char *str);

      int main(void)
      {
          int res = ft_atoi("567abc");

          if (res != 567)
          {
              printf("obtenu : %d\nattendu : 567\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "nombre pair de signes moins donne un resultat positif"
    input: 'ft_atoi("--42")'
    main: |
      #include <stdio.h>
      int ft_atoi(char *str);

      int main(void)
      {
          int res = ft_atoi("--42");

          if (res != 42)
          {
              printf("obtenu : %d\nattendu : 42\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "chaine sans chiffres retourne 0"
    input: 'ft_atoi("abc")'
    main: |
      #include <stdio.h>
      int ft_atoi(char *str);

      int main(void)
      {
          int res = ft_atoi("abc");

          if (res != 0)
          {
              printf("obtenu : %d\nattendu : 0\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "chaine vide retourne 0"
    input: 'ft_atoi("")'
    main: |
      #include <stdio.h>
      int ft_atoi(char *str);

      int main(void)
      {
          int res = ft_atoi("");

          if (res != 0)
          {
              printf("obtenu : %d\nattendu : 0\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "signes plus multiples n'affectent pas le signe"
    input: 'ft_atoi("+++42")'
    main: |
      #include <stdio.h>
      int ft_atoi(char *str);

      int main(void)
      {
          int res = ft_atoi("+++42");

          if (res != 42)
          {
              printf("obtenu : %d\nattendu : 42\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0
