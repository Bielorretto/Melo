name: ft_strcmp
tags: ["piscine", "ex2", "strings"]

sources:
  - ft_strcmp.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

tests:

  - name: "chaines identiques retournent 0"
    input: 'ft_strcmp("bonjour", "bonjour")'
    main: |
      #include <stdio.h>
      int ft_strcmp(char *s1, char *s2);

      int main(void)
      {
          int res = ft_strcmp("bonjour", "bonjour");

          if (res != 0)
          {
              printf("obtenu : %d\nattendu : 0\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "s1 lexicographiquement plus petite retourne une valeur negative"
    input: 'ft_strcmp("abc", "abd")'
    main: |
      #include <stdio.h>
      int ft_strcmp(char *s1, char *s2);

      int main(void)
      {
          int res = ft_strcmp("abc", "abd");

          if (res >= 0)
          {
              printf("obtenu : %d\nattendu : une valeur negative\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "s1 lexicographiquement plus grande retourne une valeur positive"
    input: 'ft_strcmp("abd", "abc")'
    main: |
      #include <stdio.h>
      int ft_strcmp(char *s1, char *s2);

      int main(void)
      {
          int res = ft_strcmp("abd", "abc");

          if (res <= 0)
          {
              printf("obtenu : %d\nattendu : une valeur positive\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "une chaine prefixe de l'autre est consideree inferieure"
    input: 'ft_strcmp("abc", "abcdef"); ft_strcmp("abcdef", "abc")'
    main: |
      #include <stdio.h>
      int ft_strcmp(char *s1, char *s2);

      int main(void)
      {
          int res1 = ft_strcmp("abc", "abcdef");
          int res2 = ft_strcmp("abcdef", "abc");

          if (res1 >= 0 || res2 <= 0)
          {
              printf("obtenu : %d puis %d\nattendu : une valeur negative puis une valeur positive\n", res1, res2);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "chaines vides sont egales"
    input: 'ft_strcmp("", "")'
    main: |
      #include <stdio.h>
      int ft_strcmp(char *s1, char *s2);

      int main(void)
      {
          int res = ft_strcmp("", "");

          if (res != 0)
          {
              printf("obtenu : %d\nattendu : 0\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "une chaine vide est inferieure a une chaine non vide"
    input: 'ft_strcmp("", "a")'
    main: |
      #include <stdio.h>
      int ft_strcmp(char *s1, char *s2);

      int main(void)
      {
          int res = ft_strcmp("", "a");

          if (res >= 0)
          {
              printf("obtenu : %d\nattendu : une valeur negative\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0
