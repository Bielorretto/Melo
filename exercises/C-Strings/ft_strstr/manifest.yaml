name: ft_strstr
tags: ["piscine", "ex6", "strings"]

sources:
  - ft_strstr.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

tests:

  - name: "trouve une sous-chaine presente"
    main: |
      #include <stdio.h>
      #include <string.h>
      char *ft_strstr(char *str, char *to_find);

      int main(void)
      {
          char str[] = "hello world";
          char *res = ft_strstr(str, "world");

          if (!res || res != str + 6 || strcmp(res, "world") != 0)
          {
              printf("res = \"%s\" (attendu pointeur sur str+6, contenu \"world\")\n",
                     res ? res : "(NULL)");
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "sous-chaine absente retourne NULL"
    main: |
      #include <stdio.h>
      char *ft_strstr(char *str, char *to_find);

      int main(void)
      {
          char str[] = "hello world";
          char *res = ft_strstr(str, "xyz");

          if (res != NULL)
          {
              printf("ft_strstr aurait du retourner NULL\n");
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "sous-chaine vide retourne str lui-meme"
    main: |
      #include <stdio.h>
      char *ft_strstr(char *str, char *to_find);

      int main(void)
      {
          char str[] = "hello";
          char *res = ft_strstr(str, "");

          if (res != str)
          {
              printf("ft_strstr(str, \"\") devrait retourner str lui-meme\n");
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "trouve la premiere occurrence uniquement"
    main: |
      #include <stdio.h>
      char *ft_strstr(char *str, char *to_find);

      int main(void)
      {
          char str[] = "xxabcxxabc";
          char *res = ft_strstr(str, "abc");

          if (res != str + 2)
          {
              printf("ft_strstr n'a pas trouve la premiere occurrence\n");
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "la sous-chaine est egale a la chaine entiere"
    main: |
      #include <stdio.h>
      char *ft_strstr(char *str, char *to_find);

      int main(void)
      {
          char str[] = "test";
          char *res = ft_strstr(str, "test");

          if (res != str)
          {
              printf("ft_strstr devrait retourner str lui-meme\n");
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "sous-chaine plus longue que la chaine retourne NULL"
    main: |
      #include <stdio.h>
      char *ft_strstr(char *str, char *to_find);

      int main(void)
      {
          char str[] = "hi";
          char *res = ft_strstr(str, "hello");

          if (res != NULL)
          {
              printf("ft_strstr aurait du retourner NULL\n");
              return (1);
          }
          return (0);
      }
    expected_exit: 0
