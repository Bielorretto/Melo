name: ft_strstr
tags: ["piscine", "ex6", "strings"]

sources:
  - ft_strstr.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

tests:

  - name: "trouve une sous-chaine presente"
    input: 'char str[] = "hello world"; ft_strstr(str, "world");'
    main: |
      #include <stdio.h>
      #include <string.h>
      char *ft_strstr(char *str, char *to_find);

      int main(void)
      {
          char str[] = "hello world";
          char *res = ft_strstr(str, "world");

          if (!res || res != str + 6 || strcmp(res, "world") != 0)
          {
              printf("obtenu : "); if (res) printf("str + %ld (\"%s\")\n", (long)(res - str), res); else printf("NULL\n");
              printf("attendu : str + 6 (\"world\")\n");
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "sous-chaine absente retourne NULL"
    input: 'char str[] = "hello world"; ft_strstr(str, "xyz");'
    main: |
      #include <stdio.h>
      char *ft_strstr(char *str, char *to_find);

      int main(void)
      {
          char str[] = "hello world";
          char *res = ft_strstr(str, "xyz");

          if (res != NULL)
          {
              printf("obtenu : "); if (res) printf("str + %ld (\"%s\")\n", (long)(res - str), res); else printf("NULL\n");
              printf("attendu : NULL\n");
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "sous-chaine vide retourne str lui-meme"
    input: 'char str[] = "hello"; ft_strstr(str, "");'
    main: |
      #include <stdio.h>
      char *ft_strstr(char *str, char *to_find);

      int main(void)
      {
          char str[] = "hello";
          char *res = ft_strstr(str, "");

          if (res != str)
          {
              printf("obtenu : "); if (res) printf("str + %ld (\"%s\")\n", (long)(res - str), res); else printf("NULL\n");
              printf("attendu : str + 0 (\"hello\")\n");
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "trouve la premiere occurrence uniquement"
    input: 'char str[] = "xxabcxxabc"; ft_strstr(str, "abc");'
    main: |
      #include <stdio.h>
      char *ft_strstr(char *str, char *to_find);

      int main(void)
      {
          char str[] = "xxabcxxabc";
          char *res = ft_strstr(str, "abc");

          if (res != str + 2)
          {
              printf("obtenu : "); if (res) printf("str + %ld (\"%s\")\n", (long)(res - str), res); else printf("NULL\n");
              printf("attendu : str + 2 (\"abcxxabc\")\n");
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "la sous-chaine est egale a la chaine entiere"
    input: 'char str[] = "test"; ft_strstr(str, "test");'
    main: |
      #include <stdio.h>
      char *ft_strstr(char *str, char *to_find);

      int main(void)
      {
          char str[] = "test";
          char *res = ft_strstr(str, "test");

          if (res != str)
          {
              printf("obtenu : "); if (res) printf("str + %ld (\"%s\")\n", (long)(res - str), res); else printf("NULL\n");
              printf("attendu : str + 0 (\"test\")\n");
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "sous-chaine plus longue que la chaine retourne NULL"
    input: 'char str[] = "hi"; ft_strstr(str, "hello");'
    main: |
      #include <stdio.h>
      char *ft_strstr(char *str, char *to_find);

      int main(void)
      {
          char str[] = "hi";
          char *res = ft_strstr(str, "hello");

          if (res != NULL)
          {
              printf("obtenu : "); if (res) printf("str + %ld (\"%s\")\n", (long)(res - str), res); else printf("NULL\n");
              printf("attendu : NULL\n");
              return (1);
          }
          return (0);
      }
    expected_exit: 0
