name: ft_recursive_power
tags: ["piscine", "ex3", "arithmetique"]

sources:
  - ft_recursive_power.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

tests:

  - name: "cas special : 0 puissance 0 vaut 1"
    input: 'ft_recursive_power(0, 0)'
    main: |
      #include <stdio.h>
      int ft_recursive_power(int nb, int power);
      int main(void)
      {
          int res = ft_recursive_power(0, 0);
          if (res != 1)
          {
              printf("obtenu : %d\nattendu : 1\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "n'importe quel nombre puissance 0 vaut 1"
    input: 'ft_recursive_power(5, 0)'
    main: |
      #include <stdio.h>
      int ft_recursive_power(int nb, int power);
      int main(void)
      {
          int res = ft_recursive_power(5, 0);
          if (res != 1)
          {
              printf("obtenu : %d\nattendu : 1\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "0 puissance un nombre positif vaut 0"
    input: 'ft_recursive_power(0, 5)'
    main: |
      #include <stdio.h>
      int ft_recursive_power(int nb, int power);
      int main(void)
      {
          int res = ft_recursive_power(0, 5);
          if (res != 0)
          {
              printf("obtenu : %d\nattendu : 0\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "puissance 1 retourne le nombre lui-meme"
    input: 'ft_recursive_power(7, 1)'
    main: |
      #include <stdio.h>
      int ft_recursive_power(int nb, int power);
      int main(void)
      {
          int res = ft_recursive_power(7, 1);
          if (res != 7)
          {
              printf("obtenu : %d\nattendu : 7\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "cas simple : 2 puissance 10 vaut 1024"
    input: 'ft_recursive_power(2, 10)'
    main: |
      #include <stdio.h>
      int ft_recursive_power(int nb, int power);
      int main(void)
      {
          int res = ft_recursive_power(2, 10);
          if (res != 1024)
          {
              printf("obtenu : %d\nattendu : 1024\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "base negative, puissance paire (resultat positif)"
    input: 'ft_recursive_power(-2, 4)'
    main: |
      #include <stdio.h>
      int ft_recursive_power(int nb, int power);
      int main(void)
      {
          int res = ft_recursive_power(-2, 4);
          if (res != 16)
          {
              printf("obtenu : %d\nattendu : 16\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "base negative, puissance impaire (resultat negatif)"
    input: 'ft_recursive_power(-2, 3)'
    main: |
      #include <stdio.h>
      int ft_recursive_power(int nb, int power);
      int main(void)
      {
          int res = ft_recursive_power(-2, 3);
          if (res != -8)
          {
              printf("obtenu : %d\nattendu : -8\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "puissance negative retourne 0 (nombre positif)"
    input: 'ft_recursive_power(5, -1)'
    main: |
      #include <stdio.h>
      int ft_recursive_power(int nb, int power);
      int main(void)
      {
          int res = ft_recursive_power(5, -1);
          if (res != 0)
          {
              printf("obtenu : %d\nattendu : 0\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "conflit des deux regles : 0 puissance negative doit rester 0"
    input: 'ft_recursive_power(0, -3)'
    # Comme pour la version iterative : si le test "nb == 0" passe avant le
    # test "power < 0", on risque de retourner 1 au lieu de 0 ici.
    main: |
      #include <stdio.h>
      int ft_recursive_power(int nb, int power);
      int main(void)
      {
          int res = ft_recursive_power(0, -3);
          if (res != 0)
          {
              printf("obtenu : %d\nattendu : 0\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "1 puissance grand nombre reste 1"
    input: 'ft_recursive_power(1, 1000)'
    main: |
      #include <stdio.h>
      int ft_recursive_power(int nb, int power);
      int main(void)
      {
          int res = ft_recursive_power(1, 1000);
          if (res != 1)
          {
              printf("obtenu : %d\nattendu : 1\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "pas de stack overflow sur une puissance negative de grande magnitude"
    input: 'ft_recursive_power(2, INT_MIN + 1)'
    # Piege specifique a la version RECURSIVE : si le cas "power < 0" n'est
    # pas verifie a CHAQUE appel recursif mais seulement au premier, la
    # fonction peut recurser indefiniment (power devient de plus en plus
    # negatif ou ne converge jamais vers le cas de base) et faire un stack
    # overflow au lieu de retourner 0 immediatement.
    main: |
      #include <stdio.h>
      #include <limits.h>
      int ft_recursive_power(int nb, int power);
      int main(void)
      {
          int res = ft_recursive_power(2, INT_MIN + 1);
          if (res != 0)
          {
              printf("obtenu : %d\nattendu : 0\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0
    check_memory: false