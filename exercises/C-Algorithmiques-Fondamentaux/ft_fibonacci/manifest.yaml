name: ft_fibonacci
tags: ["piscine", "ex4", "arithmetique"]

sources:
  - ft_fibonacci.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

tests:

  - name: "indice 0 vaut 0"
    input: 'ft_fibonacci(0)'
    main: |
      #include <stdio.h>
      int ft_fibonacci(int index);
      int main(void)
      {
          int res = ft_fibonacci(0);
          if (res != 0)
          {
              printf("obtenu : %d\nattendu : 0\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "indice 1 vaut 1"
    input: 'ft_fibonacci(1)'
    main: |
      #include <stdio.h>
      int ft_fibonacci(int index);
      int main(void)
      {
          int res = ft_fibonacci(1);
          if (res != 1)
          {
              printf("obtenu : %d\nattendu : 1\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "indice 2 vaut 1 (0 + 1)"
    input: 'ft_fibonacci(2)'
    main: |
      #include <stdio.h>
      int ft_fibonacci(int index);
      int main(void)
      {
          int res = ft_fibonacci(2);
          if (res != 1)
          {
              printf("obtenu : %d\nattendu : 1\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "indice 3 vaut 2"
    input: 'ft_fibonacci(3)'
    main: |
