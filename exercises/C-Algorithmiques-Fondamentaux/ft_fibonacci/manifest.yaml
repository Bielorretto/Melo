      int main(void)
      {
          int res = ft_fibonacci(20);
          if (res != 6765)
          {
              printf("obtenu : %d\nattendu : 6765\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "indice negatif : -1 retourne -1"
    input: 'ft_fibonacci(-1)'
    main: |
      #include <stdio.h>
      int ft_fibonacci(int index);
      int main(void)
      {
          int res = ft_fibonacci(-1);
          if (res != -1)
          {
              printf("obtenu : %d\nattendu : -1\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "indice negatif quelconque retourne -1"
    input: 'ft_fibonacci(-42)'
    main: |
      #include <stdio.h>
      int ft_fibonacci(int index);
      int main(void)
      {
          int res = ft_fibonacci(-42);
          if (res != -1)
          {
              printf("obtenu : %d\nattendu : -1\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "pas de stack overflow sur un indice tres negatif"
    input: 'ft_fibonacci(INT_MIN + 1)'
    # Meme piege que sur ft_recursive_power / ft_recursive_factorial : si le
    # test "index < 0" n'est verifie qu'au tout premier appel, une fonction
    # recursive mal ecrite peut ne jamais atteindre son cas de base et faire
    # un stack overflow au lieu de retourner -1 immediatement.
    main: |
      #include <stdio.h>
      #include <limits.h>
      int ft_fibonacci(int index);
      int main(void)
      {
          int res = ft_fibonacci(INT_MIN + 1);
          if (res != -1)
          {
              printf("obtenu : %d\nattendu : -1\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0
    check_memory: false

  - name: "temps d'execution raisonnable pour un indice modere (pas de memoisation requise mais pas de blocage)"
    input: 'ft_fibonacci(30)'
    # ft_fibonacci(30) implique environ 2.7 millions d'appels recursifs avec
    # l'implementation naive (sans memoisation), ce qui reste executable en
    # quelques centaines de ms sur une machine normale. Ce test verifie juste
    # que la fonction ne part pas dans une explosion combinatoire ingerable
    # ou une recursion infinie deguisee.
    main: |
      #include <stdio.h>
      int ft_fibonacci(int index);
      int main(void)
      {
          int res = ft_fibonacci(30);
          if (res != 832040)
          {
              printf("obtenu : %d\nattendu : 832040\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0
    timeout: 10