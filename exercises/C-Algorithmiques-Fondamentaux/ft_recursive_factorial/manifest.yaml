name: ft_recursive_factorial
tags: ["piscine", "ex1", "arithmetique"]

sources:
  - ft_recursive_factorial.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

tests:

  - name: "factorielle de 0 vaut 1"
    input: 'ft_recursive_factorial(0)'
    main: |
      #include <stdio.h>
      int ft_recursive_factorial(int nb);
      int main(void)
      {
          int res = ft_recursive_factorial(0);
          if (res != 1)
          {
              printf("obtenu : %d\nattendu : 1\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "factorielle de 1 vaut 1"
    input: 'ft_recursive_factorial(1)'
    main: |
      #include <stdio.h>
      int ft_recursive_factorial(int nb);
      int main(void)
      {
          int res = ft_recursive_factorial(1);
          if (res != 1)
          {
              printf("obtenu : %d\nattendu : 1\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "factorielle de 2 vaut 2"
    input: 'ft_recursive_factorial(2)'
    main: |
      #include <stdio.h>
      int ft_recursive_factorial(int nb);
      int main(void)
      {
          int res = ft_recursive_factorial(2);
          if (res != 2)
          {
              printf("obtenu : %d\nattendu : 2\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "factorielle de 5 vaut 120"
    input: 'ft_recursive_factorial(5)'
    main: |
      #include <stdio.h>
      int ft_recursive_factorial(int nb);
      int main(void)
      {
          int res = ft_recursive_factorial(5);
          if (res != 120)
          {
              printf("obtenu : %d\nattendu : 120\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "factorielle de 10 vaut 3628800"
    input: 'ft_recursive_factorial(10)'
    main: |
      #include <stdio.h>
      int ft_recursive_factorial(int nb);
      int main(void)
      {
          int res = ft_recursive_factorial(10);
          if (res != 3628800)
          {
              printf("obtenu : %d\nattendu : 3628800\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "factorielle de 12 (plus grande valeur sans overflow sur un int)"
    input: 'ft_recursive_factorial(12)'
    # 12! = 479001600, rentre dans un int (max 2147483647).
    # 13! depasse deja INT_MAX, non teste car l'overflow n'est pas a gerer.
    main: |
      #include <stdio.h>
      int ft_recursive_factorial(int nb);
      int main(void)
      {
          int res = ft_recursive_factorial(12);
          if (res != 479001600)
          {
              printf("obtenu : %d\nattendu : 479001600\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "argument invalide : -1 retourne 0"
    input: 'ft_recursive_factorial(-1)'
    main: |
      #include <stdio.h>
      int ft_recursive_factorial(int nb);
      int main(void)
      {
          int res = ft_recursive_factorial(-1);
          if (res != 0)
          {
              printf("obtenu : %d\nattendu : 0\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "argument invalide : nombre negatif quelconque retourne 0"
    input: 'ft_recursive_factorial(-42)'
    main: |
      #include <stdio.h>
      int ft_recursive_factorial(int nb);
      int main(void)
      {
          int res = ft_recursive_factorial(-42);
          if (res != 0)
          {
              printf("obtenu : %d\nattendu : 0\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "pas de stack overflow sur un negatif eloigne de 0"
    input: 'ft_recursive_factorial(INT_MIN + 1)'
    # Piege specifique a la version RECURSIVE : une fonction qui ne teste
    # "nb < 0" qu'une fois avant de rappeler ft_recursive_factorial(nb - 1)
    # sans jamais revalider l'invalidite peut recurser des millions de fois
    # avant de planter en stack overflow, au lieu de retourner 0 immediatement
    # des le premier appel invalide.
    main: |
      #include <stdio.h>
      #include <limits.h>
      int ft_recursive_factorial(int nb);
      int main(void)
      {
          int res = ft_recursive_factorial(INT_MIN + 1);
          if (res != 0)
          {
              printf("obtenu : %d\nattendu : 0\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0
    check_memory: false