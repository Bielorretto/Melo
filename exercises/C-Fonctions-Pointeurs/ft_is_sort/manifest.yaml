name: ft_is_sort
tags: ["piscine", "ex4", "pointeurs_fonctions"]

sources:
  - ft_is_sort.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

tests:

  - name: "tableau croissant est trie"
    input: 'int tab[5] = {1, 2, 3, 4, 5}; ft_is_sort(tab, 5, &cmp_int);'
    main: |
      #include <stdio.h>
      int ft_is_sort(int *tab, int length, int (*f)(int, int));

      static int cmp_int(int a, int b)
      {
          return (a - b);
      }

      int main(void)
      {
          int tab[5] = {1, 2, 3, 4, 5};
          int res = ft_is_sort(tab, 5, &cmp_int);

          if (res != 1)
          {
              printf("obtenu : %d\nattendu : 1\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "tableau decroissant est trie"
    input: 'int tab[5] = {5, 4, 3, 2, 1}; ft_is_sort(tab, 5, &cmp_int);'
    main: |
      #include <stdio.h>
      int ft_is_sort(int *tab, int length, int (*f)(int, int));

      static int cmp_int(int a, int b)
      {
          return (a - b);
      }

      int main(void)
      {
          int tab[5] = {5, 4, 3, 2, 1};
          int res = ft_is_sort(tab, 5, &cmp_int);

          if (res != 1)
          {
              printf("obtenu : %d\nattendu : 1\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "tableau non trie retourne 0"
    input: 'int tab[5] = {1, 3, 2, 5, 4}; ft_is_sort(tab, 5, &cmp_int);'
    main: |
      #include <stdio.h>
      int ft_is_sort(int *tab, int length, int (*f)(int, int));

      static int cmp_int(int a, int b)
      {
          return (a - b);
      }

      int main(void)
      {
          int tab[5] = {1, 3, 2, 5, 4};
          int res = ft_is_sort(tab, 5, &cmp_int);

          if (res != 0)
          {
              printf("obtenu : %d\nattendu : 0\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "tableau avec elements egaux reste trie"
    input: 'int tab[5] = {2, 2, 2, 2, 2}; ft_is_sort(tab, 5, &cmp_int);'
    main: |
      #include <stdio.h>
      int ft_is_sort(int *tab, int length, int (*f)(int, int));

      static int cmp_int(int a, int b)
      {
          return (a - b);
      }

      int main(void)
      {
          int tab[5] = {2, 2, 2, 2, 2};
          int res = ft_is_sort(tab, 5, &cmp_int);

          if (res != 1)
          {
              printf("obtenu : %d\nattendu : 1\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "tableau vide ou d'un seul element est considere trie"
    input: 'int tab[1] = {42}; ft_is_sort(tab, 1, &cmp_int); ft_is_sort(tab, 0, &cmp_int);'
    main: |
      #include <stdio.h>
      int ft_is_sort(int *tab, int length, int (*f)(int, int));

      static int cmp_int(int a, int b)
      {
          return (a - b);
      }

      int main(void)
      {
          int tab[1] = {42};
          int res1 = ft_is_sort(tab, 1, &cmp_int);
          int res2 = ft_is_sort(tab, 0, &cmp_int);

          if (res1 != 1 || res2 != 1)
          {
              printf("obtenu : %d (taille 1) puis %d (taille 0)\nattendu : 1 (taille 1) puis 1 (taille 0)\n", res1, res2);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "utilise reellement la fonction de comparaison fournie"
    input: 'int tab[5] = {-1, 2, -3, 4, -5}; ft_is_sort(tab, 5, &cmp_abs);'
    main: |
      #include <stdio.h>
      #include <stdlib.h>
      int ft_is_sort(int *tab, int length, int (*f)(int, int));

      static int cmp_abs(int a, int b)
      {
          return (abs(a) - abs(b));
      }

      int main(void)
      {
          int tab[5] = {-1, 2, -3, 4, -5};
          int res = ft_is_sort(tab, 5, &cmp_abs);

          if (res != 1)
          {
              printf("obtenu : %d\nattendu : 1 (trie selon f, par valeur absolue croissante : il faut utiliser f)\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0
