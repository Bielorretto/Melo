name: ft_count_if
tags: ["piscine", "ex3", "pointeurs_fonctions"]

sources:
  - ft_count_if.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

tests:

  - name: "compte les chaines qui commencent par une majuscule"
    main: |
      #include <stdio.h>
      int ft_count_if(char **tab, int length, int (*f)(char *));

      static int starts_upper(char *s)
      {
          return (s[0] >= 'A' && s[0] <= 'Z');
      }

      int main(void)
      {
          char *tab[] = {"Bonjour", "monde", "Salut", "ca va"};
          int res = ft_count_if(tab, 4, &starts_upper);

          if (res != 2)
          {
              printf("ft_count_if = %d, attendu 2\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "retourne 0 si aucune correspondance"
    main: |
      #include <stdio.h>
      int ft_count_if(char **tab, int length, int (*f)(char *));

      static int is_digit_str(char *s)
      {
          return (s[0] >= '0' && s[0] <= '9');
      }

      int main(void)
      {
          char *tab[] = {"abc", "def"};
          int res = ft_count_if(tab, 2, &is_digit_str);

          if (res != 0)
          {
              printf("ft_count_if = %d, attendu 0\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "toutes les chaines correspondent"
    main: |
      #include <stdio.h>
      int ft_count_if(char **tab, int length, int (*f)(char *));

      static int always_true(char *s)
      {
          (void)s;
          return (1);
      }

      int main(void)
      {
          char *tab[] = {"a", "b", "c", "d"};
          int res = ft_count_if(tab, 4, &always_true);

          if (res != 4)
          {
              printf("ft_count_if = %d, attendu 4\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "length 0 retourne 0 sans lire le tableau"
    main: |
      #include <stdio.h>
      int ft_count_if(char **tab, int length, int (*f)(char *));

      static int calls = 0;

      static int track(char *s)
      {
          (void)s;
          calls++;
          return (1);
      }

      int main(void)
      {
          char *tab[] = {"x"};
          int res = ft_count_if(tab, 0, &track);

          if (calls != 0 || res != 0)
          {
              printf("calls=%d res=%d (attendu calls=0 res=0)\n", calls, res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "chaines vides comptees correctement"
    main: |
      #include <stdio.h>
      int ft_count_if(char **tab, int length, int (*f)(char *));

      static int is_empty(char *s)
      {
          return (*s == '\0');
      }

      int main(void)
      {
          char *tab[] = {"", "a", "", "b", ""};
          int res = ft_count_if(tab, 5, &is_empty);

          if (res != 3)
          {
              printf("ft_count_if = %d, attendu 3\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0
