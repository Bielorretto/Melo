name: ft_map
tags: ["piscine", "ex1", "pointeurs_fonctions"]

sources:
  - ft_map.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

tests:

  - name: "double chaque element, ordre conserve"
    main: |
      #include <stdio.h>
      #include <stdlib.h>
      int *ft_map(int *tab, int length, int (*f)(int));

      static int double_val(int n)
      {
          return (n * 2);
      }

      int main(void)
      {
          int tab[5] = {1, 2, 3, 4, 5};
          int expected[5] = {2, 4, 6, 8, 10};
          int *res = ft_map(tab, 5, &double_val);
          int i = 0;

          if (!res)
          {
              printf("ft_map a retourne NULL\n");
              return (1);
          }
          while (i < 5)
          {
              if (res[i] != expected[i])
              {
                  printf("res[%d] = %d, attendu %d\n", i, res[i], expected[i]);
                  free(res);
                  return (1);
              }
              i++;
          }
          free(res);
          return (0);
      }
    expected_exit: 0
    check_memory: true

  - name: "le tableau original n'est pas modifie"
    main: |
      #include <stdio.h>
      #include <stdlib.h>
      int *ft_map(int *tab, int length, int (*f)(int));

      static int square(int n)
      {
          return (n * n);
      }

      int main(void)
      {
          int tab[3] = {2, 3, 4};
          int *res = ft_map(tab, 3, &square);

          if (!res)
          {
              printf("ft_map a retourne NULL\n");
              return (1);
          }
          if (tab[0] != 2 || tab[1] != 3 || tab[2] != 4)
          {
              printf("le tableau original a ete modifie\n");
              free(res);
              return (1);
          }
          free(res);
          return (0);
      }
    expected_exit: 0
    check_memory: true

  - name: "gere correctement les nombres negatifs"
    main: |
      #include <stdio.h>
      #include <stdlib.h>
      int *ft_map(int *tab, int length, int (*f)(int));

      static int negate(int n)
      {
          return (-n);
      }

      int main(void)
      {
          int tab[3] = {-5, 0, 7};
          int expected[3] = {5, 0, -7};
          int *res = ft_map(tab, 3, &negate);
          int i = 0;

          if (!res)
          {
              printf("ft_map a retourne NULL\n");
              return (1);
          }
          while (i < 3)
          {
              if (res[i] != expected[i])
              {
                  printf("res[%d] = %d, attendu %d\n", i, res[i], expected[i]);
                  free(res);
                  return (1);
              }
              i++;
          }
          free(res);
          return (0);
      }
    expected_exit: 0
    check_memory: true

  - name: "fonction identite sur un seul element"
    main: |
      #include <stdio.h>
      #include <stdlib.h>
      int *ft_map(int *tab, int length, int (*f)(int));

      static int identity(int n)
      {
          return (n);
      }

      int main(void)
      {
          int tab[1] = {42};
          int *res = ft_map(tab, 1, &identity);

          if (!res || res[0] != 42)
          {
              printf("resultat incorrect pour un seul element\n");
              free(res);
              return (1);
          }
          free(res);
          return (0);
      }
    expected_exit: 0
    check_memory: true

  - name: "pas de fuite memoire sur un tableau plus grand"
    main: |
      #include <stdio.h>
      #include <stdlib.h>
      int *ft_map(int *tab, int length, int (*f)(int));

      static int inc(int n)
      {
          return (n + 1);
      }

      int main(void)
      {
          int tab[10];
          int *res;
          int i = 0;

          while (i < 10)
          {
              tab[i] = i;
              i++;
          }
          res = ft_map(tab, 10, &inc);
          if (!res)
          {
              printf("ft_map a retourne NULL\n");
              return (1);
          }
          i = 0;
          while (i < 10)
          {
              if (res[i] != i + 1)
              {
                  printf("res[%d] = %d, attendu %d\n", i, res[i], i + 1);
                  free(res);
                  return (1);
              }
              i++;
          }
          free(res);
          return (0);
      }
    expected_exit: 0
    check_memory: true
