  - name: "nombre total de combinaisons (120, donc 119 separateurs)"
    input: 'ft_print_comb()'
    main: |
      #include <stdio.h>
      #include <unistd.h>
      void ft_print_comb(void);

      int main(void)
      {
          int pipefd[2];
          pipe(pipefd);
          int saved = dup(STDOUT_FILENO);
          dup2(pipefd[1], STDOUT_FILENO);
          close(pipefd[1]);

          ft_print_comb();

          dup2(saved, STDOUT_FILENO);
          close(saved);

          char buffer[4096];
          size_t total = 0;
          ssize_t n;
          while ((n = read(pipefd[0], buffer + total, sizeof(buffer) - total - 1)) > 0)
              total += n;
          buffer[total] = '\0';
          close(pipefd[0]);

          int count = 0;
          for (size_t k = 0; k + 1 < total; k++)
          {
              if (buffer[k] == ',' && buffer[k + 1] == ' ')
                  count++;
          }
          if (count != 119)
          {
              printf("obtenu : %d separateurs \", \"\nattendu : 119 separateurs \", \" (120 combinaisons)\n", count);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "sequence complete exacte (comparaison programmatique)"
    input: 'ft_print_comb()'
    main: |
      #include <stdio.h>
      #include <string.h>
      #include <unistd.h>
      void ft_print_comb(void);

      int main(void)
      {
          int pipefd[2];
          pipe(pipefd);
          int saved = dup(STDOUT_FILENO);
          dup2(pipefd[1], STDOUT_FILENO);
          close(pipefd[1]);

          ft_print_comb();

          dup2(saved, STDOUT_FILENO);
          close(saved);

          char buffer[4096];
          size_t total = 0;
          ssize_t n;
          while ((n = read(pipefd[0], buffer + total, sizeof(buffer) - total - 1)) > 0)
              total += n;
          buffer[total] = '\0';
          close(pipefd[0]);

          char expected[4096];
          size_t pos = 0;
          for (int a = 0; a <= 7; a++)
          {
              for (int b = a + 1; b <= 8; b++)
              {
                  for (int c = b + 1; c <= 9; c++)
                  {
                      pos += sprintf(expected + pos, "%d%d%d", a, b, c);
                      if (!(a == 7 && b == 8 && c == 9))
                          pos += sprintf(expected + pos, ", ");
                  }
              }
          }
          expected[pos] = '\0';

          if (strcmp(buffer, expected) != 0)
          {
              size_t k = 0;
              while (expected[k] && buffer[k] && expected[k] == buffer[k])
                  k++;
              printf("obtenu : \"%.30s\" (a partir du caractere %zu)\nattendu : \"%.30s\" (a partir du caractere %zu)\n",
                     buffer + k, k, expected + k, k);
              return (1);
          }
          return (0);
      }
    expected_exit: 0