  - name: "derniere combinaison et fin de ligne propre (98 99)"
    input: 'ft_print_comb2()'
    main: |
      #include <stdio.h>
      #include <string.h>
      #include <unistd.h>
      void ft_print_comb2(void);

      int main(void)
      {
          int pipefd[2];
          pipe(pipefd);
          int saved = dup(STDOUT_FILENO);
          dup2(pipefd[1], STDOUT_FILENO);
          close(pipefd[1]);

          ft_print_comb2();

          dup2(saved, STDOUT_FILENO);
          close(saved);

          char buffer[64000];
          size_t total = 0;
          ssize_t n;
          while ((n = read(pipefd[0], buffer + total, sizeof(buffer) - total - 1)) > 0)
              total += n;
          buffer[total] = '\0';
          close(pipefd[0]);

          if (total < 6 || strcmp(buffer + total - 5, "98 99") != 0)
          {
              printf("obtenu : fin \"%.20s\"\nattendu : fin \"..., 97 98, 97 99, 98 99\" (rien apres 98 99)\n",
                     buffer + (total > 20 ? total - 20 : 0));
              return (1);
          }
          if (buffer[total - 2] == ',' || buffer[total - 2] == ' ')
          {
              printf("obtenu : fin \"%.20s\"\nattendu : fin \"..., 97 98, 97 99, 98 99\" (rien apres 98 99)\n",
                     buffer + (total > 20 ? total - 20 : 0));
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "nombre total de combinaisons (4950 paires, 4949 separateurs)"
    input: 'ft_print_comb2()'
    main: |
      #include <stdio.h>
      #include <unistd.h>
      void ft_print_comb2(void);

      int main(void)
      {
          int pipefd[2];
          pipe(pipefd);
          int saved = dup(STDOUT_FILENO);
          dup2(pipefd[1], STDOUT_FILENO);
