name: ft_print_comb2
tags: ["piscine", "ex2"]

sources:
  - ft_print_comb2.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

# Principe des tests : ft_print_comb2 écrit directement sur le fd 1 (write),
# donc chaque test redirige STDOUT vers un pipe avant d'appeler la fonction,
# capture ce qui a été écrit, puis vérifie le contenu. Ça évite d'avoir à
# coller 34000 caractères de sortie attendue dans le YAML.

tests:

  - name: "premiere combinaison et son format (00 01, 00 02)"
    input: 'ft_print_comb2()'
    main: |
      #include <stdio.h>
      #include <string.h>
      #include <unistd.h>
      void ft_print_comb2(void);

      int main(void)
      {
          int pipefd[2];
          pipe(pipefd);
          int saved = dup(STDOUT_FILENO);
          dup2(pipefd[1], STDOUT_FILENO);
          close(pipefd[1]);

          ft_print_comb2();

          dup2(saved, STDOUT_FILENO);
          close(saved);

          char buffer[64000];
          size_t total = 0;
          ssize_t n;
          while ((n = read(pipefd[0], buffer + total, sizeof(buffer) - total - 1)) > 0)
              total += n;
          buffer[total] = '\0';
          close(pipefd[0]);

          if (strncmp(buffer, "00 01, 00 02", 12) != 0)
          {
              printf("obtenu : debut \"%.20s\"\nattendu : debut \"00 01, 00 02, 00 03,\"\n", buffer);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

