          while ((n = read(pipefd[0], buffer + total, sizeof(buffer) - total - 1)) > 0)
              total += n;
          buffer[total] = '\0';
          close(pipefd[0]);

          int count = 0;
          for (size_t k = 0; k + 1 < total; k++)
          {
              if (buffer[k] == ',' && buffer[k + 1] == ' ')
                  count++;
          }
          if (count != 4949)
          {
              printf("obtenu : %d separateurs \", \"\nattendu : 4949 separateurs \", \" (4950 paires)\n", count);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "sequence complete exacte (comparaison programmatique)"
    input: 'ft_print_comb2()'
    main: |
      #include <stdio.h>
      #include <stdlib.h>
      #include <string.h>
      #include <unistd.h>
      void ft_print_comb2(void);

      int main(void)
      {
          int pipefd[2];
          pipe(pipefd);
          int saved = dup(STDOUT_FILENO);
          dup2(pipefd[1], STDOUT_FILENO);
          close(pipefd[1]);

          ft_print_comb2();

          dup2(saved, STDOUT_FILENO);
          close(saved);

          char buffer[64000];
          size_t total = 0;
          ssize_t n;
          while ((n = read(pipefd[0], buffer + total, sizeof(buffer) - total - 1)) > 0)
              total += n;
          buffer[total] = '\0';
          close(pipefd[0]);

          char expected[64000];
          size_t pos = 0;
          for (int i = 0; i <= 98; i++)
          {
              for (int j = i + 1; j <= 99; j++)
              {
                  pos += sprintf(expected + pos, "%02d %02d", i, j);
                  if (!(i == 98 && j == 99))
                      pos += sprintf(expected + pos, ", ");
              }
          }
          expected[pos] = '\0';

          if (strcmp(buffer, expected) != 0)
          {
              size_t k = 0;
              while (expected[k] && buffer[k] && expected[k] == buffer[k])
                  k++;
              printf("obtenu : \"%.30s\" (a partir du caractere %zu)\nattendu : \"%.30s\" (a partir du caractere %zu)\n",
                     buffer + k, k, expected + k, k);
              return (1);
          }
          return (0);
      }
    expected_exit: 0