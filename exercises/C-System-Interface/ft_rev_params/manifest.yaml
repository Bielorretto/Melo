name: ft_rev_params
tags: ["piscine", "ex2", "system"]
own_main: true

sources:
  - ft_rev_params.c

compile:
  compiler: cc
  flags: ["-Wall", "-Wextra", "-Werror"]
  extra: []

tests:
  - name: "trois arguments"
    args: ["un", "deux", "trois"]
    expected_stdout: "trois\ndeux\nun\n"
    expected_exit: 0

  - name: "aucun argument"
    args: []
    expected_stdout: ""
    expected_exit: 0

  - name: "un seul argument"
    args: ["seul"]
    expected_stdout: "seul\n"
    expected_exit: 0

  - name: "deux arguments"
    args: ["premier", "second"]
    expected_stdout: "second\npremier\n"
    expected_exit: 0

  - name: "arguments avec espaces internes"
    args: ["bonjour le monde", "salut"]
    expected_stdout: "salut\nbonjour le monde\n"
    expected_exit: 0

  - name: "beaucoup d'arguments"
    args: ["a", "b", "c", "d", "e", "f", "g"]
    expected_stdout: "g\nf\ne\nd\nc\nb\na\n"
    expected_exit: 0
