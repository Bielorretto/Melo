name: ft_strlen
tags: ["piscine", "ex8", "strings"]

sources:
  - ft_strlen.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

tests:

  - name: "longueur d'une chaine simple"
    input: 'ft_strlen("bonjour")'
    main: |
      #include <stdio.h>
      int ft_strlen(char *str);

      int main(void)
      {
          int res = ft_strlen("bonjour");

          if (res != 7)
          {
              printf("obtenu : %d\nattendu : 7\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "chaine vide retourne 0"
    input: 'ft_strlen("")'
    main: |
      #include <stdio.h>
      int ft_strlen(char *str);

      int main(void)
      {
          int res = ft_strlen("");

          if (res != 0)
          {
              printf("obtenu : %d\nattendu : 0\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "compte les espaces"
    input: 'ft_strlen("a b c")'
    main: |
      #include <stdio.h>
      int ft_strlen(char *str);

      int main(void)
      {
          int res = ft_strlen("a b c");

          if (res != 5)
          {
              printf("obtenu : %d\nattendu : 5\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "compte les caracteres speciaux"
    input: 'ft_strlen("a\tb\nc")'
    main: |
      #include <stdio.h>
      int ft_strlen(char *str);

      int main(void)
      {
          int res = ft_strlen("a\tb\nc");

          if (res != 5)
          {
              printf("obtenu : %d\nattendu : 5\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "longueur d'une chaine plus longue"
    input: 'ft_strlen("the quick brown fox")'
    main: |
      #include <stdio.h>
      int ft_strlen(char *str);

      int main(void)
      {
          int res = ft_strlen("the quick brown fox");

          if (res != 19)
          {
              printf("obtenu : %d\nattendu : 19\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0
