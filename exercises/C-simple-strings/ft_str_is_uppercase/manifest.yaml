name: ft_str_is_uppercase
tags: ["piscine", "ex3", "classification"]

sources:
  - ft_str_is_uppercase.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

tests:

  - name: "chaine entierement majuscule retourne 1"
    main: |
      #include <stdio.h>
      int ft_str_is_uppercase(char *str);

      int main(void)
      {
          int res = ft_str_is_uppercase("BONJOUR");

          if (res != 1)
          {
              printf("res = %d, attendu 1\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "chaine contenant une minuscule retourne 0"
    main: |
      #include <stdio.h>
      int ft_str_is_uppercase(char *str);

      int main(void)
      {
          int res = ft_str_is_uppercase("BONJOUr");

          if (res != 0)
          {
              printf("res = %d, attendu 0\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "chaine vide retourne 1"
    main: |
      #include <stdio.h>
      int ft_str_is_uppercase(char *str);

      int main(void)
      {
          int res = ft_str_is_uppercase("");

          if (res != 1)
          {
              printf("res = %d, attendu 1\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "chaine avec chiffre retourne 0"
    main: |
      #include <stdio.h>
      int ft_str_is_uppercase(char *str);

      int main(void)
      {
          int res = ft_str_is_uppercase("ABC1");

          if (res != 0)
          {
              printf("res = %d, attendu 0\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "chaine avec espace retourne 0"
    main: |
      #include <stdio.h>
      int ft_str_is_uppercase(char *str);

      int main(void)
      {
          int res = ft_str_is_uppercase("AB CD");

          if (res != 0)
          {
              printf("res = %d, attendu 0\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0
