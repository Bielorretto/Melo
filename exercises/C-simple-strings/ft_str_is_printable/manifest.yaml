name: ft_str_is_printable
tags: ["piscine", "ex4", "classification"]

sources:
  - ft_str_is_printable.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

tests:

  - name: "chaine entierement imprimable retourne 1"
    input: 'ft_str_is_printable("Hello, World! 123")'
    main: |
      #include <stdio.h>
      int ft_str_is_printable(char *str);

      int main(void)
      {
          int res = ft_str_is_printable("Hello, World! 123");

          if (res != 1)
          {
              printf("obtenu : %d\nattendu : 1\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "chaine contenant une tabulation retourne 0"
    input: 'ft_str_is_printable("abc\tdef")'
    main: |
      #include <stdio.h>
      int ft_str_is_printable(char *str);

      int main(void)
      {
          int res = ft_str_is_printable("abc\tdef");

          if (res != 0)
          {
              printf("obtenu : %d\nattendu : 0\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "chaine vide retourne 1"
    input: 'ft_str_is_printable("")'
    main: |
      #include <stdio.h>
      int ft_str_is_printable(char *str);

      int main(void)
      {
          int res = ft_str_is_printable("");

          if (res != 1)
          {
              printf("obtenu : %d\nattendu : 1\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "chaine contenant un retour a la ligne retourne 0"
    input: 'ft_str_is_printable("line1\nline2")'
    main: |
      #include <stdio.h>
      int ft_str_is_printable(char *str);

      int main(void)
      {
          int res = ft_str_is_printable("line1\nline2");

          if (res != 0)
          {
              printf("obtenu : %d\nattendu : 0\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "un espace simple est considere imprimable"
    input: 'ft_str_is_printable(" ")'
    main: |
      #include <stdio.h>
      int ft_str_is_printable(char *str);

      int main(void)
      {
          int res = ft_str_is_printable(" ");

          if (res != 1)
          {
              printf("obtenu : %d\nattendu : 1\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0
