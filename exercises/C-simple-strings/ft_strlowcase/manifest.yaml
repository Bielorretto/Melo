name: ft_strlowcase
tags: ["piscine", "ex6", "casse"]

sources:
  - ft_strlowcase.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

tests:

  - name: "met une chaine majuscule en minuscule"
    input: 'char str[20] = "BONJOUR"; ft_strlowcase(str);'
    main: |
      #include <stdio.h>
      #include <string.h>
      char *ft_strlowcase(char *str);

      int main(void)
      {
          char str[20] = "BONJOUR";

          ft_strlowcase(str);
          if (strcmp(str, "bonjour") != 0)
          {
              printf("obtenu : str = \"%s\"\nattendu : str = \"bonjour\"\n", str);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "ne modifie pas les caracteres non alphabetiques"
    input: 'char str[20] = "ABC123!"; ft_strlowcase(str);'
    main: |
      #include <stdio.h>
      #include <string.h>
      char *ft_strlowcase(char *str);

      int main(void)
      {
          char str[20] = "ABC123!";

          ft_strlowcase(str);
          if (strcmp(str, "abc123!") != 0)
          {
              printf("obtenu : str = \"%s\"\nattendu : str = \"abc123!\"\n", str);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "chaine deja en minuscule reste inchangee"
    input: 'char str[20] = "deja"; ft_strlowcase(str);'
    main: |
      #include <stdio.h>
      #include <string.h>
      char *ft_strlowcase(char *str);

      int main(void)
      {
          char str[20] = "deja";

          ft_strlowcase(str);
          if (strcmp(str, "deja") != 0)
          {
              printf("obtenu : str = \"%s\"\nattendu : str = \"deja\"\n", str);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "retourne bien le pointeur str"
    input: 'char str[20] = "TEST"; ft_strlowcase(str);'
    main: |
      #include <stdio.h>
      char *ft_strlowcase(char *str);

      int main(void)
      {
          char str[20] = "TEST";
          char *ret = ft_strlowcase(str);

          if (ret != str)
          {
              printf("obtenu : %s\nattendu : str (le pointeur recu en parametre)\n", ret == NULL ? "NULL" : "un autre pointeur que str");
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "chaine vide reste vide"
    input: 'char str[5] = ""; ft_strlowcase(str);'
    main: |
      #include <stdio.h>
      char *ft_strlowcase(char *str);

      int main(void)
      {
          char str[5] = "";

          ft_strlowcase(str);
          if (str[0] != '\0')
          {
              printf("obtenu : str = \"%s\"\nattendu : str = \"\"\n", str);
              return (1);
          }
          return (0);
      }
    expected_exit: 0
