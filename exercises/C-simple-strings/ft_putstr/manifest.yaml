name: ft_putstr
tags: ["piscine", "ex9", "strings"]

sources:
  - ft_putstr.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

tests:

  - name: "affiche une chaine simple sur stdout"
    main: |
      #include <stdio.h>
      #include <string.h>
      #include <unistd.h>
      void ft_putstr(char *str);

      int main(void)
      {
          int pipefd[2];
          pipe(pipefd);
          int saved = dup(STDOUT_FILENO);
          dup2(pipefd[1], STDOUT_FILENO);
          close(pipefd[1]);

          ft_putstr("Hello, World!");

          dup2(saved, STDOUT_FILENO);
          close(saved);

          char buffer[4096];
          size_t total = 0;
          ssize_t n;
          while ((n = read(pipefd[0], buffer + total, sizeof(buffer) - total - 1)) > 0)
              total += n;
          buffer[total] = '\0';
          close(pipefd[0]);

          if (strcmp(buffer, "Hello, World!") != 0)
          {
              printf("obtenu : \"%s\", attendu \"Hello, World!\"\n", buffer);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "n'ajoute pas de retour a la ligne"
    main: |
      #include <stdio.h>
      #include <string.h>
      #include <unistd.h>
      void ft_putstr(char *str);

      int main(void)
      {
          int pipefd[2];
          pipe(pipefd);
          int saved = dup(STDOUT_FILENO);
          dup2(pipefd[1], STDOUT_FILENO);
          close(pipefd[1]);

          ft_putstr("test");

          dup2(saved, STDOUT_FILENO);
          close(saved);

          char buffer[4096];
          size_t total = 0;
          ssize_t n;
          while ((n = read(pipefd[0], buffer + total, sizeof(buffer) - total - 1)) > 0)
              total += n;
          buffer[total] = '\0';
          close(pipefd[0]);

          if (total != 4 || strcmp(buffer, "test") != 0)
          {
              printf("obtenu : \"%s\" (%zu octets), attendu \"test\" (4 octets)\n", buffer, total);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "affiche une chaine vide sans erreur"
    main: |
      #include <stdio.h>
      #include <unistd.h>
      void ft_putstr(char *str);

      int main(void)
      {
          int pipefd[2];
          pipe(pipefd);
          int saved = dup(STDOUT_FILENO);
          dup2(pipefd[1], STDOUT_FILENO);
          close(pipefd[1]);

          ft_putstr("");

          dup2(saved, STDOUT_FILENO);
          close(saved);

          char buffer[10];
          ssize_t n = read(pipefd[0], buffer, sizeof(buffer));
          close(pipefd[0]);

          if (n != 0)
          {
              printf("%zd octet(s) ecrit(s) pour une chaine vide, attendu 0\n", n);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "affiche correctement une chaine contenant des espaces"
    main: |
      #include <stdio.h>
      #include <string.h>
      #include <unistd.h>
      void ft_putstr(char *str);

      int main(void)
      {
          int pipefd[2];
          pipe(pipefd);
          int saved = dup(STDOUT_FILENO);
          dup2(pipefd[1], STDOUT_FILENO);
          close(pipefd[1]);

          ft_putstr("un deux trois");

          dup2(saved, STDOUT_FILENO);
          close(saved);

          char buffer[4096];
          size_t total = 0;
          ssize_t n;
          while ((n = read(pipefd[0], buffer + total, sizeof(buffer) - total - 1)) > 0)
              total += n;
          buffer[total] = '\0';
          close(pipefd[0]);

          if (strcmp(buffer, "un deux trois") != 0)
          {
              printf("obtenu : \"%s\", attendu \"un deux trois\"\n", buffer);
              return (1);
          }
          return (0);
      }
    expected_exit: 0
