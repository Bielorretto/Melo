name: ft_strupcase
tags: ["piscine", "ex5", "casse"]

sources:
  - ft_strupcase.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

tests:

  - name: "met une chaine minuscule en majuscule"
    input: 'char str[20] = "bonjour"; ft_strupcase(str);'
    main: |
      #include <stdio.h>
      #include <string.h>
      char *ft_strupcase(char *str);

      int main(void)
      {
          char str[20] = "bonjour";

          ft_strupcase(str);
          if (strcmp(str, "BONJOUR") != 0)
          {
              printf("obtenu : str = \"%s\"\nattendu : str = \"BONJOUR\"\n", str);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "ne modifie pas les caracteres non alphabetiques"
    input: 'char str[20] = "abc123!"; ft_strupcase(str);'
    main: |
      #include <stdio.h>
      #include <string.h>
      char *ft_strupcase(char *str);

      int main(void)
      {
          char str[20] = "abc123!";

          ft_strupcase(str);
          if (strcmp(str, "ABC123!") != 0)
          {
              printf("obtenu : str = \"%s\"\nattendu : str = \"ABC123!\"\n", str);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "chaine deja en majuscule reste inchangee"
    input: 'char str[20] = "DEJA"; ft_strupcase(str);'
    main: |
      #include <stdio.h>
      #include <string.h>
      char *ft_strupcase(char *str);

      int main(void)
      {
          char str[20] = "DEJA";

          ft_strupcase(str);
          if (strcmp(str, "DEJA") != 0)
          {
              printf("obtenu : str = \"%s\"\nattendu : str = \"DEJA\"\n", str);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "retourne bien le pointeur str"
    input: 'char str[20] = "test"; ft_strupcase(str);'
    main: |
      #include <stdio.h>
      char *ft_strupcase(char *str);

      int main(void)
      {
          char str[20] = "test";
          char *ret = ft_strupcase(str);

          if (ret != str)
          {
              printf("obtenu : %s\nattendu : str (le pointeur recu en parametre)\n", ret == NULL ? "NULL" : "un autre pointeur que str");
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "chaine vide reste vide"
    input: 'char str[5] = ""; ft_strupcase(str);'
    main: |
      #include <stdio.h>
      char *ft_strupcase(char *str);

      int main(void)
      {
          char str[5] = "";

          ft_strupcase(str);
          if (str[0] != '\0')
          {
              printf("obtenu : str = \"%s\"\nattendu : str = \"\"\n", str);
              return (1);
          }
          return (0);
      }
    expected_exit: 0
