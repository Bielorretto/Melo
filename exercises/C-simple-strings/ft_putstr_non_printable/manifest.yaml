  - name: "remplace plusieurs caracteres non imprimables consecutifs"
    main: |
      #include <stdio.h>
      #include <string.h>
      #include <unistd.h>
      void ft_putstr_non_printable(char *str);

      int main(void)
      {
          int pipefd[2];
          pipe(pipefd);
          int saved = dup(STDOUT_FILENO);
          dup2(pipefd[1], STDOUT_FILENO);
          close(pipefd[1]);

          ft_putstr_non_printable("\x01\x02");

          dup2(saved, STDOUT_FILENO);
          close(saved);

          char buffer[4096];
          size_t total = 0;
          ssize_t n;
          while ((n = read(pipefd[0], buffer + total, sizeof(buffer) - total - 1)) > 0)
              total += n;
          buffer[total] = '\0';
          close(pipefd[0]);

          if (strcmp(buffer, "\\01\\02") != 0)
          {
              printf("obtenu : \"%s\", attendu \"\\01\\02\"\n", buffer);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "chaine vide n'affiche rien"
    main: |
      #include <stdio.h>
      #include <unistd.h>
      void ft_putstr_non_printable(char *str);

      int main(void)
      {
          int pipefd[2];
          pipe(pipefd);
          int saved = dup(STDOUT_FILENO);
          dup2(pipefd[1], STDOUT_FILENO);
          close(pipefd[1]);

          ft_putstr_non_printable("");

          dup2(saved, STDOUT_FILENO);
          close(saved);

          char buffer[10];
          ssize_t n = read(pipefd[0], buffer, sizeof(buffer));
          close(pipefd[0]);

          if (n != 0)
          {
              printf("%zd octet(s) ecrit(s) pour une chaine vide, attendu 0\n", n);
              return (1);
          }
          return (0);
      }
    expected_exit: 0
