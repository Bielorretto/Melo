name: ft_putstr_non_printable
tags: ["piscine", "ex10", "strings"]

sources:
  - ft_putstr_non_printable.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

tests:

  - name: "affiche une chaine entierement imprimable telle quelle"
    main: |
      #include <stdio.h>
      #include <string.h>
      #include <unistd.h>
      void ft_putstr_non_printable(char *str);

      int main(void)
      {
          int pipefd[2];
          pipe(pipefd);
          int saved = dup(STDOUT_FILENO);
          dup2(pipefd[1], STDOUT_FILENO);
          close(pipefd[1]);

          ft_putstr_non_printable("Hello, World!");

          dup2(saved, STDOUT_FILENO);
          close(saved);

          char buffer[4096];
          size_t total = 0;
          ssize_t n;
          while ((n = read(pipefd[0], buffer + total, sizeof(buffer) - total - 1)) > 0)
              total += n;
          buffer[total] = '\0';
          close(pipefd[0]);

          if (strcmp(buffer, "Hello, World!") != 0)
          {
              printf("obtenu : \"%s\", attendu \"Hello, World!\"\n", buffer);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

