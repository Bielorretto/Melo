name: ft_str_is_lowercase
tags: ["piscine", "ex2", "classification"]

sources:
  - ft_str_is_lowercase.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

tests:

  - name: "chaine entierement minuscule retourne 1"
    main: |
      #include <stdio.h>
      int ft_str_is_lowercase(char *str);

      int main(void)
      {
          int res = ft_str_is_lowercase("bonjour");

          if (res != 1)
          {
              printf("res = %d, attendu 1\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "chaine contenant une majuscule retourne 0"
    main: |
      #include <stdio.h>
      int ft_str_is_lowercase(char *str);

      int main(void)
      {
          int res = ft_str_is_lowercase("Bonjour");

          if (res != 0)
          {
              printf("res = %d, attendu 0\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "chaine vide retourne 1"
    main: |
      #include <stdio.h>
      int ft_str_is_lowercase(char *str);

      int main(void)
      {
          int res = ft_str_is_lowercase("");

          if (res != 1)
          {
              printf("res = %d, attendu 1\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "chaine avec chiffre retourne 0"
    main: |
      #include <stdio.h>
      int ft_str_is_lowercase(char *str);

      int main(void)
      {
          int res = ft_str_is_lowercase("abc1");

          if (res != 0)
          {
              printf("res = %d, attendu 0\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "chaine avec espace retourne 0"
    main: |
      #include <stdio.h>
      int ft_str_is_lowercase(char *str);

      int main(void)
      {
          int res = ft_str_is_lowercase("ab cd");

          if (res != 0)
          {
              printf("res = %d, attendu 0\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0
