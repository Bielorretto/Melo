name: ft_str_is_numeric
tags: ["piscine", "ex1", "classification"]

sources:
  - ft_str_is_numeric.c

compile:
  compiler: cc
  flags:
    - -Wall
    - -Wextra
    - -Werror

tests:

  - name: "chaine entierement numerique retourne 1"
    main: |
      #include <stdio.h>
      int ft_str_is_numeric(char *str);

      int main(void)
      {
          int res = ft_str_is_numeric("12345");

          if (res != 1)
          {
              printf("res = %d, attendu 1\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "chaine contenant une lettre retourne 0"
    main: |
      #include <stdio.h>
      int ft_str_is_numeric(char *str);

      int main(void)
      {
          int res = ft_str_is_numeric("123a5");

          if (res != 0)
          {
              printf("res = %d, attendu 0\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "chaine vide retourne 1"
    main: |
      #include <stdio.h>
      int ft_str_is_numeric(char *str);

      int main(void)
      {
          int res = ft_str_is_numeric("");

          if (res != 1)
          {
              printf("res = %d, attendu 1\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "un signe moins n'est pas un chiffre : retourne 0"
    main: |
      #include <stdio.h>
      int ft_str_is_numeric(char *str);

      int main(void)
      {
          int res = ft_str_is_numeric("-123");

          if (res != 0)
          {
              printf("res = %d, attendu 0\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0

  - name: "chaine avec espace retourne 0"
    main: |
      #include <stdio.h>
      int ft_str_is_numeric(char *str);

      int main(void)
      {
          int res = ft_str_is_numeric("12 3");

          if (res != 0)
          {
              printf("res = %d, attendu 0\n", res);
              return (1);
          }
          return (0);
      }
    expected_exit: 0
